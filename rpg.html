<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Maelist - Pixel Shooter v 0.4⚔️</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0; background: #111;
            font-family: 'Courier New', Courier, monospace; color: #fff;
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden; height: 100vh;
        }
        header { text-align: center; padding: 10px; width: 100%; background: #222; border-bottom: 4px solid #ff4757; z-index: 5; }
        h1 { margin: 0; font-size: 1.3rem; color: #ff4757; text-transform: uppercase; letter-spacing: 2px; }
        
        #game-container {
            position: relative; width: 100%; height: 60vh; background: #1a1a1a; 
            border-bottom: 4px solid #ff4757; overflow: hidden;
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            image-rendering: pixelated;
        }
        
        /* Overlays */
        #start-screen, #death-overlay, #shop-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 17, 17, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20;
        }
        #death-overlay, #shop-overlay { display: none; }
        
        .menu-box { background: #222; padding: 30px; border: 4px solid #ff4757; text-align: center; box-shadow: 0 0 20px rgba(255, 71, 87, 0.4); max-width: 90%; }
        .shop-box { background: #222; padding: 20px; border: 4px solid #ffa502; text-align: center; width: 300px; }
        
        .play-btn { background: #ff4757; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; font-family: inherit; cursor: pointer; margin-top: 15px; text-transform: uppercase;}
        .play-btn:disabled { background: #555; cursor: not-allowed; color: #888; }
        .shop-item-btn { background: #ffa502; color: #000; font-weight: bold; padding: 8px; width: 100%; border: none; margin: 5px 0; cursor: pointer; font-family: inherit; }

        #leaderboard {
            position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.85);
            padding: 10px 15px; border: 2px solid #ff4757;
            font-family: monospace; font-size: 11px; max-width: 200px; z-index: 10;
        }
        #leaderboard h3 { margin: 0 0 5px 0; color: #ff4757; text-transform: uppercase; }

        /* Twin-Stick Controls wie in Brawl Stars */
        #control-panel {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; flex-grow: 1; background: #161616; padding: 10px 30px;
        }
        .joycon-circle { width: 110px; height: 110px; background: rgba(255,255,255,0.05); border-radius: 50%; position: relative; border: 4px solid #444; touch-action: none; }
        .joycon-stick { width: 40px; height: 40px; border-radius: 50%; position: absolute; top: 31px; left: 31px; pointer-events: none;}
        
        /* Links Bewegung (Blau), Rechts Angriff/Zielen (Rot) */
        #move-circle { border-color: #3498db; }
        #move-stick { background: #3498db; }
        #atk-circle { border-color: #ff4757; }
        #atk-stick { background: #ff4757; }

        #lobby-status { font-size: 13px; color: #888; text-align: center; width: 100%; padding: 5px; background: #111;}
    </style>
</head>
<body>

<header>
    <h1>Brawl Stars Pixel Edition ⚔️</h1>
</header>
<div id="lobby-status">Lade Profildaten...</div>

<div id="game-container">
    <!-- Start -->
    <div id="start-screen">
        <div class="menu-box">
            <h2 style="margin:0; color:#ff4757;">WELT BETRETEN</h2>
            <p id="player-welcome">Verbinde...</p>
            <button class="play-btn" id="join-btn" disabled>BRAWL</button>
        </div>
    </div>

    <!-- Death -->
    <div id="death-overlay">
        <div class="menu-box" style="border-color: #d63031;">
            <h2 style="color: #ff4757; margin:0;">ELIMINIERT!</h2>
            <p style="color: #aaa; font-size: 12px;">Dein Level und Gold wurden gesichert.</p>
            <button class="play-btn" id="respawn-btn">Respawn</button>
        </div>
    </div>

    <!-- Shop -->
    <div id="shop-overlay">
        <div class="shop-box">
            <h3 style="color: #ffa502; margin: 0 0 10px 0;">SHOP</h3>
            <button class="shop-item-btn" id="buy-dmg-btn">Power-Upgrade (50 Gold)</button>
            <button class="shop-item-btn" id="buy-heal-btn">Heiltrank (15 Gold)</button>
            <button class="play-btn" style="background: #555;" id="close-shop-btn">Schließen</button>
        </div>
    </div>

    <div id="leaderboard">
        <h3>🏆 TOP SPIELER</h3>
        <div id="leaderboard-list">Lade...</div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<div id="control-panel">
    <!-- Links: Move -->
    <div class="joycon-circle" id="move-circle">
        <div class="joycon-stick" id="move-stick"></div>
    </div>
    <!-- Rechts: Aim & Shoot -->
    <div class="joycon-circle" id="atk-circle">
        <div class="joycon-stick" id="atk-stick"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue, update, onDisconnect, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.firebasestorage.app",
        messagingSenderId: "87392900284",
        appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameContainer = document.getElementById('game-container');
    const lobbyStatus = document.getElementById('lobby-status');
    const startScreen = document.getElementById('start-screen');
    const deathOverlay = document.getElementById('death-overlay');
    const shopOverlay = document.getElementById('shop-overlay');
    const leaderboardList = document.getElementById('leaderboard-list');

    const WORLD_WIDTH = 3000;
    const WORLD_HEIGHT = 3000;

    let myUid = null;
    let myUsername = "Anonym";
    let allPlayers = {};
    let serverBosses = {};
    let isPlaying = false;

    let player = {
        x: 1500, y: 1500, hp: 100, maxHp: 100,
        level: 1, exp: 0, nextLevelExp: 100,
        gold: 0, dmg: 15,
        color: '#3498db', attackTimer: 0, dirX: 0, dirY: 1,
        comboStep: 0, lastAttackTime: 0, comboResetTimer: 0
    };

    let obstacles = [];
    let buildings = [];
    let localEnemies = [];
    let lootGems = [];
    let damageNumbers = [];
    let projectiles = []; // Projektile für Shooter-Erlebnis

    // Joystick Variablen
    let joyMoveX = 0, joyMoveY = 0;
    let joyAtkX = 0, joyAtkY = 0;
    let isAiming = false;
    let keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    let controlMode = "keyboard";

    function generateWorldGrid() {
        buildings.push({ x: 1500, y: 1400, w: 120, h: 100, type: 'shop', name: "Dorf-Shop" });
        buildings.push({ x: 1700, y: 1420, w: 100, h: 90, type: 'gilde', name: "Kriegergilde" });

        for (let i = 0; i < 80; i++) {
            let obsX = Math.random() * (WORLD_WIDTH - 200) + 100;
            let obsY = Math.random() * (WORLD_HEIGHT - 200) + 100;
            if (Math.hypot(obsX - 1500, obsY - 1500) > 300) {
                obstacles.push({
                    x: obsX, y: obsY,
                    r: Math.random() > 0.4 ? 25 : 35,
                    type: Math.random() > 0.4 ? 'tree' : 'rock'
                });
            }
        }
    }
    generateWorldGrid();

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            myUid = user.uid;
            const userSnap = await get(ref(db, `users/${myUid}`));
            if(userSnap.exists()) myUsername = userSnap.val().username;

            onValue(ref(db, `games/rpg/saves/${myUid}`), (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    player.level = data.level || 1;
                    player.gold = data.gold || 0;
                    player.dmg = data.dmg || 15;
                    player.maxHp = 100 + (player.level * 10);
                }
                document.getElementById('player-welcome').innerText = `${myUsername} (Lvl ${player.level})`;
                document.getElementById('join-btn').disabled = false;
            }, { onlyOnce: true });

            onValue(ref(db, `games/rpg/bosses`), (snap) => {
                if (snap.exists()) serverBosses = snap.val();
            });

            onValue(ref(db, `games/rpg/players`), (snap) => {
                if (snap.exists()) { allPlayers = snap.val(); updateLeaderboard(); }
            });
        }
    });

    async function savePlayerData() {
        if (!myUid) return;
        await update(ref(db, `games/rpg/saves/${myUid}`), { level: player.level, gold: player.gold, dmg: player.dmg });
    }

    function enterWorld() {
        startScreen.style.display = 'none'; deathOverlay.style.display = 'none';
        player.hp = player.maxHp;
        player.x = 1500 + (Math.random() * 60 - 30); player.y = 1550 + (Math.random() * 60 - 30);
        localEnemies = [];
        for (let i = 0; i < 25; i++) spawnLocalEnemy();
        set(ref(db, `games/rpg/players/${myUid}`), { username: myUsername, x: player.x, y: player.y, level: player.level });
        isPlaying = true;
        requestAnimationFrame(gameLoop);
    }

    document.getElementById('join-btn').onclick = enterWorld;
    document.getElementById('respawn-btn').onclick = enterWorld;

    function spawnLocalEnemy() {
        let ex = Math.random() * WORLD_WIDTH; let ey = Math.random() * WORLD_HEIGHT;
        if (Math.hypot(ex - 1500, ey - 1500) > 400) {
            localEnemies.push({ x: ex, y: ey, hp: 45, maxHp: 45, speed: 1.6, id: Math.random() });
        }
    }

    function updateLeaderboard() {
        let list = Object.values(allPlayers);
        list.sort((a, b) => (b.level || 1) - (a.level || 1));
        let html = "";
        list.slice(0, 5).forEach((p, i) => { html += `<div>${i+1}. ${p.username} (LVL ${p.level || 1})</div>`; });
        leaderboardList.innerHTML = html;
    }

    function checkMapCollisions(oldX, oldY, newX, newY) {
        let resolved = { x: newX, y: newY };
        for (let obs of obstacles) {
            let dist = Math.hypot(resolved.x - obs.x, resolved.y - obs.y);
            if (dist < obs.r + 12) {
                let angle = Math.atan2(resolved.y - obs.y, resolved.x - obs.x);
                resolved.x = obs.x + Math.cos(angle) * (obs.r + 12);
                resolved.y = obs.y + Math.sin(angle) * (obs.r + 12);
            }
        }
        for (let b of buildings) {
            if (resolved.x + 16 > b.x && resolved.x - 16 < b.x + b.w && resolved.y + 16 > b.y && resolved.y - 16 < b.y + b.h) return { x: oldX, y: oldY };
        }
        return resolved;
    }

    // SCHIESSEN / COMBO SYSTEM
    function fireProjectile(vx, vy) {
        if (player.attackTimer > 0) return;

        let now = Date.now();
        if (now - player.lastAttackTime > 800) player.comboStep = 1;
        else player.comboStep = (player.comboStep % 3) + 1;
        
        player.lastAttackTime = now;
        player.comboResetTimer = 48;
        player.attackTimer = 14; // Cooldown zwischen Schüssen

        let pDmg = player.dmg;
        let pSize = 5;
        let pColor = '#fff';
        let pSpeed = 9;

        if (player.comboStep === 2) {
            pDmg = Math.floor(player.dmg * 1.3);
            pColor = '#3498db';
            pSize = 7;
        } else if (player.comboStep === 3) {
            pDmg = Math.floor(player.dmg * 2.1); // Super-Schuss Finisher
            pColor = '#ff4757';
            pSize = 12;
            pSpeed = 12;
        }

        projectiles.push({
            x: player.x, y: player.y,
            vx: vx * pSpeed, vy: vy * pSpeed,
            dmg: pDmg, size: pSize, color: pColor,
            range: player.comboStep === 3 ? 400 : 300,
            traveled: 0,
            isCrit: player.comboStep === 3
        });

        // Shop in Reichweite testen
        let shop = buildings[0];
        if (Math.hypot(player.x - (shop.x + 60), player.y - (shop.y + 50)) < 80) {
            isPlaying = false; shopOverlay.style.display = 'flex';
        }
    }

    // BRAWL STARS AUTO-AIM (Schießt auf nahen Gegner beim schnellen Tippen)
    function autoAim() {
        let target = null;
        let minDist = 300;
        localEnemies.forEach(e => {
            let d = Math.hypot(e.x - player.x, e.y - player.y);
            if (d < minDist) { minDist = d; target = e; }
        });
        for (let k in serverBosses) {
            let b = serverBosses[k];
            if (b.hp > 0) {
                let d = Math.hypot(b.x - player.x, b.y - player.y);
                if (d < minDist) { minDist = d; target = b; }
            }
        }

        if (target) {
            let angle = Math.atan2(target.y - player.y, target.x - player.x);
            fireProjectile(Math.cos(angle), Math.sin(angle));
        } else {
            fireProjectile(player.dirX, player.dirY); // Default nach vorne
        }
    }

    // LEFT JOYSTICK (Bewegung)
    const moveCircle = document.getElementById('move-circle');
    const moveStick = document.getElementById('move-stick');
    moveCircle.addEventListener('touchmove', (e) => {
        controlMode = "joystick";
        let rect = moveCircle.getBoundingClientRect();
        let dx = e.touches[0].clientX - (rect.left + rect.width / 2);
        let dy = e.touches[0].clientY - (rect.top + rect.height / 2);
        let dist = Math.hypot(dx, dy);
        if (dist > 35) { dx = (dx / dist) * 35; dy = (dy / dist) * 35; }
        moveStick.style.transform = `translate(${dx}px, ${dy}px)`;
        joyMoveX = dx / 35; joyMoveY = dy / 35;
    });
    moveCircle.addEventListener('touchend', () => {
        moveStick.style.transform = 'translate(0px, 0px)'; joyMoveX = 0; joyMoveY = 0;
    });

    // RIGHT JOYSTICK (Zielen & Schießen wie Brawl Stars)
    const atkCircle = document.getElementById('atk-circle');
    const atkStick = document.getElementById('atk-stick');
    let atkTouchStart = 0;

    atkCircle.addEventListener('touchstart', () => { atkTouchStart = Date.now(); isAiming = true; });
    atkCircle.addEventListener('touchmove', (e) => {
        let rect = atkCircle.getBoundingClientRect();
        // Finde den korrekten Touch auf dem rechten Stick
        let touch = Array.from(e.touches).find(t => t.clientX > window.innerWidth / 2);
        if (!touch) return;
        
        let dx = touch.clientX - (rect.left + rect.width / 2);
        let dy = touch.clientY - (rect.top + rect.height / 2);
        let dist = Math.hypot(dx, dy);
        
        if (dist > 35) { dx = (dx / dist) * 35; dy = (dy / dist) * 35; }
        atkStick.style.transform = `translate(${dx}px, ${dy}px)`;
        
        if (Math.hypot(dx, dy) > 10) {
            joyAtkX = dx / Math.hypot(dx, dy);
            joyAtkY = dy / Math.hypot(dx, dy);
        }
    });
    atkCircle.addEventListener('touchend', () => {
        atkStick.style.transform = 'translate(0px, 0px)';
        isAiming = false;
        
        // Wenn es nur ein schnelles Tippen war (< 200ms), benutze Auto-Aim
        if (Date.now() - atkTouchStart < 200 && Math.hypot(joyAtkX, joyAtkY) < 0.2) {
            autoAim();
        } else if (Math.hypot(joyAtkX, joyAtkY) > 0.4) {
            fireProjectile(joyAtkX, joyAtkY); // Gezielter Schuss
        }
        joyAtkX = 0; joyAtkY = 0;
    });

    // Tastatur-Support (Space für Auto-Aim / Schuss)
    window.addEventListener('keydown', (e) => { 
        if (e.key in keys) { keys[e.key] = true; controlMode = "keyboard"; } 
        if (e.code === 'Space') autoAim();
    });
    window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

    function gameLoop() {
        if (!isPlaying) return;
        requestAnimationFrame(gameLoop);

        // Bewegung berechnen
        let mx = controlMode === "keyboard" ? (keys.d - keys.a || keys.ArrowRight - keys.ArrowLeft) : joyMoveX;
        let my = controlMode === "keyboard" ? (keys.s - keys.w || keys.ArrowDown - keys.ArrowUp) : joyMoveY;

        let oldX = player.x, oldY = player.y;
        if (mx !== 0 || my !== 0) {
            let len = Math.hypot(mx, my);
            player.dirX = mx / len; player.dirY = my / len;
            player.x += player.dirX * 4.2; player.y += player.dirY * 4.2;
            
            let res = checkMapCollisions(oldX, oldY, player.x, player.y);
            player.x = Math.max(20, Math.min(WORLD_WIDTH - 20, res.x));
            player.y = Math.max(20, Math.min(WORLD_HEIGHT - 20, res.y));
        }

        if (player.attackTimer > 0) player.attackTimer--;
        if (player.comboResetTimer > 0) { player.comboResetTimer--; if(player.comboResetTimer === 0) player.comboStep = 0; }

        // Projektile fliegen lassen & Hits prüfen
        projectiles.forEach((p, pi) => {
            p.x += p.vx; p.y += p.vy;
            p.traveled += Math.hypot(p.vx, p.vy);

            if (p.traveled > p.range) { projectiles.splice(pi, 1); return; }

            // Kollision Projektil -> Gegner
            localEnemies.forEach((e, ei) => {
                if (Math.hypot(p.x - e.x, p.y - e.y) < e.hp / 2 + p.size) {
                    e.hp -= p.dmg;
                    e.x += p.vx * 1.5; e.y += p.vy * 1.5; // Rückstoß
                    damageNumbers.push({ x: e.x, y: e.y - 12, text: p.dmg, color: p.isCrit ? '#ff4757' : '#ffd32a', size: p.isCrit ? 16 : 11, timer: 25 });
                    projectiles.splice(pi, 1);
                    if (e.hp <= 0) {
                        lootGems.push({ x: e.x, y: e.y, gold: Math.floor(Math.random()*6)+4, exp: 35 });
                        localEnemies.splice(ei, 1); spawnLocalEnemy();
                    }
                }
            });
        });

        // Schadensnummern updaten
        damageNumbers.forEach((n, i) => { n.y -= 0.6; n.timer--; if(n.timer <= 0) damageNumbers.splice(i, 1); });

        // Gegner verfolgen Spieler
        localEnemies.forEach(e => {
            let d = Math.hypot(player.x - e.x, player.y - e.y);
            if (d < 250) {
                e.x += ((player.x - e.x)/d) * e.speed; e.y += ((player.y - e.y)/d) * e.speed;
                if (d < 22 && Math.random() < 0.04) { player.hp -= 4; if (player.hp <= 0) handlePlayerDeath(); }
            }
        });

        lootGems.forEach((g, i) => {
            if (Math.hypot(player.x - g.x, player.y - g.y) < 25) {
                player.gold += g.gold; player.exp += g.exp; lootGems.splice(i, 1);
                if (player.exp >= player.nextLevelExp) { player.level++; player.exp = 0; player.maxHp += 12; player.hp = player.maxHp; }
                savePlayerData();
            }
        });

        // RENDERN
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        let zoom = Math.max(canvas.width / 800, canvas.height / 500);
        ctx.translate(canvas.width / 2, canvas.height / 2); ctx.scale(zoom, zoom); ctx.translate(-player.x, -player.y);

        // Map-Boden
        ctx.fillStyle = '#228b22'; ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

        buildings.forEach(b => {
            ctx.fillStyle = '#4b6584'; ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.fillStyle = b.type === 'shop' ? '#ffa502' : '#57606f'; ctx.fillRect(b.x + 40, b.y + b.h - 35, 35, 35);
        });

        obstacles.forEach(obs => {
            ctx.fillStyle = obs.type === 'tree' ? '#20bf6b' : '#a5b1c2';
            ctx.fillRect(obs.x - obs.r, obs.y - obs.r, obs.r*2, obs.r*2);
        });

        lootGems.forEach(g => { ctx.fillStyle = '#fed330'; ctx.fillRect(g.x-4, g.y-4, 8, 8); });
        localEnemies.forEach(e => { ctx.fillStyle = '#eb3b5a'; ctx.fillRect(e.x - 12, e.y - 12, 24, 24); });

        // Projektile zeichnen
        projectiles.forEach(p => {
            ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 2*Math.PI); ctx.fill();
        });

        // Eigener Brawler (Spieler)
        ctx.fillStyle = player.color; ctx.fillRect(player.x - 15, player.y - 15, 30, 30);
        ctx.strokeStyle = '#000'; ctx.strokeRect(player.x - 15, player.y - 15, 30, 30);

        // BRAWL STARS ZIEL-LINIE (Wenn rechter Stick gezogen wird)
        if (isAiming && (Math.abs(joyAtkX) > 0.1 || Math.abs(joyAtkY) > 0.1)) {
            ctx.strokeStyle = 'rgba(235, 59, 90, 0.5)'; ctx.lineWidth = 4; ctx.setLineDash([6, 4]);
            ctx.beginPath(); ctx.moveTo(player.x, player.y);
            ctx.lineTo(player.x + joyAtkX * 220, player.y + joyAtkY * 220); ctx.stroke(); ctx.setLineDash([]);
        }

        // Schadenspopups & HP-Leiste
        damageNumbers.forEach(n => { ctx.fillStyle = n.color; ctx.font = `bold ${n.size}px monospace`; ctx.fillText(n.text, n.x - 6, n.y); });
        ctx.fillStyle = '#ff4757'; ctx.fillRect(player.x - 20, player.y - 25, 40, 4);
        ctx.fillStyle = '#2ed573'; ctx.fillRect(player.x - 20, player.y - 25, (player.hp / player.maxHp) * 40, 4);
        ctx.restore();

        // HUD
        ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(10, 10, 180, 50);
        ctx.fillStyle = '#fff'; ctx.font = '11px monospace';
        ctx.fillText(`LVL ${player.level} | EXP ${player.exp}`, 15, 26);
        ctx.fillText(`GOLD: ${player.gold}g | STEP: ${player.comboStep}`, 15, 44);
    }

    function handlePlayerDeath() { isPlaying = false; player.comboStep = 0; deathOverlay.style.display = 'flex'; }
    document.getElementById('buy-dmg-btn').onclick = () => buyUpgrade('dmg');
    document.getElementById('buy-heal-btn').onclick = () => buyUpgrade('heal');
    document.getElementById('close-shop-btn').onclick = () => { shopOverlay.style.display = 'none'; isPlaying = true; requestAnimationFrame(gameLoop); };

    function resizeCanvas() { canvas.width = gameContainer.clientWidth; canvas.height = gameContainer.clientHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();
</script>
</body>
</html>
