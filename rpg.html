<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Maelist - Pixel RPG MMO ⚔️</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0; background: #111;
            font-family: 'Courier New', Courier, monospace; color: #fff;
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden; height: 100vh;
        }
        header { text-align: center; padding: 10px; width: 100%; background: #222; border-bottom: 4px solid #ff4757; z-index: 5; }
        h1 { margin: 0; font-size: 1.3rem; color: #ff4757; text-transform: uppercase; letter-spacing: 2px; }
        
        #game-container {
            position: relative; width: 100%; height: 55vh; background: #1a1a1a; 
            border-bottom: 4px solid #ff4757; overflow: hidden;
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            image-rendering: pixelated;
        }
        
        /* Overlays */
        #start-screen, #death-overlay, #shop-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 17, 17, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20;
        }
        #death-overlay, #shop-overlay { display: none; }
        
        .menu-box { background: #222; padding: 30px; border: 4px solid #ff4757; text-align: center; box-shadow: 0 0 20px rgba(255, 71, 87, 0.4); max-width: 90%; }
        .shop-box { background: #222; padding: 20px; border: 4px solid #ffa502; text-align: center; width: 300px; }
        
        .play-btn { background: #ff4757; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; font-family: inherit; cursor: pointer; margin-top: 15px; text-transform: uppercase;}
        .play-btn:disabled { background: #555; cursor: not-allowed; color: #888; }
        .shop-item-btn { background: #ffa502; color: #000; font-weight: bold; padding: 8px; width: 100%; border: none; margin: 5px 0; cursor: pointer; font-family: inherit; }

        #leaderboard {
            position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.85);
            padding: 10px 15px; border: 2px solid #ff4757;
            font-family: monospace; font-size: 11px; max-width: 200px; z-index: 10;
        }
        #leaderboard h3 { margin: 0 0 5px 0; color: #ff4757; text-transform: uppercase; }

        /* Controls */
        #control-panel {
            display: flex; align-items: center; justify-content: center; gap: 40px;
            width: 100%; flex-grow: 1; background: #161616; padding: 10px;
        }
        .joycon-circle { width: 120px; height: 120px; background: #222; border-radius: 50%; position: relative; border: 4px solid #444; touch-action: none; }
        .joycon-stick { width: 44px; height: 44px; background: #ff4757; border-radius: 50%; position: absolute; top: 34px; left: 34px; }
        .action-btn {
            width: 80px; height: 80px; background: #ff4757; border: 4px solid #ff7f50;
            border-radius: 50%; color: white; font-weight: bold; font-size: 14px; font-family: inherit;
            display: flex; align-items: center; justify-content: center; touch-action: none; cursor: pointer;
            box-shadow: 0 4px 0 #cf2131;
        }
        .action-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #cf2131; }
        #lobby-status { font-size: 13px; color: #888; text-align: center; width: 100%; padding: 5px; background: #111;}
    </style>
</head>
<body>

<header>
    <h1>Pixel RPG Combo Sandbox ⚔️</h1>
</header>
<div id="lobby-status">Lade Profildaten...</div>

<div id="game-container">
    <!-- Start -->
    <div id="start-screen">
        <div class="menu-box">
            <h2 style="margin:0; color:#ff4757;">WELT BETRETEN</h2>
            <p id="player-welcome">Verbinde...</p>
            <button class="play-btn" id="join-btn" disabled>SPAWN</button>
        </div>
    </div>

    <!-- Death -->
    <div id="death-overlay">
        <div class="menu-box" style="border-color: #d63031;">
            <h2 style="color: #ff4757; margin:0;">DU BIST GEFALLEN!</h2>
            <p style="color: #aaa; font-size: 12px;">Dein Level und Gold wurden gesichert.</p>
            <button class="play-btn" id="respawn-btn">Wiederbeleben</button>
        </div>
    </div>

    <!-- Shop -->
    <div id="shop-overlay">
        <div class="shop-box">
            <h3 style="color: #ffa502; margin: 0 0 10px 0;">DORF-MARKT</h3>
            <button class="shop-item-btn" id="buy-dmg-btn">Stärkeres Schwert (50 Gold)</button>
            <button class="shop-item-btn" id="buy-heal-btn">Heiltrank (15 Gold)</button>
            <button class="play-btn" style="background: #555;" id="close-shop-btn">Schließen</button>
        </div>
    </div>

    <div id="leaderboard">
        <h3>🏆 TOP HELDEN</h3>
        <div id="leaderboard-list">Lade...</div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<div id="control-panel">
    <div class="joycon-circle" id="joystick-circle">
        <div class="joycon-stick" id="joystick-stick"></div>
    </div>
    <div class="action-btn" id="attack-button">ATTACK</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue, update, onDisconnect, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.firebasestorage.app",
        messagingSenderId: "87392900284",
        appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameContainer = document.getElementById('game-container');
    const lobbyStatus = document.getElementById('lobby-status');
    const startScreen = document.getElementById('start-screen');
    const deathOverlay = document.getElementById('death-overlay');
    const shopOverlay = document.getElementById('shop-overlay');
    const leaderboardList = document.getElementById('leaderboard-list');

    const WORLD_WIDTH = 3000;
    const WORLD_HEIGHT = 3000;

    let myUid = null;
    let myUsername = "Anonym";
    let allPlayers = {};
    let serverBosses = {};
    let isPlaying = false;

    // Spieler-Status mit Combo-Variablen erweitert
    let player = {
        x: 1500, y: 1500, hp: 100, maxHp: 100,
        level: 1, exp: 0, nextLevelExp: 100,
        gold: 0, dmg: 15,
        color: '#3498db', isAttacking: false, attackTimer: 0, dirX: 0, dirY: 1,
        comboStep: 0, lastAttackTime: 0, comboResetTimer: 0
    };

    let obstacles = [];
    let buildings = [];
    let localEnemies = [];
    let lootGems = [];
    let damageNumbers = []; // Für Schadens-Popups

    let joyX = 0, joyY = 0;
    let keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    let controlMode = "keyboard";

    function generateWorldGrid() {
        buildings.push({ x: 1500, y: 1400, w: 120, h: 100, type: 'shop', name: "Dorf-Shop" });
        buildings.push({ x: 1700, y: 1420, w: 100, h: 90, type: 'gilde', name: "Kriegergilde" });

        for (let i = 0; i < 80; i++) {
            let obsX = Math.random() * (WORLD_WIDTH - 200) + 100;
            let obsY = Math.random() * (WORLD_HEIGHT - 200) + 100;
            if (Math.hypot(obsX - 1500, obsY - 1500) > 300) {
                obstacles.push({
                    x: obsX, y: obsY,
                    r: Math.random() > 0.4 ? 25 : 35,
                    type: Math.random() > 0.4 ? 'tree' : 'rock'
                });
            }
        }
    }
    generateWorldGrid();

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            myUid = user.uid;
            
            const userSnap = await get(ref(db, `users/${myUid}`));
            if(userSnap.exists()) myUsername = userSnap.val().username;

            onValue(ref(db, `games/rpg/saves/${myUid}`), (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    player.level = data.level || 1;
                    player.gold = data.gold || 0;
                    player.dmg = data.dmg || 15;
                    player.maxHp = 100 + (player.level * 10);
                }
                document.getElementById('player-welcome').innerText = `${myUsername} (Lvl ${player.level} | ${player.gold}g)`;
                document.getElementById('join-btn').disabled = false;
            }, { onlyOnce: true });

            onValue(ref(db, `games/rpg/bosses`), (snap) => {
                if (snap.exists()) serverBosses = snap.val();
                else initializeServerBosses();
            });

            onValue(ref(db, `games/rpg/players`), (snap) => {
                if (snap.exists()) { allPlayers = snap.val(); updateLeaderboard(); }
            });

        } else {
            window.location.href = "überleitung.html";
        }
    });

    function initializeServerBosses() {
        let bossData = {
            "mega_slime": { name: "Cthulhu-Slime", x: 600, y: 600, hp: 500, maxHp: 500, r: 60 },
            "dragon": { name: "Pixel-Drache", x: 2400, y: 2400, hp: 1200, maxHp: 1200, r: 80 }
        };
        set(ref(db, `games/rpg/bosses`), bossData);
    }

    async function savePlayerData() {
        if (!myUid) return;
        await update(ref(db, `games/rpg/saves/${myUid}`), {
            level: player.level,
            gold: player.gold,
            dmg: player.dmg
        });
    }

    function enterWorld() {
        startScreen.style.display = 'none';
        deathOverlay.style.display = 'none';
        player.hp = player.maxHp;
        player.x = 1500 + (Math.random() * 100 - 50);
        player.y = 1550 + (Math.random() * 100 - 50);

        localEnemies = [];
        for (let i = 0; i < 25; i++) spawnLocalEnemy();

        set(ref(db, `games/rpg/players/${myUid}`), { username: myUsername, x: player.x, y: player.y, level: player.level });
        onDisconnect(ref(db, `games/rpg/players/${myUid}`)).remove();

        isPlaying = true;
        lobbyStatus.innerText = "Verbunden mit Sandbox-Server";
        requestAnimationFrame(gameLoop);
    }

    document.getElementById('join-btn').onclick = enterWorld;
    document.getElementById('respawn-btn').onclick = enterWorld;

    function spawnLocalEnemy() {
        let ex = Math.random() * WORLD_WIDTH;
        let ey = Math.random() * WORLD_HEIGHT;
        if (Math.hypot(ex - 1500, ey - 1500) > 400) {
            localEnemies.push({ x: ex, y: ey, hp: 45, maxHp: 45, speed: 1.5, id: Math.random() });
        }
    }

    function updateLeaderboard() {
        let list = Object.values(allPlayers);
        list.sort((a, b) => (b.level || 1) - (a.level || 1));
        let html = "";
        list.slice(0, 5).forEach((p, i) => {
            html += `<div class="leaderboard-entry"><span>${i+1}. ${p.username}</span><b>LVL ${p.level || 1}</b></div>`;
        });
        leaderboardList.innerHTML = html || "Keine Helden";
    }

    function checkMapCollisions(oldX, oldY, newX, newY) {
        let resolved = { x: newX, y: newY };
        
        for (let obs of obstacles) {
            let dist = Math.hypot(resolved.x - obs.x, resolved.y - obs.y);
            if (dist < obs.r + 12) {
                let angle = Math.atan2(resolved.y - obs.y, resolved.x - obs.x);
                resolved.x = obs.x + Math.cos(angle) * (obs.r + 12);
                resolved.y = obs.y + Math.sin(angle) * (obs.r + 12);
            }
        }

        for (let b of buildings) {
            if (resolved.x + 16 > b.x && resolved.x - 16 < b.x + b.w &&
                resolved.y + 16 > b.y && resolved.y - 16 < b.y + b.h) {
                return { x: oldX, y: oldY };
            }
        }
        return resolved;
    }

    async function buyUpgrade(type) {
        if (type === 'dmg' && player.gold >= 50) {
            player.gold -= 50; player.dmg += 8;
            alert("Schwert verbessert! Schaden erhöht.");
        } else if (type === 'heal' && player.gold >= 15) {
            player.gold -= 15; player.hp = Math.min(player.maxHp, player.hp + 40);
            alert("Heiltrank getrunken!");
        } else {
            alert("Nicht genug Gold!");
        }
        await savePlayerData();
        closeShop();
    }

    function closeShop() { 
        shopOverlay.style.display = 'none'; 
        isPlaying = true; 
        requestAnimationFrame(gameLoop); 
    }

    document.getElementById('buy-dmg-btn').onclick = () => buyUpgrade('dmg');
    document.getElementById('buy-heal-btn').onclick = () => buyUpgrade('heal');
    document.getElementById('close-shop-btn').onclick = closeShop;

    // DYNAMISCHES KOMBISYSTEM
    function performAttack() {
        if (player.attackTimer > 0) return;

        let now = Date.now();
        // Wenn der letzte Angriff zu lange her ist (> 800ms), wird die Combo zurückgesetzt
        if (now - player.lastAttackTime > 800) {
            player.comboStep = 1;
        } else {
            player.comboStep = (player.comboStep % 3) + 1;
        }
        player.lastAttackTime = now;
        player.comboResetTimer = 48; // Frames bis die Anzeige erlischt

        player.isAttacking = true;
        player.attackTimer = 10; // Angriffsgeschwindigkeit in Frames

        // Schadensberechnung je nach Combo-Stufe
        let currentDmg = player.dmg;
        let isCrit = false;
        let attackRadius = 35;

        if (player.comboStep === 2) {
            currentDmg = Math.floor(player.dmg * 1.3); // 2. Hit macht 30% mehr Schaden
        } else if (player.comboStep === 3) {
            currentDmg = Math.floor(player.dmg * 2.0); // 3. Hit ist ein dicker Finisher (Doppelter Schaden!)
            isCrit = true;
            attackRadius = 65; // Großer Radius für den Finisher-Wirbelwind
        }

        // Hitbox-Zentrum berechnen (beim 3. Hit rundherum, sonst vor dem Spieler)
        let hitX = player.comboStep === 3 ? player.x : player.x + player.dirX * 45;
        let hitY = player.comboStep === 3 ? player.y : player.y + player.dirY * 45;

        // Lokale Monster treffen
        localEnemies.forEach((e, i) => {
            if (Math.hypot(hitX - e.x, hitY - e.y) < attackRadius) {
                e.hp -= currentDmg;
                
                // Heftigerer Rückstoß (Knockback) beim Finisher
                let kb = player.comboStep === 3 ? 45 : 20;
                e.x += player.dirX * kb; e.y += player.dirY * kb;

                // Schadenszahl hinzufügen
                damageNumbers.push({
                    x: e.x, y: e.y - 10,
                    text: currentDmg,
                    color: isCrit ? '#ff9f43' : '#fff',
                    size: isCrit ? 16 : 11,
                    timer: 30
                });

                if (e.hp <= 0) {
                    lootGems.push({ x: e.x, y: e.y, gold: Math.floor(Math.random() * 8) + 5, exp: 30 });
                    localEnemies.splice(i, 1);
                    spawnLocalEnemy();
                }
            }
        });

        // Bosse treffen
        for (let bKey in serverBosses) {
            let boss = serverBosses[bKey];
            if (boss.hp > 0 && Math.hypot(hitX - boss.x, hitY - boss.y) < boss.r + 20) {
                let newHp = Math.max(0, boss.hp - currentDmg);
                update(ref(db, `games/rpg/bosses/${bKey}`), { hp: newHp });
                
                damageNumbers.push({
                    x: boss.x + (Math.random()*40-20), y: boss.y - boss.r,
                    text: currentDmg, color: isCrit ? '#ff9f43' : '#ff4757',
                    size: isCrit ? 18 : 13, timer: 35
                });

                if (newHp <= 0) {
                    player.gold += 150;
                    player.exp += 300;
                    savePlayerData();
                    alert(`Du hast ${boss.name} bezwungen! +150 Gold!`);
                }
            }
        }

        // Shop-Aktivierung
        let shop = buildings[0];
        if (player.x > shop.x - 30 && player.x < shop.x + shop.w + 30 &&
            player.y > shop.y - 30 && player.y < shop.y + shop.h + 30) {
            isPlaying = false;
            shopOverlay.style.display = 'flex';
        }
    }

    document.getElementById('attack-button').addEventListener('mousedown', performAttack);
    document.getElementById('attack-button').addEventListener('touchstart', (e) => {
        e.preventDefault();
        performAttack();
    });

    window.addEventListener('keydown', (e) => { 
        if (e.key in keys) { keys[e.key] = true; controlMode = "keyboard"; } 
        if (e.code === 'Space') performAttack(); 
    });
    window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

    const circle = document.getElementById('joystick-circle');
    const stick = document.getElementById('joystick-stick');

    circle.addEventListener('touchmove', (e) => {
        controlMode = "joystick";
        let rect = circle.getBoundingClientRect();
        let dx = e.touches[0].clientX - (rect.left + rect.width / 2);
        let dy = e.touches[0].clientY - (rect.top + rect.height / 2);
        let dist = Math.hypot(dx, dy);
        
        if (dist > 40) { dx = (dx / dist) * 40; dy = (dy / dist) * 40; }
        stick.style.transform = `translate(${dx}px, ${dy}px)`;
        joyX = dx / 40; joyY = dy / 40;
    });

    circle.addEventListener('touchend', () => { stick.style.transform = 'translate(0px, 0px)'; joyX = 0; joyY = 0; });

    function gameLoop() {
        if (!isPlaying) return;
        requestAnimationFrame(gameLoop);

        let mx = controlMode === "keyboard" ? (keys.d - keys.a || keys.ArrowRight - keys.ArrowLeft) : joyX;
        let my = controlMode === "keyboard" ? (keys.s - keys.w || keys.ArrowDown - keys.ArrowUp) : joyY;

        let oldX = player.x, oldY = player.y;
        if (mx !== 0 || my !== 0) {
            let len = Math.hypot(mx, my);
            player.dirX = mx / len; player.dirY = my / len;
            player.x += player.dirX * 4.0;
            player.y += player.dirY * 4.0;
            
            let res = checkMapCollisions(oldX, oldY, player.x, player.y);
            player.x = Math.max(20, Math.min(WORLD_WIDTH - 20, res.x));
            player.y = Math.max(20, Math.min(WORLD_HEIGHT - 20, res.y));
        }

        // Attack- & Combo-Timer herunterzählen
        if (player.attackTimer > 0) { 
            player.attackTimer--; 
            if(player.attackTimer === 0) player.isAttacking = false; 
        }
        if (player.comboResetTimer > 0) {
            player.comboResetTimer--;
            if (player.comboResetTimer === 0) player.comboStep = 0; // Combo erloschen
        }

        // Schadenszahlen nach oben schweben lassen
        damageNumbers.forEach((n, i) => {
            n.y -= 0.5;
            n.timer--;
            if(n.timer <= 0) damageNumbers.splice(i, 1);
        });

        // Monster-KI
        localEnemies.forEach(e => {
            let d = Math.hypot(player.x - e.x, player.y - e.y);
            if (d < 250) {
                e.x += ((player.x - e.x)/d) * e.speed;
                e.y += ((player.y - e.y)/d) * e.speed;
                if (d < 22 && Math.random() < 0.04) {
                    player.hp -= 3;
                    if (player.hp <= 0) handlePlayerDeath();
                }
            }
        });

        for (let bKey in serverBosses) {
            let boss = serverBosses[bKey];
            if (boss.hp > 0) {
                let d = Math.hypot(player.x - boss.x, player.y - boss.y);
                if (d < boss.r + 15 && Math.random() < 0.05) {
                    player.hp -= 10;
                    if (player.hp <= 0) handlePlayerDeath();
                }
            }
        }

        lootGems.forEach((g, i) => {
            if (Math.hypot(player.x - g.x, player.y - g.y) < 25) {
                player.gold += g.gold;
                player.exp += g.exp;
                lootGems.splice(i, 1);
                
                if (player.exp >= player.nextLevelExp) {
                    player.level++; player.exp = 0; player.maxHp += 10; player.hp = player.maxHp;
                }
                savePlayerData();
            }
        });

        // RENDER PROCESS
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();

        let zoom = Math.max(canvas.width / 900, canvas.height / 550);
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(zoom, zoom);
        ctx.translate(-player.x, -player.y);

        ctx.fillStyle = '#26af5f'; ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

        buildings.forEach(b => {
            ctx.fillStyle = '#747d8c'; ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.fillStyle = b.type === 'shop' ? '#ffa502' : '#57606f'; ctx.fillRect(b.x + 40, b.y + b.h - 35, 35, 35);
            ctx.fillStyle = '#fff'; ctx.font = '10px monospace'; ctx.fillText(b.name, b.x + b.w/2 - 25, b.y - 10);
        });

        obstacles.forEach(obs => {
            ctx.fillStyle = obs.type === 'tree' ? '#2ed573' : '#a4b0be';
            ctx.fillRect(obs.x - obs.r, obs.y - obs.r, obs.r*2, obs.r*2);
            ctx.strokeStyle = '#000'; ctx.strokeRect(obs.x - obs.r, obs.y - obs.r, obs.r*2, obs.r*2);
        });

        lootGems.forEach(g => { ctx.fillStyle = '#ffd32a'; ctx.fillRect(g.x-4, g.y-4, 8, 8); });

        localEnemies.forEach(e => {
            ctx.fillStyle = '#ff5722'; ctx.fillRect(e.x - 12, e.y - 12, 24, 24);
        });

        for (let bKey in serverBosses) {
            let boss = serverBosses[bKey];
            if (boss.hp > 0) {
                ctx.fillStyle = '#9c27b0'; ctx.fillRect(boss.x - boss.r, boss.y - boss.r, boss.r*2, boss.r*2);
                ctx.fillStyle = '#ff4757'; ctx.fillRect(boss.x - boss.r, boss.y - boss.r - 20, boss.r*2, 6);
                ctx.fillStyle = '#2ed573'; ctx.fillRect(boss.x - boss.r, boss.y - boss.r - 20, (boss.hp / boss.maxHp) * (boss.r*2), 6);
                ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.fillText(boss.name, boss.x - 30, boss.y - boss.r - 28);
            }
        }

        for (let pKey in allPlayers) {
            if (pKey === myUid) continue;
            let op = allPlayers[pKey];
            ctx.fillStyle = '#eccc68'; ctx.fillRect(op.x - 15, op.y - 15, 30, 30);
            ctx.fillStyle = '#fff'; ctx.font = '9px monospace'; ctx.fillText(op.username, op.x - 15, op.y - 22);
        }

        // SPIELER ZEICHNEN
        ctx.fillStyle = player.color; ctx.fillRect(player.x - 16, player.y - 16, 32, 32);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(player.x - 16, player.y - 16, 32, 32);

        // KOMBIBASIERTES ANGRIFFS-RENDERING (Slash FX)
        if (player.isAttacking) {
            ctx.save();
            if (player.comboStep === 1) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; // Normaler weißer Hieb
                ctx.fillRect(player.x + player.dirX * 28 - 6, player.y + player.dirY * 28 - 6, 12, 12);
            } else if (player.comboStep === 2) {
                ctx.fillStyle = 'rgba(30, 144, 255, 0.9)'; // Blauer, stärkerer Hieb
                ctx.fillRect(player.x + player.dirX * 32 - 9, player.y + player.dirY * 32 - 9, 18, 18);
            } else if (player.comboStep === 3) {
                // Roter, epischer Rundum-Finisher-Effekt (AoE)
                ctx.fillStyle = 'rgba(255, 71, 87, 0.4)';
                ctx.beginPath();
                ctx.arc(player.x, player.y, 60, 0, 2 * Math.PI);
                ctx.fill();
                ctx.strokeStyle = '#ff4757'; ctx.lineWidth = 3; ctx.stroke();
            }
            ctx.restore();
        }

        // Pop-up Schadensnummern zeichnen
        damageNumbers.forEach(n => {
            ctx.fillStyle = n.color; ctx.font = `bold ${n.size}px monospace`; ctx.textAlign = 'center';
            ctx.fillText(n.text, n.x, n.y);
        });

        ctx.fillStyle = '#ff4757'; ctx.fillRect(player.x - 20, player.y - 26, 40, 4);
        ctx.fillStyle = '#2ed573'; ctx.fillRect(player.x - 20, player.y - 26, (player.hp / player.maxHp) * 40, 4);
        
        ctx.restore();

        // HUD Oben Links
        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(10, 10, 180, 50);
        ctx.fillStyle = '#fff'; ctx.font = '11px monospace';
        ctx.fillText(`LVL ${player.level} | EXP ${player.exp}/${player.nextLevelExp}`, 15, 26);
        ctx.fillText(`GOLD: ${player.gold}g | DMG: ${player.dmg}`, 15, 44);

        // COMBO ANZEIGE AM BILDSCHIRM
        if (player.comboStep > 0) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(10, 70, 110, 30);
            ctx.fillStyle = player.comboStep === 3 ? '#ff4757' : '#ffd32a';
            ctx.font = 'bold 12px monospace';
            ctx.fillText(`${player.comboStep}-HIT COMBO`, 18, 88);
        }
    }

    function handlePlayerDeath() {
        isPlaying = false;
        player.comboStep = 0;
        set(ref(db, `games/rpg/players/${myUid}`), null);
        deathOverlay.style.display = 'flex';
    }

    setInterval(() => {
        if (isPlaying && myUid) update(ref(db, `games/rpg/players/${myUid}`), { x: player.x, y: player.y, level: player.level });
    }, 70);

    function resizeCanvas() {
        canvas.width = gameContainer.clientWidth;
        canvas.height = gameContainer.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
</script>

</body>
