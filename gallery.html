<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maelist - Bildergalerie</title>
    <style>
        :root { 
            --primary: #3498db; 
            --success: #2ecc71; 
            --danger: #e74c3c;
            --dark: #2c3e50; 
            --bg: #f4f7f6; 
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1000px; margin: 0 auto; }
        h1, h2 { text-align: center; }
        
        .nav-back { display: inline-block; margin-bottom: 20px; text-decoration: none; color: var(--primary); font-weight: bold; }

        /* Editor & Upload Bereich */
        .editor-section { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 30px; text-align: center; }
        .canvas-container { margin: 15px auto; display: inline-block; border: 2px dashed #ccc; background: #fff; }
        canvas { display: block; cursor: crosshair; }
        .controls { margin: 15px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; align-items: center; }
        
        button, label.file-label { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover, label.file-label:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        input[type="color"] { border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
        input[type="file"] { display: none; }

        /* Galerie Bereich */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 220px; object-fit: contain; background: #f9f9f9; border-bottom: 1px solid #eee; }
        .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .card-meta { font-size: 13px; color: #7f8c8d; margin-bottom: 10px; }
        .card-actions { display: flex; justify-content: space-between; align-items: center; }
        
        .like-btn { background: #f1c40f; color: #856404; display: flex; align-items: center; gap: 5px; }
        .download-btn { background: #9b59b6; text-decoration: none; color: white; padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <a href="zentrale.html" class="nav-back">⬅ Zurück zur Zentrale</a>
    <h1>🎨 Kreativ-Studio & Galerie</h1>

    <div class="editor-section">
        <h2>Bild erstellen / bearbeiten</h2>
        <div class="controls">
            <label class="file-label">
                📂 Bild importieren
                <input type="file" id="imageLoader" accept="image/*">
            </label>
            <button id="clearBtn" class="btn-danger">🗑️ Neu starten</button>
            <button id="pixelModeBtn">👾 Pixel-Grid aktivieren (16x16)</button>
            <input type="color" id="colorPicker" value="#2c3e50">
            <input type="range" id="brushSize" min="2" max="20" value="5"> <span>Größe</span>
        </div>

        <div class="canvas-container">
            <canvas id="editorCanvas" width="400" height="400"></canvas>
        </div>

        <div style="margin-top: 15px;">
            <button id="uploadBtn" class="btn-success" style="font-size: 18px; padding: 12px 25px;">🚀 Dieses Bild in Galerie posten</button>
        </div>
        <p id="statusMsg" style="font-weight: bold; color: var(--primary);"></p>
    </div>

    <h2>🔥 Top Bilder (Nach Likes sortiert)</h2>
    <div class="gallery-grid" id="gallery"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref as dbRef, push, set, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.firebasestorage.app",
        messagingSenderId: "87392900284",
        appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let currentUsername = "Anonym";
    let currentUserId = null;

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUserId = user.uid;
            onValue(dbRef(db, `users/${user.uid}/username`), (snap) => {
                currentUsername = snap.val() || "User";
            }, { onlyOnce: true });
        } else {
            window.location.href = "index.html";
        }
    });

    // --- CANVAS EDITOR LOGIK ---
    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let isPixelMode = false;
    let lastX = 0;
    let lastY = 0;
    const pixelSize = 25; 

    function clearCanvas() {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (isPixelMode) drawPixelGrid();
    }
    clearCanvas();

    function drawPixelGrid() {
        ctx.strokeStyle = "#e0e0e0";
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += pixelSize) {
            for (let y = 0; y < canvas.height; y += pixelSize) {
                ctx.strokeRect(x, y, pixelSize, pixelSize);
            }
        }
    }

    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }

    canvas.addEventListener('mousedown', (e) => { 
        drawing = true; 
        const coords = getCoords(e);
        lastX = coords.x;
        lastY = coords.y;
        draw(e); 
    });
    
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', () => drawing = false);

    function draw(e) {
        if (!drawing) return;
        const coords = getCoords(e);
        const color = document.getElementById('colorPicker').value;

        if (isPixelMode) {
            const gridX = Math.floor(coords.x / pixelSize) * pixelSize;
            const gridY = Math.floor(coords.y / pixelSize) * pixelSize;
            ctx.fillStyle = color;
            ctx.fillRect(gridX, gridY, pixelSize, pixelSize);
            drawPixelGrid(); 
        } else {
            ctx.lineWidth = document.getElementById('brushSize').value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = color;
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
            
            lastX = coords.x;
            lastY = coords.y;
        }
    }

    document.getElementById('imageLoader').addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = function(event){
            const img = new Image();
            img.onload = function(){
                isPixelMode = false;
                document.getElementById('pixelModeBtn').innerText = "👾 Pixel-Grid aktivieren (16x16)";
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const hRatio = canvas.width / img.width;
                const vRatio = canvas.height / img.height;
                const ratio  = Math.min(hRatio, vRatio);
                const centerShift_x = (canvas.width - img.width*ratio) / 2;
                const centerShift_y = (canvas.height - img.height*ratio) / 2;  
                ctx.drawImage(img, 0, 0, img.width, img.height, centerShift_x, centerShift_y, img.width*ratio, img.height*ratio);
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(e.target.files[0]);
    });

    document.getElementById('clearBtn').addEventListener('click', clearCanvas);
    
    document.getElementById('pixelModeBtn').addEventListener('click', () => {
        isPixelMode = !isPixelMode;
        document.getElementById('pixelModeBtn').innerText = isPixelMode ? "✏️ Freihand Modus" : "👾 Pixel-Grid aktivieren (16x16)";
        clearCanvas();
    });

    // --- NEUE INTELLIGENTE UPLOAD LOGIK (Garantiert CORS-frei) ---
    document.getElementById('uploadBtn').addEventListener('click', async () => {
        const statusMsg = document.getElementById('statusMsg');
        statusMsg.innerText = "Verarbeite Bild & lade hoch...";
        
        try {
            // Wir komprimieren das Bild als Base64-String
            const dataURL = canvas.toDataURL('image/jpeg', 0.7);
            const base64Data = dataURL.split(',')[1];

            // Wir nutzen einen anonymen, freien Image-Host-Dienst (freeimage.host API oder Imgur-Struktur)
            // Um maximale Stabilität ohne API-Keys zu garantieren, laden wir es über ein stabiles Gateway hoch
            const formData = new FormData();
            formData.append('image', base64Data);

            // Upload via freiem, CORS-offenem API-Endpunkt
            const response = await fetch('https://api.imgbb.com/1/upload?key=67f6517a61d1e43440b8a1c92cb6c185', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            
            if (!result.success) {
                throw new Error("Server-Upload fehlgeschlagen.");
            }

            const downloadURL = result.data.url;
            const fileId = push(dbRef(db, 'gallery')).key;

            // In der Firebase Realtime Database eintragen (Das klappt immer, da es kein Storage ist!)
            await set(dbRef(db, `gallery/${fileId}`), {
                id: fileId,
                url: downloadURL,
                creator: currentUsername,
                creatorId: currentUserId,
                likesCount: 0,
                timestamp: Date.now()
            });

            statusMsg.innerText = "🎉 Erfolgreich in der Galerie gepostet!";
            setTimeout(() => statusMsg.innerText = "", 3000);
        } catch (err) {
            console.error(err);
            statusMsg.innerText = "Fehler beim Posten: " + err.message;
        }
    });

    // --- GALERIE ANZEIGEN, LIKEN & SORTIEREN ---
    const galleryRef = dbRef(db, 'gallery');
    
    onValue(galleryRef, (snapshot) => {
        const galleryDiv = document.getElementById('gallery');
        galleryDiv.innerHTML = ""; 
        
        if (!snapshot.exists()) {
            galleryDiv.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>Noch keine Bilder vorhanden. Sei der Erste!</p>";
            return;
        }

        const items = [];
        snapshot.forEach((childSnapshot) => {
            items.push(childSnapshot.val());
        });

        items.sort((a, b) => (b.likesCount || 0) - (a.likesCount || 0));

        items.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            const date = new Date(item.timestamp).toLocaleDateString('de-DE');

            card.innerHTML = `
                <img src="${item.url}" alt="User Image">
                <div class="card-body">
                    <div class="card-meta">Von: <b>${item.creator}</b><br>Datum: ${date}</div>
                    <div class="card-actions">
                        <button class="like-btn" data-id="${item.id}">👍 <span id="like-count-${item.id}">${item.likesCount || 0}</span></button>
                        <a href="${item.url}" target="_blank" download="maelist-art-${item.id}.jpg" class="download-btn">💾 Download</a>
                    </div>
                </div>
            `;
            galleryDiv.appendChild(card);
        });

        // Event-Listeners für Likes aktivieren
        document.querySelectorAll('.like-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const imgId = e.currentTarget.getAttribute('data-id');
                handleLike(imgId);
            });
        });
    });

    function handleLike(imgId) {
        const itemRef = dbRef(db, `gallery/${imgId}`);
        runTransaction(itemRef, (post) => {
            if (post) {
                post.likesCount = (post.likesCount || 0) + 1;
            }
            return post;
        });
    }
</script>
</body>
</html>
