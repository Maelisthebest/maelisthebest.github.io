<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maelist - Pro Kreativ-Studio & Galerie</title>
    <style>
        :root { 
            --primary: #3498db; 
            --success: #2ecc71; 
            --danger: #e74c3c;
            --dark: #2c3e50; 
            --bg: #f4f7f6; 
            --grey: #7f8c8d;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1100px; margin: 0 auto; }
        h1, h2 { text-align: center; }
        
        .nav-back { display: inline-block; margin-bottom: 20px; text-decoration: none; color: var(--primary); font-weight: bold; }

        /* Editor Bereich */
        .editor-section { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 30px; text-align: center; }
        
        .toolbar-group { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 10px; margin-bottom: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; align-items: center; }
        .toolbar-label { font-size: 12px; font-weight: bold; color: var(--grey); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
        .tool-box { text-align: left; }

        .canvas-container { margin: 15px auto; display: block; border: 2px dashed #cbd5e1; background: #fafafa; overflow: hidden; position: relative; max-width: 500px; max-height: 500px; border-radius: 8px; }
        canvas { display: block; cursor: crosshair; background: #ffffff; transform-origin: 0 0; }
        
        button, label.file-label { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
        button:hover, label.file-label:hover { opacity: 0.9; transform: translateY(-1px); }
        button.active { background: #1e3a8a !important; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        .btn-secondary { background: #94a3b8; }
        
        input[type="color"] { border: 2px solid #e2e8f0; width: 45px; height: 45px; border-radius: 8px; cursor: pointer; padding: 0; background: none; }
        input[type="range"] { vertical-align: middle; }
        input[type="file"] { display: none; }

        .zoom-info { font-size: 12px; font-weight: bold; background: #e2e8f0; padding: 4px 8px; border-radius: 4px; }

        /* Galerie Bereich */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; position: relative; transition: 0.3s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 220px; object-fit: contain; background: #f8fafc; border-bottom: 1px solid #edf2f7; }
        .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .card-meta { font-size: 13px; color: var(--grey); margin-bottom: 10px; }
        .card-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        
        .like-btn { background: #f1c40f; color: #856404; display: flex; align-items: center; gap: 5px; flex-grow: 1; justify-content: center; }
        .like-btn.liked { background: #e67e22; color: white; }
        .download-btn { background: #9b59b6; text-decoration: none; color: white; padding: 10px 12px; border-radius: 8px; font-weight: bold; font-size: 14px; text-align: center; }
        .delete-btn { background: var(--danger); color: white; border: none; padding: 10px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <a href="zentrale.html" class="nav-back">⬅ Zurück zur Zentrale</a>
    <h1>🎨 Pro Kreativ-Studio & Galerie</h1>

    <div class="editor-section">
        <div class="toolbar-group">
            <div class="tool-box">
                <span class="toolbar-label">Datei</span>
                <label class="file-label">📂 Importieren <input type="file" id="imageLoader" accept="image/*"></label>
            </div>
            
            <div class="tool-box">
                <span class="toolbar-label">Modus</span>
                <button id="drawModeBtn" class="active">✏️ Pinsel</button>
                <button id="panModeBtn">🖐️ Verschieben</button>
                <button id="pixelModeBtn">👾 Pixel (16x16)</button>
            </div>

            <div class="tool-box">
                <span class="toolbar-label">Farbe & Pinsel</span>
                <input type="color" id="colorPicker" value="#2c3e50">
                <input type="range" id="brushSize" min="1" max="40" value="5">
            </div>

            <div class="tool-box">
                <span class="toolbar-label">Zoom</span>
                <button id="zoomInBtn">➕</button>
                <button id="zoomOutBtn">➖</button>
                <button id="zoomResetBtn" class="btn-secondary">🔄 100%</button>
                <span id="zoomDisplay" class="zoom-info">100%</span>
            </div>

            <div class="tool-box">
                <span class="toolbar-label">Aktion</span>
                <button id="clearBtn" class="btn-danger">🗑️ Reset</button>
            </div>
        </div>

        <div class="canvas-container" id="canvasViewPort">
            <canvas id="editorCanvas" width="500" height="500"></canvas>
        </div>

        <div style="margin-top: 15px;">
            <button id="uploadBtn" class="btn-success" style="font-size: 18px; padding: 12px 30px;">🚀 In Galerie veröffentlichen</button>
        </div>
        <p id="statusMsg" style="font-weight: bold; color: var(--primary);"></p>
    </div>

    <h2>🔥 Community Kunstwerke</h2>
    <div class="gallery-grid" id="gallery"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref as dbRef, push, set, onValue, runTransaction, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.firebasestorage.app",
        messagingSenderId: "87392900284",
        appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let currentUsername = "Anonym";
    let currentUserId = null;
    let allImagesCache = [];

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUserId = user.uid;
            onValue(dbRef(db, `users/${user.uid}/username`), (snap) => {
                currentUsername = snap.val() || "User";
            }, { onlyOnce: true });
        } else {
            window.location.href = "index.html";
        }
    });

    // --- CANVAS ENGINE ---
    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d');
    const viewPort = document.getElementById('canvasViewPort');

    let drawing = false;
    let currentMode = 'draw'; 
    
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startPanX = 0;
    let startPanY = 0;
    
    let lastX = 0;
    let lastY = 0;
    const pixelSize = 31.25; 

    function updateCanvasTransform() {
        canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        document.getElementById('zoomDisplay').innerText = `${Math.round(scale * 100)}%`;
    }

    function clearCanvas() {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (currentMode === 'pixel') drawPixelGrid();
    }
    clearCanvas();

    function drawPixelGrid() {
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 0.5;
        for (let x = 0; x < canvas.width; x += pixelSize) {
            for (let y = 0; y < canvas.height; y += pixelSize) {
                ctx.strokeRect(x, y, pixelSize, pixelSize);
            }
        }
    }

    function getCanvasCoords(e) {
        const rect = viewPort.getBoundingClientRect();
        const clientX = e.clientX - rect.left;
        const clientY = e.clientY - rect.top;
        return {
            x: (clientX - panX) / scale,
            y: (clientY - panY) / scale
        };
    }

    viewPort.addEventListener('mousedown', (e) => {
        if (currentMode === 'pan') {
            isPanning = true;
            startPanX = e.clientX - panX;
            startPanY = e.clientY - panY;
            viewPort.style.cursor = 'grabbing';
        } else {
            drawing = true;
            const coords = getCanvasCoords(e);
            lastX = coords.x;
            lastY = coords.y;
            draw(e);
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (isPanning) {
            panX = e.clientX - startPanX;
            panY = e.clientY - startPanY;
            updateCanvasTransform();
        } else if (drawing) {
            draw(e);
        }
    });

    window.addEventListener('mouseup', () => {
        drawing = false;
        isPanning = false;
        if (currentMode === 'pan') viewPort.style.cursor = 'move';
    });

    function draw(e) {
        if (!drawing) return;
        const coords = getCanvasCoords(e);
        const color = document.getElementById('colorPicker').value;

        if (currentMode === 'pixel') {
            const gridX = Math.floor(coords.x / pixelSize) * pixelSize;
            const gridY = Math.floor(coords.y / pixelSize) * pixelSize;
            ctx.fillStyle = color;
            ctx.fillRect(gridX, gridY, pixelSize, pixelSize);
            drawPixelGrid(); 
        } else if (currentMode === 'draw') {
            ctx.lineWidth = document.getElementById('brushSize').value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = color;
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
            
            lastX = coords.x;
            lastY = coords.y;
        }
    }

    document.getElementById('zoomInBtn').addEventListener('click', () => { scale = Math.min(scale + 0.25, 4); updateCanvasTransform(); });
    document.getElementById('zoomOutBtn').addEventListener('click', () => { scale = Math.max(scale - 0.25, 0.5); updateCanvasTransform(); });
    document.getElementById('zoomResetBtn').addEventListener('click', () => { scale = 1; panX = 0; panY = 0; updateCanvasTransform(); });

    const modeButtons = {
        draw: document.getElementById('drawModeBtn'),
        pan: document.getElementById('panModeBtn'),
        pixel: document.getElementById('pixelModeBtn')
    };

    function setMode(mode) {
        currentMode = mode;
        Object.keys(modeButtons).forEach(k => modeButtons[k].classList.remove('active'));
        modeButtons[mode].classList.add('active');
        viewPort.style.cursor = (mode === 'pan') ? 'move' : 'crosshair';
        clearCanvas();
    }

    modeButtons.draw.addEventListener('click', () => setMode('draw'));
    modeButtons.pan.addEventListener('click', () => setMode('pan'));
    modeButtons.pixel.addEventListener('click', () => setMode('pixel'));

    document.getElementById('imageLoader').addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = function(event){
            const img = new Image();
            img.onload = function(){
                setMode('draw');
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                const hRatio = canvas.width / img.width;
                const vRatio = canvas.height / img.height;
                const ratio  = Math.min(hRatio, vRatio);
                const centerShift_x = (canvas.width - img.width*ratio) / 2;
                const centerShift_y = (canvas.height - img.height*ratio) / 2;  
                ctx.drawImage(img, 0, 0, img.width, img.height, centerShift_x, centerShift_y, img.width*ratio, img.height*ratio);
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(e.target.files[0]);
    });

    document.getElementById('clearBtn').addEventListener('click', clearCanvas);

    // --- UPLOAD ---
    document.getElementById('uploadBtn').addEventListener('click', async () => {
        const statusMsg = document.getElementById('statusMsg');
        statusMsg.innerText = "Prüfe Berechtigung...";
        
        try {
            const einTagInMs = 24 * 60 * 60 * 1000;
            const jetzt = Date.now();
            
            let uploadsHeute = 0;
            allImagesCache.forEach(img => {
                if (img.creatorId === currentUserId && (jetzt - img.timestamp) < einTagInMs) {
                    uploadsHeute++;
                }
            });

            if (uploadsHeute >= 10) {
                statusMsg.innerText = "❌ Limit erreicht! Du darfst maximal 10 Bilder pro 24 Stunden posten.";
                return;
            }

            statusMsg.innerText = "Speichere Bild im Netzwerk...";
            const downloadURL = canvas.toDataURL('image/jpeg', 0.5);
            const fileId = push(dbRef(db, 'gallery')).key;

            await set(dbRef(db, `gallery/${fileId}`), {
                id: fileId,
                url: downloadURL,
                creator: currentUsername,
                creatorId: currentUserId,
                likesCount: 0,
                timestamp: jetzt
            });

            statusMsg.innerText = "🎉 Erfolgreich in der Galerie gepostet!";
            setTimeout(() => statusMsg.innerText = "", 3000);
        } catch (err) {
            console.error(err);
            statusMsg.innerText = "Fehler beim Speichern: " + err.message;
        }
    });

    // --- REALTIME GALERIE ---
    const galleryRef = dbRef(db, 'gallery');
    
    onValue(galleryRef, (snapshot) => {
        const galleryDiv = document.getElementById('gallery');
        galleryDiv.innerHTML = ""; 
        allImagesCache = []; 
        
        if (!snapshot.exists()) {
            galleryDiv.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>Noch keine Bilder vorhanden. Erstelle das Erste!</p>";
            return;
        }

        snapshot.forEach((childSnapshot) => {
            allImagesCache.push(childSnapshot.val());
        });

        allImagesCache.sort((a, b) => (b.likesCount || 0) - (a.likesCount || 0));

        allImagesCache.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'card';
            const date = new Date(item.timestamp).toLocaleDateString('de-DE');

            const isMyPost = item.creatorId === currentUserId;
            const deleteButtonHtml = isMyPost ? `<button class="delete-btn" data-id="${item.id}">🗑️</button>` : '';

            // HIER WAR DER FEHLER: Korrigiert zu "const hasLiked"
            const hasLiked = item.likedBy && item.likedBy[currentUserId] === true;
            const likeBtnClass = hasLiked ? "like-btn liked" : "like-btn";

            card.innerHTML = `
                <img src="${item.url}" alt="User Art">
                <div class="card-body">
                    <div class="card-meta">Von: <b>${item.creator}</b><br>Datum: ${date}</div>
                    <div class="card-actions">
                        <button class="${likeBtnClass}" data-id="${item.id}">👍 <span id="like-count-${item.id}">${item.likesCount || 0}</span></button>
                        <a href="${item.url}" download="maelist-art-${item.id}.jpg" class="download-btn">💾</a>
                        ${deleteButtonHtml}
                    </div>
                </div>
            `;
            galleryDiv.appendChild(card);
        });

        document.querySelectorAll('.like-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const imgId = e.currentTarget.getAttribute('data-id');
                handleLikeToggle(imgId);
            });
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const imgId = e.currentTarget.getAttribute('data-id');
                if(confirm("Möchtest du dein Bild wirklich löschen?")) {
                    handleDelete(imgId);
                }
            });
        });
    });

    function handleLikeToggle(imgId) {
        const itemRef = dbRef(db, `gallery/${imgId}`);
        runTransaction(itemRef, (post) => {
            if (post) {
                if (!post.likedBy) {
                    post.likedBy = {};
                }
                
                if (post.likedBy[currentUserId]) {
                    post.likesCount = Math.max((post.likesCount || 1) - 1, 0);
                    post.likedBy[currentUserId] = null; 
                } else {
                    post.likesCount = (post.likesCount || 0) + 1;
                    post.likedBy[currentUserId] = true;
                }
            }
            return post;
        });
    }

    function handleDelete(imgId) {
        remove(dbRef(db, `gallery/${imgId}`))
        .catch(err => alert("Fehler beim Löschen: " + err.message));
    }
</script>
</body>
</html>
