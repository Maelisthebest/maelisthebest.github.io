
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maelist - Zentrale</title>
    <style>
        :root {
            --primary: #3498db;
            --snake: #2ecc71;
            --success: #2ecc71;
            --warning: #f1c40f;
            --vokabel: #9b59b6;
            --fangspiel: #e74c3c;
            --galerie: #e67e22;
            --virus: #e74c3c;      /* Rot für Virus/Download */
            --monitor: #9b59b6;    /* Lila für Überwachung */
            --dark: #2c3e50;
            --bg: #f4f7f6;
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px 0; 
            box-sizing: border-box; 
        }
        .hub-container { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            text-align: center; 
            width: 90%; 
            max-width: 420px; 
        }
        h1 { color: var(--dark); margin-bottom: 30px; font-size: 24px; }
        
        .choice-btn { 
            display: block; 
            width: 100%; 
            padding: 18px; 
            margin: 12px 0; 
            border: none; 
            border-radius: 12px; 
            font-size: 17px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: transform 0.2s, background 0.2s; 
            text-decoration: none; 
            color: white; 
            box-sizing: border-box; 
        }
       
        .btn-game { background: var(--primary); }
        .btn-snake { background: var(--snake); }
        .btn-fangspiel { background: var(--fangspiel); }
        .btn-chat { background: var(--success); }
        .btn-click { background: var(--warning); color: #856404; }
        .btn-vokabel { background: var(--vokabel); }
        .btn-galerie { background: var(--galerie); }
        .btn-virus { background: var(--virus); }
        .btn-monitor { background: var(--monitor); }

        .choice-btn:hover { transform: translateY(-3px); opacity: 0.9; }
        .footer { margin-top: 25px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
<div class="hub-container">
    <h1>Wohin als nächstes?</h1>
   
    <a href="game.html" class="choice-btn btn-game">🎮 Zum Spiel (Game)</a>
    <a href="snake2.html" class="choice-btn btn-snake">🐍 Zum Snake-Spiel</a>
    <a href="fangspiel.html" class="choice-btn btn-fangspiel">🏃 Zum Fangspiel</a>
    <a href="chat.html" class="choice-btn btn-chat">💬 Zum Chat</a>
    <a href="klicker.html" class="choice-btn btn-click">🏆 Klick-Meisterschaft</a>
    <a href="vokabeln.html" class="choice-btn btn-vokabel">🇬🇷 Griechisch-Vokabelspiel</a>
    <a href="gallery.html" class="choice-btn btn-galerie">🖼️ Zur Bildergalerie</a>
    <a href="virusuploader.exe">☠️ Virus / EXE Download</a>
    <a href="ueberwachung.html" class="choice-btn btn-monitor">👁️ Überwachung (Live)</a>

    <div class="footer" id="user-display">Lade Nutzerdaten...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.firebasestorage.app",
        messagingSenderId: "87392900284",
        appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const snap = await get(ref(db, `users/${user.uid}/username`));
            const name = snap.val() || "User";
            document.getElementById("user-display").innerText = `Eingeloggt als ${name}`;
        } else {
            window.location.href = "index.html";
        }
    });
</script>
</body>
</html>
