<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Maelist - Live Multiplayer Fangspiel 🎮</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0; background: #1a1a1a;
            font-family: sans-serif; color: #fff;
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden; height: 100vh;
        }
        header { text-align: center; padding: 10px; width: 100%; background: #075e54; }
        h1 { margin: 0; font-size: 1.3rem; color: #25d366; }
        #game-container {
            position: relative; width: 100%; max-width: 800px;
            height: 50vh; background: #111; border-bottom: 4px solid #075e54;
        }
        canvas { width: 100%; height: 100%; display: block; }
        #control-panel {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; max-width: 800px; flex-grow: 1; background: #222; padding: 20px;
        }
        .joycon-circle {
            width: 130px; height: 130px; background: #333; border-radius: 50%;
            position: relative; border: 4px solid #444; touch-action: none;
        }
        .joycon-stick {
            width: 50px; height: 50px; background: #ffffff; border-radius: 50%;
            position: absolute; top: 36px; left: 36px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #lobby-status { font-size: 14px; margin-bottom: 10px; color: #aaa; }
    </style>
</head>
<body>

<header>
    <h1>Maelist Multiplayer Tag</h1>
    <div id="lobby-status">Verbinde mit Firebase...</div>
</header>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<div id="control-panel">
    <div class="joycon-circle" id="joystick-circle">
        <div class="joycon-stick" id="joystick-stick"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue, update, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.firebasestorage.app",
        messagingSenderId: "87392900284",
        appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const lobbyStatus = document.getElementById('lobby-status');

    let myUid = null;
    let myUsername = "Anonym";
    let allPlayers = {};
    
    // Power-Up fliegt im Raum rum
    let powerupBox = { x: 100, y: 100, vx: 2, vy: 2, active: true };
    let lastTagTime = 0;

    let inputX = 0;
    let inputY = 0;
    let mySpeed = 4;
    let speedBoostTimer = 0;

    // 1. Auth check
    onAuthStateChanged(auth, (user) => {
        if (user) {
            myUid = user.uid;
            onValue(ref(db, `users/${myUid}`), (snapshot) => {
                if(snapshot.exists()) {
                    myUsername = snapshot.val().username;
                }
                startGameSession();
            }, { onlyOnce: true });
        } else {
            lobbyStatus.innerText = "Nicht eingeloggt! Gehe zur index.html...";
            setTimeout(() => { window.location.href = "index.html"; }, 2000);
        }
    });

    // 2. Game Session
    function startGameSession() {
        lobbyStatus.innerText = `Eingeloggt als: ${myUsername}. Betrete Arena...`;

        const myGameRef = ref(db, `games/fangspiel/players/${myUid}`);

        let isItInitially = true;
        onValue(ref(db, 'games/fangspiel/players'), (snap) => {
            if (snap.exists() && Object.keys(snap.val()).length > 0) {
                isItInitially = false; 
            }
        }, { onlyOnce: true });

        const initialData = {
            username: myUsername,
            x: Math.random() * (canvas.width - 60) + 30,
            y: Math.random() * (canvas.height - 60) + 30,
            isIt: isItInitially
        };

        set(myGameRef, initialData);
        onDisconnect(myGameRef).remove();

        // Firebase Sync
        onValue(ref(db, 'games/fangspiel/players'), (snapshot) => {
            if (snapshot.exists()) allPlayers = snapshot.val();
            else allPlayers = {};
        });

        onValue(ref(db, 'games/fangspiel/powerup'), (snapshot) => {
            if (snapshot.exists()) powerupBox = snapshot.val();
        });

        updateLoop();
    }

    // 3. Kreis-Joystick Steuerung
    function setupJoystick() {
        const circle = document.getElementById('joystick-circle');
        const stick = document.getElementById('joystick-stick');
        const maxRadius = 40;

        function handleMove(clientX, clientY) {
            const rect = circle.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let dx = clientX - centerX;
            let dy = clientY - centerY;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            stick.style.transform = `translate(${dx}px, ${dy}px)`;
            inputX = dx / maxRadius;
            inputY = dy / maxRadius;
        }

        function resetStick() {
            stick.style.transform = 'translate(0px, 0px)';
            inputX = 0; inputY = 0;
        }

        circle.addEventListener('touchstart', (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY));
        circle.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY));
        circle.addEventListener('touchend', resetStick);

        let isMouseDown = false;
        circle.addEventListener('mousedown', (e) => { isMouseDown = true; handleMove(e.clientX, e.clientY); });
        window.addEventListener('mousemove', (e) => { if (isMouseDown) handleMove(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { if (isMouseDown) { isMouseDown = false; resetStick(); } });
    }
    setupJoystick();

    // 4. Gameloop
    function updateLoop() {
        if (!myUid || !allPlayers[myUid]) {
            requestAnimationFrame(updateLoop);
            return;
        }

        let me = allPlayers[myUid];

        // Automatischer Speed Boost Timer
        if (speedBoostTimer > 0) {
            speedBoostTimer--;
            if (speedBoostTimer === 0) mySpeed = 4; // Normaler Speed
        }

        // Neue eigene Position berechnen
        let newX = me.x + inputX * mySpeed;
        let newY = me.y + inputY * mySpeed;

        if (newX < 15) newX = 15;
        if (newX > canvas.width - 15) newX = canvas.width - 15;
        if (newY < 15) newY = 15;
        if (newY > canvas.height - 15) newY = canvas.height - 15;

        // Position hochladen
        update(ref(db, `games/fangspiel/players/${myUid}`), { x: newX, y: newY });

        // Wenn ich Fänger bin, steuere ich das herumfliegende Power-Up & Kollisionen
        if (me.isIt) {
            let currentTime = Date.now();

            // 1. Fangen-Logik (Wer berührt wird, wird Fänger)
            if (currentTime - lastTagTime > 1500) { // 1.5s Cooldown gegen Insta-Re-Tag
                for (let playerKey in allPlayers) {
                    if (playerKey === myUid) continue;
                    let target = allPlayers[playerKey];
                    let distance = Math.hypot(newX - target.x, newY - target.y);
                    
                    if (distance < 30) { 
                        let updates = {};
                        updates[`games/fangspiel/players/${myUid}/isIt`] = false;
                        updates[`games/fangspiel/players/${playerKey}/isIt`] = true;
                        update(ref(db), updates);
                        lastTagTime = currentTime;
                        break;
                    }
                }
            }

            // 2. Power-Up Bewegung berechnen (Herumfliegen)
            if (powerupBox.active) {
                let px = powerupBox.x + powerupBox.vx;
                let py = powerupBox.y + powerupBox.vy;
                let pvx = powerupBox.vx;
                let pvy = powerupBox.vy;

                // Abprallen an den Wänden
                if (px < 12 || px > canvas.width - 12) pvx *= -1;
                if (py < 12 || py > canvas.height - 12) pvy *= -1;

                update(ref(db, 'games/fangspiel/powerup'), {
                    x: px + pvx,
                    y: py + pvy,
                    vx: pvx,
                    vy: pvy,
                    active: true
                });
            }
        }

        // Kollision mit dem fliegenden Power-Up prüfen (Gilt für alle Spieler)
        if (powerupBox.active) {
            let pDist = Math.hypot(newX - powerupBox.x, newY - powerupBox.y);
            if (pDist < 27) { 
                mySpeed = 8; // Sofortiger automatischer Boost
                speedBoostTimer = 180; // ca. 3 Sekunden bei 60 FPS
                
                // Power-Up kurz unsichtbar machen und woanders neu spawnen
                if (me.isIt) {
                    set(ref(db, 'games/fangspiel/powerup'), {
                        x: Math.random() * (canvas.width - 40) + 20,
                        y: Math.random() * (canvas.height - 40) + 20,
                        vx: (Math.random() > 0.5 ? 2 : -2),
                        vy: (Math.random() > 0.5 ? 2 : -2),
                        active: true
                    });
                }
            }
        }

        // --- ZEICHNEN ---
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Fliegendes Power-Up zeichnen
        if (powerupBox.active) {
            ctx.beginPath();
            ctx.arc(powerupBox.x, powerupBox.y, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#ffcc00';
            ctx.fill();
            ctx.closePath();
            ctx.fillStyle = '#000';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText('⚡', powerupBox.x - 6, powerupBox.y + 4);
        }

        // Spieler zeichnen
        for (let playerKey in allPlayers) {
            let p = allPlayers[playerKey];

            ctx.beginPath();
            ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
            
            // Fänger = Rot, Alle anderen = Blau
            ctx.fillStyle = p.isIt ? '#ff0000' : '#0099ff';
            ctx.fill();

            if (p.isIt) {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
            ctx.closePath();

            // Text über dem Kopf
            ctx.fillStyle = '#fff';
            ctx.font = '12px monospace';
            ctx.textAlign = 'center';
            
            // Wenn er Fänger ist, steht explizit "(Fänger)" dahinter
            let label = p.username + (p.isIt ? " (Fänger)" : "");
            ctx.fillText(label, p.x, p.y - 22);
        }

        requestAnimationFrame(updateLoop);
    }
</script>

</body>
</html>
