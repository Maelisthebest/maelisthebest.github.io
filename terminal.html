<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maelist Storage Terminal</title>
    <style>
        body {
            background-color: #0a0a0a;
            margin: 0;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
        }
        .terminal-container {
            background-color: #000000;
            color: #00ff00;
            border: 1px solid #333;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.15);
            height: 550px;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }
        .terminal-title {
            color: #888;
            font-size: 12px;
            margin-bottom: 10px;
            border-bottom: 1px dashed #333;
            padding-bottom: 5px;
        }
        .input-line {
            display: flex;
            align-items: center;
            background-color: #111;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 15px;
            border: 1px solid #222;
        }
        #terminal-prompt {
            color: #00ff00;
            white-space: pre;
            font-size: 14px;
            font-weight: bold;
        }
        #terminal-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            padding-left: 5px;
        }
        #terminal-output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.4;
            padding-top: 5px;
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="terminal-title">MAELIST STORAGE-OS v3.0 // NODE_STORAGE_MODE</div>
    
    <!-- Eingabe oben -->
    <div class="input-line">
        <span id="terminal-prompt"></span>
        <input type="text" id="terminal-input" autofocus autocomplete="off" spellcheck="false">
    </div>

    <!-- Ausgabe unten -->
    <div id="terminal-output"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.firebasestorage.app",
        messagingSenderId: "87392900284",
        appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let currentUid = "gast"; 
    let currentUsername = "gast";
    
    // Pfade zeigen jetzt in das Verzeichnis: storage/ORDNERNAME
    let activeDbPath = "storage/public"; 
    let virtualPath = "/public";

    const outputElement = document.getElementById("terminal-output");
    const inputElement = document.getElementById("terminal-input");
    const promptElement = document.getElementById("terminal-prompt");

    function print(text, color = "white") {
        const line = document.createElement("div");
        line.style.color = color;
        line.innerText = text;
        outputElement.insertBefore(line, outputElement.firstChild);
    }

    function updatePrompt() {
        promptElement.innerText = `${currentUsername}@maelist-storage:${virtualPath}$ `;
    }

    function escapeKey(key) { return key.replace(/\./g, '_'); }
    function unescapeKey(key) { return key.replace(/_/g, '.'); }

    // Holt den Usernamen für eine bestimmte UID aus /users/{uid}/username
    async function fetchUsername(uid) {
        try {
            const userSnap = await get(ref(db, `users/${uid}/username`));
            if (userSnap.exists()) return userSnap.val();
        } catch (e) { console.error(e); }
        return uid; 
    }

    // Prüft, ob ein Ordnername (Username) in der Datenbank unter /users existiert
    async function checkIfUsernameExists(targetUsername) {
        try {
            const usersSnap = await get(ref(db, "users"));
            if (usersSnap.exists()) {
                const usersData = usersSnap.val();
                for (const [uid, data] of Object.entries(usersData)) {
                    if (data.username && data.username.toLowerCase() === targetUsername.toLowerCase()) {
                        return true; 
                    }
                }
            }
        } catch (e) { console.error(e); }
        return false;
    }

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUid = user.uid;
            currentUsername = await fetchUsername(user.uid);
            activeDbPath = `storage/${currentUsername}`;
            virtualPath = `/${currentUsername}`;
            print(`Erfolgreich als '${currentUsername}' eingeloggt.`, "#00ff00");
        } else {
            currentUid = "gast";
            currentUsername = "gast";
            activeDbPath = "storage/public";
            virtualPath = "/public";
            print("Nicht eingeloggt. Standard-Pfad: '/public'.", "#ff9900");
        }
        updatePrompt();
    });

    const commands = {
        help: () => {
            print("--- Befehlsübersicht ---", "#00ff00");
            print("  help                 - Zeigt dieses Menü");
            print("  ls                   - Listet Dateien & Ordner im aktuellen Pfad auf");
            print("  cd [name]            - Wechselt Verzeichnis (z.B. 'cd public' oder 'cd mael2')");
            print("  mkdir [name]         - Erstellt einen virtuellen Unterordner");
            print("  touch [name] [text]  - Erstellt eine Textdatei im aktuellen Ordner");
            print("  upload [name]        - Lädt ein Bild im Base64-Format hoch");
            print("  rm [name]            - Löscht eine Datei oder einen Ordner");
            print("  clear                - Leert das Terminalfenster");
        },

        clear: () => { outputElement.innerHTML = ""; },

        ls: async () => {
            try {
                const snapshot = await get(ref(db, activeDbPath));
                if (!snapshot.exists()) {
                    print("(Verzeichnis leer)", "#777");
                    return;
                }

                const data = snapshot.val();
                for (const [key, value] of Object.entries(data)) {
                    const nameForUser = unescapeKey(key);
                    if (value.type === "dir") {
                        print(`[DIR]  ${nameForUser}`, "#3399ff");
                    } else if (value.type === "file") {
                        print(`[FILE] ${nameForUser}`, "#ffffff");
                    }
                }
            } catch (err) {
                print("Fehler beim Lesen: " + err.message, "red");
            }
        },

        cd: async (args) => {
            const target = args[0];
            if (!target) return;

            if (target === ".." || target === "public" || target === "öffentlich") {
                activeDbPath = "storage/public";
                virtualPath = "/public";
                updatePrompt();
                return;
            }

            let targetPath = "";
            let targetVirtual = "";

            // Prüfen, ob der Zielordner ein existierender User-Ordnername ist
            const isUserFolder = await checkIfUsernameExists(target);

            if (isUserFolder) {
                targetPath = `storage/${target}`;
                targetVirtual = `/${target}`;
            } else {
                // Normaler Unterordner-Wechsel innerhalb des aktuellen Verzeichnisses
                targetPath = `${activeDbPath}/${escapeKey(target)}`;
                targetVirtual = `${virtualPath}/${target}`;
            }

            // --- STRIKTE ZUGRIFFSPRÜFUNG NACH USERNAME ---
            const istPublic = targetPath.startsWith("storage/public");
            const istEigenesVerzeichnis = targetPath.startsWith(`storage/${currentUsername}`);

            if (!istPublic && !istEigenesVerzeichnis) {
                print("Zugriff verweigert: Du darfst nur in deinen eigenen oder den öffentlichen Ordner!", "red");
                return;
            }

            activeDbPath = targetPath;
            virtualPath = targetVirtual;
            updatePrompt();
        },

        touch: async (args) => {
            const filename = args[0];
            const content = args.slice(1).join(" ") || "Leere Datei";
            if (!filename) return print("Fehler: Dateiname fehlt.", "red");

            try {
                const fileKey = escapeKey(filename);
                await set(ref(db, `${activeDbPath}/${fileKey}`), {
                    type: "file",
                    content: content
                });
                print(`Datei '${filename}' gespeichert.`, "#00ff00");
            } catch (err) {
                print("Fehler: " + err.message, "red");
            }
        },

        mkdir: async (args) => {
            const folderName = args[0];
            if (!folderName) return print("Fehler: Ordnername fehlt.", "red");

            try {
                const folderKey = escapeKey(folderName);
                await set(ref(db, `${activeDbPath}/${folderKey}`), {
                    type: "dir"
                });
                print(`Ordner '${folderName}' angelegt.`, "#00ff00");
            } catch (err) {
                print("Fehler: " + err.message, "red");
            }
        },

        upload: async (args) => {
            let filename = args[0] || "bild.png";
            const fileKey = escapeKey(filename);
            const base64ImageString = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAFklEQVR42mNk+M9Qz0AEYBxViCPAQAgA9gYIDcy9Z24AAAAASUVORK5CYII=";

            try {
                await set(ref(db, `${activeDbPath}/${fileKey}`), {
                    type: "file",
                    content: base64ImageString
                });
                print(`Bild '${filename}' erfolgreich als Base64 hochgeladen!`, "#00ff00");
            } catch (err) {
                print("Fehler: " + err.message, "red");
            }
        },

        rm: async (args) => {
            const filename = args[0];
            if (!filename) return print("Fehler: Name fehlt.", "red");

            try {
                const fileKey = escapeKey(filename);
                await remove(ref(db, `${activeDbPath}/${fileKey}`));
                print(`'${filename}' erfolgreich gelöscht.`, "#00ff00");
            } catch (err) {
                print("Fehler beim Löschen: " + err.message, "red");
            }
        }
    };

    inputElement.addEventListener("keydown", async (e) => {
        if (e.key === "Enter") {
            const rawInput = inputElement.value.trim();
            inputElement.value = "";
            if (!rawInput) return;

            print(`${promptElement.innerText}${rawInput}`, "#777");

            const parts = rawInput.split(" ");
            const cmd = parts[0].toLowerCase();
            const args = parts.slice(1);

            if (commands[cmd]) {
                await commands[cmd](args);
            } else {
                print(`Befehl unbekannt: '${cmd}'. Nutze 'help'`, "red");
            }
        }
    });

    updatePrompt();
    print("Maelist Storage OS geladen.", "#00ff00");
    print("Speicherort: Realtime Database -> /storage/[username]. Bereit.\n---");
</script>
</body>
</html>
