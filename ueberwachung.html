<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Überwachung + Fernsteuerung - Maelist</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: white;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #e74c3c;
            text-align: center;
            margin-bottom: 10px;
        }
        .status {
            text-align: center;
            color: #2ecc71;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 25px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .card {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 0 25px rgba(231, 76, 60, 0.3);
        }
        .card h3 {
            margin: 0 0 12px 0;
            color: #ffcc00;
            text-align: center;
        }
        img {
            max-width: 100%;
            height: auto;
            border: 4px solid #e74c3c;
            border-radius: 12px;
            cursor: crosshair;
        }
        .timestamp {
            margin-top: 10px;
            font-size: 15px;
            color: #bbb;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>👁️ Live Überwachung + Fernsteuerung</h1>
    <div class="status" id="status">Verbinde mit Firebase...</div>
   
    <div class="grid" id="grid"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
            authDomain: "maelist-chat.firebaseapp.com",
            databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
            projectId: "maelist-chat",
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function createOrUpdateCard(key, entry) {
            if (!entry || !entry.image) return;

            let card = document.getElementById('card-' + key);
            if (!card) {
                card = document.createElement('div');
                card.className = 'card';
                card.id = 'card-' + key;
                card.innerHTML = `
                    <h3>${entry.computer || key}</h3>
                    <img id="img-${key}" src="" alt="Live Screenshot">
                    <div class="timestamp" id="time-${key}"></div>
                `;
                document.getElementById('grid').appendChild(card);
            }

            const img = document.getElementById('img-' + key);
            img.src = "data:image/png;base64," + entry.image;
            document.getElementById('time-' + key).innerHTML = `Letztes Update: ${entry.timestamp || 'gerade eben'}`;

            // Klick auf Bild = Fernsteuerung
            img.onclick = (e) => {
                const rect = img.getBoundingClientRect();
                const realWidth = entry.screenWidth || 1920;
                const realHeight = entry.screenHeight || 1080;

                const clickX = Math.round((e.clientX - rect.left) / rect.width * realWidth);
                const clickY = Math.round((e.clientY - rect.top) / rect.height * realHeight);

                if (confirm(`Mausklick bei X:${clickX}  Y:${clickY} ausführen?`)) {
                    db.ref('commands/click').set({ 
                        x: clickX, 
                        y: clickY, 
                        timestamp: Date.now() 
                    });
                }
            };
        }

        // Echtzeit-Updates
        db.ref('screenshots/current').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            Object.keys(data).forEach(k => createOrUpdateCard(k, data[k]));
            document.getElementById("status").innerHTML = `✅ ${Object.keys(data).length} Rechner online`;
        });
    </script>
</body>
</html>
