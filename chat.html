<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Maelist Chat</title>
    <style>
        body { display: flex; height: 100vh; margin: 0; font-family: sans-serif; background: #e5ddd5; }
        #sidebar { width: 280px; background: white; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
        #chat { flex: 1; display: flex; flex-direction: column; }
        #header { background: #ededed; padding: 15px; font-weight: bold; border-bottom: 1px solid #ccc; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .msg { padding: 8px 12px; margin: 5px; border-radius: 8px; max-width: 65%; font-size: 14px; }
        .me { align-self: flex-end; background: #dcf8c6; }
        .other { align-self: flex-start; background: white; }
        #input-area { padding: 15px; background: #f0f0f0; display: flex; }
        #mInput { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .user-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="overlay"><h3>Tresor wird entschlüsselt...</h3></div>

<div id="sidebar">
    <div id="header">Kontakte</div>
    <div id="userList" style="flex:1;"></div>
    <button onclick="location.href='index.html'" style="padding:10px;">Logout</button>
</div>

<div id="chat">
    <div id="header">Chat: <span id="activeTarget">-</span></div>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="mInput" placeholder="Sichere Nachricht...">
        <button onclick="sendMsg()">➤</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get, push, query, orderByChild, equalTo, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.firebasestorage.app",
        messagingSenderId: "87392900284",
        appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let myUid, myUsername, myPrivateKey, currentSharedKey, activeChatId;

    onAuthStateChanged(auth, async (user) => {
        if (!user) return window.location.href = "index.html";
        myUid = user.uid;
        const pass = sessionStorage.getItem("vault_pass");
        
        const saltSnap = await get(ref(db, `security/salts/${myUid}`));
        const privSnap = await get(ref(db, `security/privateKeys/${myUid}`));
        
        // Private Key entschlüsseln
        const salt = Uint8Array.from(atob(saltSnap.val()), c => c.charCodeAt(0));
        const encObj = privSnap.val();
        const baseK = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
        const aesK = await crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256"}, baseK, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
        const rawPriv = await crypto.subtle.decrypt({name: "AES-GCM", iv: Uint8Array.from(atob(encObj.iv), c => c.charCodeAt(0))}, aesK, Uint8Array.from(atob(encObj.data), c => c.charCodeAt(0)));
        
        myPrivateKey = await crypto.subtle.importKey("pkcs8", rawPriv, {name: "ECDH", namedCurve: "P-256"}, false, ["deriveKey"]);
        
        document.getElementById("overlay").style.display = "none";
        const meSnap = await get(ref(db, `users/${myUid}`));
        myUsername = meSnap.val().username;
        loadUsers();
    });

    async function loadUsers() {
        const snap = await get(ref(db, "users"));
        const list = document.getElementById("userList");
        list.innerHTML = "";
        snap.forEach(c => {
            if (c.key === myUid) return;
            const div = document.createElement("div");
            div.className = "user-item";
            div.innerText = c.val().username;
            div.onclick = () => openChat(c.key, c.val().username);
            list.appendChild(div);
        });
    }

    window.openChat = async (otherUid, name) => {
        activeChatId = [myUid, otherUid].sort().join("_");
        document.getElementById("activeTarget").innerText = name;
        document.getElementById("messages").innerHTML = "";
        
        const pubSnap = await get(ref(db, `security/publicKeys/${otherUid}`));
        const otherPubKey = await crypto.subtle.importKey("spki", Uint8Array.from(atob(pubSnap.val()), c => c.charCodeAt(0)), {name: "ECDH", namedCurve: "P-256"}, false, []);

        currentSharedKey = await crypto.subtle.deriveKey({name: "ECDH", public: otherPubKey}, myPrivateKey, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);

        const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(activeChatId));
        const token = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');

        onChildAdded(query(ref(db, "messages"), orderByChild("blindToken"), equalTo(token)), async (s) => {
            try {
                const d = s.val();
                const dec = await crypto.subtle.decrypt({name: "AES-GCM", iv: Uint8Array.from(atob(d.iv), c => c.charCodeAt(0))}, currentSharedKey, Uint8Array.from(atob(d.data), c => c.charCodeAt(0)));
                renderMsg(JSON.parse(new TextDecoder().decode(dec)));
            } catch(e) {}
        });
    };

    window.sendMsg = async () => {
        const text = document.getElementById("mInput").value;
        if (!text || !currentSharedKey) return;
        document.getElementById("mInput").value = "";
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const enc = await crypto.subtle.encrypt({name: "AES-GCM", iv}, currentSharedKey, new TextEncoder().encode(JSON.stringify({text, from: myUsername})));
        const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(activeChatId));
        await push(ref(db, "messages"), {
            blindToken: Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join(''),
            iv: btoa(String.fromCharCode(...iv)),
            data: btoa(String.fromCharCode(...new Uint8Array(enc)))
        });
    };

    function renderMsg(m) {
        const box = document.getElementById("messages");
        const d = document.createElement("div");
        d.className = "msg " + (m.from === myUsername ? "me" : "other");
        d.innerHTML = `<b>${m.from}:</b> ${m.text}`;
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
