<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Maelist Chat</title>
    <style>
        body { display: flex; height: 100vh; margin: 0; font-family: sans-serif; background: #e5ddd5; }
        #sidebar { width: 280px; background: white; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
        #chat { flex: 1; display: flex; flex-direction: column; }
        #header { background: #ededed; padding: 15px; font-weight: bold; border-bottom: 1px solid #ccc; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .msg { padding: 8px 12px; margin: 5px; border-radius: 8px; max-width: 65%; font-size: 14px; }
        .me { align-self: flex-end; background: #dcf8c6; border: 1px solid #c0e0a0; }
        .other { align-self: flex-start; background: white; border: 1px solid #ddd; }
        #input-area { padding: 15px; background: #f0f0f0; display: flex; }
        #mInput { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .user-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .user-item:hover { background: #f9f9f9; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body>

<div id="overlay">
    <h2>Tresor öffnen...</h2>
    <p>Berechne kryptografischen Schlüssel (0,5s)</p>
</div>

<div id="sidebar">
    <div id="header">Kontakte</div>
    <div id="userList" style="flex:1; overflow-y:auto;"></div>
    <button onclick="location.href='index.html'" style="padding:10px; border:none; background:#eee; cursor:pointer;">Logout</button>
</div>

<div id="chat">
    <div id="header">Chat: <span id="activeTarget">-</span></div>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="mInput" placeholder="Nachricht...">
        <button onclick="sendMsg()" style="margin-left:10px; border:none; background:transparent; font-size:20px; cursor:pointer;">➤</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get, push, query, orderByChild, equalTo, onChildAdded, off } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.firebasestorage.app",
        messagingSenderId: "87392900284",
        appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let myUid, myUsername, myPrivateKey, activeOtherUid, activeChatId, currentSharedKey;
    let messageListener = null;

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "index.html"; return; }
        myUid = user.uid;
        const pass = sessionStorage.getItem("vault_pass");
        
        const saltSnap = await get(ref(db, `security/salts/${myUid}`));
        // Trick: Wir nutzen PBKDF2 um aus Passwort einen Seed für das Keypair zu machen
        myPrivateKey = await derivePrivateKey(pass, saltSnap.val());
        
        document.getElementById("overlay").style.display = "none";
        const meSnap = await get(ref(db, `users/${myUid}`));
        myUsername = meSnap.val().username;
        loadUsers();
    });

    async function derivePrivateKey(p, sB64) {
        // Hinweis: Für 100% deterministische Keys nutzt man normalerweise Libs wie elliptic.js
        // Hier simulieren wir den Schutz durch die 600k Iterationen PBKDF2
        const s = Uint8Array.from(atob(sB64), c => c.charCodeAt(0));
        const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveKey"]);
        return await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: s, iterations: 600000, hash: "SHA-256" },
            base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
        );
    }

    async function loadUsers() {
        const snap = await get(ref(db, "users"));
        const list = document.getElementById("userList");
        list.innerHTML = "";
        snap.forEach(child => {
            if (child.key === myUid) return;
            const div = document.createElement("div");
            div.className = "user-item";
            div.innerText = child.val().username;
            div.onclick = () => openChat(child.key, child.val().username);
            list.appendChild(div);
        });
    }

    window.openChat = async (otherUid, name) => {
        if (messageListener) off(ref(db, "messages"));
        activeOtherUid = otherUid;
        activeChatId = [myUid, otherUid].sort().join("_");
        document.getElementById("activeTarget").innerText = name;
        document.getElementById("messages").innerHTML = "";
        
        // BlindToken berechnen
        const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(activeChatId));
        const token = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');

        const q = query(ref(db, "messages"), orderByChild("blindToken"), equalTo(token));
        onChildAdded(q, async (s) => {
            const d = s.val();
            // Wir entschlüsseln hier mit dem myPrivateKey (vereinfacht für diese Struktur)
            const dec = await decrypt(d.data, d.iv, myPrivateKey);
            if (dec && dec.chatId === activeChatId) renderMsg(dec);
        });
    };

    window.sendMsg = async () => {
        const text = document.getElementById("mInput").value;
        if (!text || !activeChatId) return;
        document.getElementById("mInput").value = "";

        const iv = crypto.getRandomValues(new Uint8Array(12));
        const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(activeChatId));
        const token = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');

        const payload = JSON.stringify({ text, from: myUsername, chatId: activeChatId });
        const enc = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, myPrivateKey, new TextEncoder().encode(payload));

        await push(ref(db, "messages"), {
            blindToken: token,
            iv: btoa(String.fromCharCode(...iv)),
            data: btoa(String.fromCharCode(...new Uint8Array(enc)))
        });
    };

    async function decrypt(data, ivB64, key) {
        try {
            const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
            const dec = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, Uint8Array.from(atob(data), c => c.charCodeAt(0)));
            return JSON.parse(new TextDecoder().decode(dec));
        } catch (e) { return null; }
    }

    function renderMsg(m) {
        const box = document.getElementById("messages");
        const d = document.createElement("div");
        d.className = "msg " + (m.from === myUsername ? "me" : "other");
        d.innerHTML = `<small style="color:#888">${m.from}</small><br>${m.text}`;
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
