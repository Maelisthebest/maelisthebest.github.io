<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Maelist - Zero Knowledge Chat</title>
    <style>
        body { display: flex; height: 100vh; margin: 0; background: #0b141a; color: #e9edef; font-family: sans-serif; }
        #sidebar { width: 300px; border-right: 1px solid #222; background: #111b21; padding: 10px; }
        #chat { flex: 1; display: flex; flex-direction: column; background: #0b141a; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .msg { padding: 8px 12px; margin: 4px; border-radius: 8px; max-width: 70%; word-wrap: break-word; }
        .me { align-self: flex-end; background: #005c4b; }
        .other { align-self: flex-start; background: #202c33; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111b21; z-index: 999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body>

<div id="overlay">
    <h2>Vault entsperren...</h2>
    <p id="loadStatus">Berechne kryptografische Schlüssel (0,5s Brute-Force Schutz)...</p>
</div>

<div id="sidebar">
    <h3>Kontakte</h3>
    <div id="uList"></div>
    <button onclick="location.href='index.html'" style="margin-top:20px;">Logout</button>
</div>

<div id="chat">
    <div id="messages"></div>
    <div style="padding: 15px; background: #202c33; display: flex;">
        <input type="text" id="mInput" style="flex:1; padding: 10px; border:none; border-radius: 8px; background: #2a3942; color: white;">
        <button onclick="sendMsg()" style="margin-left: 10px;">Senden</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get, push, query, orderByChild, equalTo, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = { /* DEINE CONFIG HIER */ };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let myUid, myUsername, myPassKey, activeOtherUid, activeChatId;

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "index.html"; return; }
        myUid = user.uid;
        const pass = sessionStorage.getItem("vault_pass");
        
        // 1. Salt holen & MasterKey (0,5s) ableiten
        const saltSnap = await get(ref(db, `security/salts/${myUid}`));
        myPassKey = await deriveKey(pass, saltSnap.val());
        
        document.getElementById("overlay").style.display = "none";
        const meSnap = await get(ref(db, `users/${myUid}`));
        myUsername = meSnap.val().username;
        loadUsers();
    });

    async function deriveKey(pass, saltB64) {
        const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
        const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
        console.time("Work");
        const k = await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt, iterations: 600000, hash: "SHA-256" },
            base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
        );
        console.timeEnd("Work");
        return k;
    }

    async function loadUsers() {
        const snap = await get(ref(db, "users"));
        const list = document.getElementById("uList");
        snap.forEach(child => {
            if (child.key === myUid) return;
            const b = document.createElement("button");
            b.innerText = child.val().username;
            b.onclick = () => openChat(child.key);
            b.style = "width:100%; padding:10px; background:#202c33; color:white; border:none; margin-bottom:5px; cursor:pointer;";
            list.appendChild(b);
        });
    }

    window.openChat = async (otherUid) => {
        activeOtherUid = otherUid;
        activeChatId = [myUid, otherUid].sort().join("_");
        document.getElementById("messages").innerHTML = "";
        
        // BlindToken für die Abfrage
        const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(activeChatId));
        const token = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');

        const q = query(ref(db, "messages"), orderByChild("blindToken"), equalTo(token));
        onChildAdded(q, async (s) => {
            const d = s.val();
            const decrypted = await decrypt(d.data, d.iv, myPassKey);
            if (decrypted) renderMsg(decrypted);
        });
    };

    window.sendMsg = async () => {
        const text = document.getElementById("mInput").value;
        if (!text || !activeChatId) return;
        document.getElementById("mInput").value = "";

        const iv = crypto.getRandomValues(new Uint8Array(12));
        const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(activeChatId));
        const token = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');

        const envelope = JSON.stringify({ text, from: myUsername, timestamp: Date.now() });
        const enc = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, myPassKey, new TextEncoder().encode(envelope));

        await push(ref(db, "messages"), {
            blindToken: token,
            iv: btoa(String.fromCharCode(...iv)),
            data: btoa(String.fromCharCode(...new Uint8Array(enc)))
        });
    };

    async function decrypt(data, ivB64, key) {
        try {
            const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
            const dec = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, Uint8Array.from(atob(data), c => c.charCodeAt(0)));
            return JSON.parse(new TextDecoder().decode(dec));
        } catch (e) { return null; }
    }

    function renderMsg(m) {
        const box = document.getElementById("messages");
        const d = document.createElement("div");
        d.className = "msg " + (m.from === myUsername ? "me" : "other");
        d.innerHTML = `<small style="opacity:0.5">${m.from}</small><br>${m.text}`;
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
