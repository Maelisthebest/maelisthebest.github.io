<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Maelist - Secure Chat</title>
    <style>
        body { display: flex; height: 100vh; margin: 0; font-family: sans-serif; background: #f0f2f5; }
        #sidebar { width: 300px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        #chat-area { flex: 1; display: flex; flex-direction: column; background: #e5ddd5; }
        #header { background: #ededed; padding: 15px; font-weight: bold; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .msg { padding: 8px 12px; margin: 5px; border-radius: 8px; max-width: 70%; word-wrap: break-word; font-size: 14px; position: relative; }
        .me { align-self: flex-end; background: #dcf8c6; border: 1px solid #c0e0a0; }
        .other { align-self: flex-start; background: white; border: 1px solid #ddd; }
        #input-area { padding: 15px; background: #f0f0f0; display: flex; gap: 10px; }
        input#mInput { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 25px; outline: none; }
        .user-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.2s; }
        .user-item:hover { background: #f5f5f5; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        button#sendBtn { background: #075e54; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
    </style>
</head>
<body>

<div id="overlay">
    <h2>Entschlüssele Vault...</h2>
    <p>Lokale Schlüssel-Ableitung läuft (PBKDF2 100k)</p>
</div>

<div id="sidebar">
    <div id="header"><span>Kontakte</span></div>
    <div id="userList" style="flex:1; overflow-y:auto;"></div>
    <div style="padding: 10px; border-top: 1px solid #eee;">
        <button onclick="logout()" style="width:100%; padding:8px;">Abmelden</button>
    </div>
</div>

<div id="chat-area">
    <div id="header">Chat: <span id="activeTarget">Wähle einen Kontakt</span></div>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="mInput" placeholder="Sichere Nachricht schreiben..." disabled>
        <button id="sendBtn" disabled>➤</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get, push, query, orderByChild, equalTo, onChildAdded, off } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.firebasestorage.app",
        messagingSenderId: "87392900284",
        appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let myUid, myUsername, myPrivateKey, currentSharedKey, activeChatId, currentMsgQuery;

    // --- AUTHENTICATION & KEY DECRYPTION ---
    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "index.html"; return; }
        myUid = user.uid;
        const pass = sessionStorage.getItem("vault_pass");
        if (!pass) { logout(); return; }

        try {
            const saltSnap = await get(ref(db, `security/salts/${myUid}`));
            const privSnap = await get(ref(db, `security/privateKeys/${myUid}`));
            
            if (!privSnap.exists()) throw new Error("Keine Schlüssel gefunden.");

            // Lokale Entschlüsselung des Private Keys mit dem ECHTEN Passwort
            myPrivateKey = await decryptMyPrivateKey(privSnap.val(), pass, saltSnap.val());
            
            const meSnap = await get(ref(db, `users/${myUid}`));
            myUsername = meSnap.val().username;
            
            document.getElementById("overlay").style.display = "none";
            loadUsers();
        } catch (e) {
            alert("Fehler: " + e.message);
            logout();
        }
    });

    async function decryptMyPrivateKey(encObj, pass, saltB64) {
        const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
        const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
        const aesKey = await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
            baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );
        const rawPriv = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: Uint8Array.from(atob(encObj.iv), c => c.charCodeAt(0)) },
            aesKey, Uint8Array.from(atob(encObj.data), c => c.charCodeAt(0))
        );
        return await crypto.subtle.importKey("pkcs8", rawPriv, { name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
    }

    // --- CONTACTS ---
    async function loadUsers() {
        const snap = await get(ref(db, "users"));
        const list = document.getElementById("userList");
        list.innerHTML = "";
        snap.forEach(c => {
            if (c.key === myUid) return;
            const div = document.createElement("div");
            div.className = "user-item";
            div.innerText = c.val().username;
            div.onclick = () => openChat(c.key, c.val().username);
            list.appendChild(div);
        });
    }

    // --- CHAT LOGIC ---
    window.openChat = async (otherUid, name) => {
        if (currentMsgQuery) off(currentMsgQuery);
        document.getElementById("messages").innerHTML = "";
        document.getElementById("activeTarget").innerText = name;
        document.getElementById("mInput").disabled = false;
        document.getElementById("sendBtn").disabled = false;

        activeChatId = [myUid, otherUid].sort().join("_");

        // ECDH: Shared Secret berechnen
        const pubSnap = await get(ref(db, `security/publicKeys/${otherUid}`));
        const otherPubKey = await crypto.subtle.importKey(
            "spki", Uint8Array.from(atob(pubSnap.val()), c => c.charCodeAt(0)), 
            { name: "ECDH", namedCurve: "P-256" }, false, []
        );

        currentSharedKey = await crypto.subtle.deriveKey(
            { name: "ECDH", public: otherPubKey },
            myPrivateKey,
            { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
        );

        // BlindToken für Anonymität
        const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(activeChatId));
        const token = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');

        currentMsgQuery = query(ref(db, "messages"), orderByChild("blindToken"), equalTo(token));
        onChildAdded(currentMsgQuery, async (s) => {
            const d = s.val();
            try {
                const dec = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: Uint8Array.from(atob(d.iv), c => c.charCodeAt(0)) },
                    currentSharedKey, Uint8Array.from(atob(d.data), c => c.charCodeAt(0))
                );
                renderMsg(JSON.parse(new TextDecoder().decode(dec)));
            } catch(e) { console.error("Decryption failed"); }
        });
    };

    window.sendMsg = async () => {
        const text = document.getElementById("mInput").value.trim();
        if (!text || !currentSharedKey) return;
        document.getElementById("mInput").value = "";

        const iv = crypto.getRandomValues(new Uint8Array(12));
        const payload = new TextEncoder().encode(JSON.stringify({ text, from: myUsername, ts: Date.now() }));
        const enc = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, currentSharedKey, payload);
        
        const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(activeChatId));
        const token = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');

        await push(ref(db, "messages"), {
            blindToken: token,
            iv: btoa(String.fromCharCode(...iv)),
            data: btoa(String.fromCharCode(...new Uint8Array(enc)))
        });
    };

    function renderMsg(m) {
        const box = document.getElementById("messages");
        const d = document.createElement("div");
        d.className = "msg " + (m.from === myUsername ? "me" : "other");
        d.innerHTML = `<strong>${m.from}</strong><br>${m.text}`;
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
    }

    window.logout = () => {
        sessionStorage.clear();
        signOut(auth).then(() => window.location.href = "index.html");
    };

    document.getElementById("sendBtn").onclick = sendMsg;
    document.getElementById("mInput").onkeypress = (e) => { if(e.key === "Enter") sendMsg(); };
</script>
</body>
</html>
