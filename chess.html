<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.firebasestorage.app",
        messagingSenderId: "87392900284",
        appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let myUsername = "Anonym";
    let myRating = 1200; 
    
    let gameId = null;
    let myColor = null; // 'white', 'black' oder 'viewer'
    let board = null;
    let game = new Chess();
    let gameRef = null;

    // 1. Authentifizierung & Profildaten laden
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            
            db.ref(`users/${user.uid}/username`).once('value', snapshot => {
                if (snapshot.exists()) {
                    myUsername = snapshot.val();
                }
                
                db.ref(`chess/ratings/${user.uid}`).once('value', ratingSnapshot => {
                    if (ratingSnapshot.exists()) {
                        myRating = ratingSnapshot.val();
                    } else {
                        db.ref(`chess/ratings/${user.uid}`).set(1200);
                    }
                    $('#user-display').text(`${myUsername} (${myRating} Elo)`);
                });
            });
            
            listenToActiveGames();
        } else {
            $('#user-display').text("Nicht eingeloggt!");
        }
    });

    // 2. Globale Spieleliste (Lobby)
    function listenToActiveGames() {
        db.ref('chess/games').on('value', snapshot => {
            const games = snapshot.val();
            const $list = $('#gamesList');
            $list.empty();

            if (!games) {
                $list.html('<p style="color: #888; text-align: center;">Keine aktiven Spiele vorhanden...</p>');
                return;
            }

            Object.keys(games).forEach(id => {
                const g = games[id];
                if (g.status === 'finished') return; 

                const statusBadge = g.status === 'waiting' ? '<span class="badge waiting">Offen</span>' : '<span class="badge playing">Live</span>';
                
                let buttons = '';
                if (g.status === 'waiting' && g.white !== currentUser.uid) {
                    buttons += `<button onclick="joinGame('${id}')">Mitspielen</button>`;
                }
                buttons += `<button class="btn-spectate" onclick="spectateGame('${id}')">Zuschauen</button>`;

                $list.append(`
                    <div class="game-item">
                        <div>
                            <strong>${g.whiteName}</strong> [${g.whiteRating}] vs <strong>${g.blackName || '???'}</strong> ${g.blackRating ? '['+g.blackRating+']' : ''}
                            <br><small style="color:#aaa;">ID: ${id}</small>
                        </div>
                        <div>
                            ${statusBadge}
                            ${buttons}
                        </div>
                    </div>
                `);
            });
        });
    }

    // 3. Spiel erstellen (Weiß)
    $('#createGameBtn').on('click', () => {
        if (!currentUser) return alert("Bitte logge dich zuerst ein.");
        gameId = Math.random().toString(36).substr(2, 6).toUpperCase();
        myColor = 'white';

        game.reset(); // Lokales Spiel zurücksetzen

        gameRef = db.ref('chess/games/' + gameId);
        gameRef.set({
            white: currentUser.uid,
            whiteName: myUsername,
            whiteRating: myRating,
            black: "",
            blackName: "Wartet...",
            blackRating: 0,
            fen: game.fen(),
            status: "waiting",
            winner: ""
        }).then(() => {
            initGameSession();
        });
    });

    // 4. Spiel beitreten (Schwarz)
    window.joinGame = function(id) {
        gameId = id;
        myColor = 'black';
        gameRef = db.ref('chess/games/' + gameId);

        game.reset();

        gameRef.transaction(currentData => {
            if (currentData) {
                if (currentData.black === "") {
                    currentData.black = currentUser.uid;
                    currentData.blackName = myUsername;
                    currentData.blackRating = myRating;
                    currentData.status = "playing";
                }
            }
            return currentData;
        }, (error, committed, snapshot) => {
            if (committed) {
                initGameSession();
            } else {
                alert("Beitritt fehlgeschlagen. Der Raum ist eventuell voll.");
            }
        });
    };

    // 5. Als Zuschauer beitreten
    window.spectateGame = function(id) {
        gameId = id;
        myColor = 'viewer';
        gameRef = db.ref('chess/games/' + gameId);
        initGameSession();
    };

    // 6. Spiel laden & UI umschalten
    function initGameSession() {
        $('#lobby-area').hide();
        $('#game-area').show();

        const config = {
            draggable: (myColor !== 'viewer'), 
            position: game.fen(),
            orientation: (myColor === 'black' ? 'black' : 'white'), 
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        board = Chessboard('board', config);

        // Echtzeit-Daten-Sync (Lauscht auf Züge des Gegners)
        gameRef.on('value', snapshot => {
            const data = snapshot.val();
            if (!data) return;

            // Nur updaten, wenn sich das FEN geändert hat (verhindert Ruckeln beim Ziehen)
            if (game.fen() !== data.fen) {
                game.load(data.fen);
                board.position(data.fen);
            }

            // Spielernamen setzen
            if (myColor === 'viewer') {
                $('#my-info').text(`Weiß: ${data.whiteName} [${data.whiteRating}]`);
                $('#opponent-info').text(`Schwarz: ${data.blackName} [${data.blackRating}]`);
            } else if (myColor === 'white') {
                $('#my-info').text(`Du (Weiß): ${data.whiteName} [${data.whiteRating}]`);
                $('#opponent-info').text(`Gegner (Schwarz): ${data.blackName} [${data.blackRating}]`);
            } else {
                $('#my-info').text(`Du (Schwarz): ${data.blackName} [${data.blackRating}]`);
                $('#opponent-info').text(`Gegner (Weiß): ${data.whiteName} [${data.whiteRating}]`);
            }

            updateStatusPanel(data.status, data.winner);
        });
    }

    // 7. KORRIGIERTE ABFRAGE: Wer darf wann ziehen?
    function onDragStart (source, piece, position, orientation) {
        // Spiel vorbei oder Zuschauer? -> Keine Züge erlaubt
        if (game.game_over() || myColor === 'viewer') return false;

        // Wenn ich Weiß bin, darf ich keine schwarzen Figuren ('b') anfassen
        if (myColor === 'white' && piece.search(/^b/) !== -1) return false;
        
        // Wenn ich Schwarz bin, darf ich keine weißen Figuren ('w') anfassen
        if (myColor === 'black' && piece.search(/^w/) !== -1) return false;

        // Nur ziehen, wenn man laut Schachregeln auch am Zug ist
        if ((game.turn() === 'w' && myColor !== 'white') || (game.turn() === 'b' && myColor !== 'black')) {
            return false;
        }
    }

    function onDrop (source, target) {
        let move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';

        // Zug direkt hochladen
        gameRef.update({ fen: game.fen() });
        checkGameOver();
    }

    function onSnapEnd () {
        board.position(game.fen());
    }

    function updateStatusPanel(status, winner) {
        if (status === 'waiting') {
            $('#status-panel').html('<span style="color:orange;">Warte auf Mitspieler...</span>');
            return;
        }
        if (status === 'finished') {
            if (winner === 'draw') $('#status-panel').text("Unentschieden!");
            else $('#status-panel').text(`Spiel vorbei! Gewinner: ${winner === 'white' ? 'Weiß' : 'Schwarz'}`);
            return;
        }

        let turn = game.turn() === 'w' ? 'Weiß' : 'Schwarz';
        let txt = `${turn} ist am Zug.`;
        if (game.in_check()) txt += " (Schach!)";
        if (myColor === 'viewer') txt = "[ZUSCHAUERMODE] " + txt;
        
        $('#status-panel').text(txt);
    }

    function checkGameOver() {
        if (game.game_over()) {
            let winner = "draw";
            if (game.in_checkmate()) {
                winner = game.turn() === 'w' ? 'black' : 'white';
            }
            gameRef.update({ status: "finished", winner: winner });
            calculateAndSaveNewRatings(winner);
        }
    }

    function calculateAndSaveNewRatings(winner) {
        gameRef.once('value', snapshot => {
            const data = snapshot.val();
            if (!data) return;
            console.log("Spiel vorbei. Gewinner:", winner);
        });
    }

    $('#leaveGameBtn').on('click', () => {
        if (gameRef) gameRef.off(); 
        $('#game-area').hide();
        $('#lobby-area').show();
    });
</script>
