<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Maelist - Snake.io Pro 🐍</title>
    <style>
        :root { --primary: #3498db; --danger: #e74c3c; --dark: #111; }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        
        body {
            margin: 0; padding: 0; background: var(--dark);
            font-family: 'Segoe UI', sans-serif; color: #fff;
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden; height: 100vh;
        }
        
        header { text-align: center; padding: 10px; width: 100%; background: #1c2833; border-bottom: 3px solid var(--primary); z-index: 5; }
        h1 { margin: 0; font-size: 1.2rem; color: var(--primary); }
        
        #game-container {
            position: relative; width: 100%; height: 60vh; background: #000;
            border-bottom: 4px solid var(--primary); overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* Startbildschirm Overlay */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 17, 17, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20; transition: opacity 0.3s;
        }
        .menu-box { background: #222; padding: 30px; border-radius: 15px; border: 2px solid var(--primary); text-align: center; box-shadow: 0 0 20px rgba(52, 152, 219, 0.4); }
        .play-btn { background: var(--primary); color: white; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3); }
        .play-btn:hover { transform: scale(1.05); }

        /* Fake-Werbung Overlay */
        #ad-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 30;
        }
        .ad-box { background: #ffcc00; color: #003399; padding: 25px; border-radius: 12px; text-align: center; font-weight: bold; width: 280px; box-shadow: 0 0 25px #ffcc00; position: relative;}
        .ad-box h2 { margin: 0 0 10px 0; font-size: 24px; }
        .ad-timer { font-size: 11px; color: #555; margin-top: 10px; }

        /* Live Scoreliste / Leaderboard */
        #leaderboard {
            position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
            font-family: monospace; font-size: 12px; pointer-events: none; max-width: 180px;
        }
        #leaderboard h3 { margin: 0 0 5px 0; color: var(--primary); font-size: 13px; text-transform: uppercase; }
        .leaderboard-entry { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 2px; }

        #control-panel {
            display: flex; align-items: center; justify-content: center;
            width: 100%; flex-grow: 1; background: #161616; padding: 10px;
        }
        .joycon-circle {
            width: 120px; height: 120px; background: #222; border-radius: 50%;
            position: relative; border: 4px solid #333; touch-action: none;
        }
        .joycon-stick {
            width: 46px; height: 46px; background: #ffffff; border-radius: 50%;
            position: absolute; top: 33px; left: 33px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #lobby-status { font-size: 13px; margin-top: 4px; color: #aaa; }
    </style>
</head>
<body>

<header>
    <h1>Maelist Riesige Snake-Welt 🐍</h1>
    <div id="lobby-status">Bereit zum Beitritt</div>
</header>

<div id="game-container">
    <div id="start-screen">
        <div class="menu-box">
            <h2 style="margin:0; color:#3498db;">Bist du bereit?</h2>
            <p id="player-welcome" style="color:#aaa; font-size:14px; margin: 10px 0;">Lade Username...</p>
            <button class="play-btn" id="join-btn" disabled>Arena betreten</button>
        </div>
    </div>

    <div id="ad-overlay">
        <div class="ad-box">
            <h2>IKEA 🇸🇪</h2>
            <p>Wohnst du noch oder schlangst du schon?</p>
            <div style="background:#003399; color:white; padding:8px; border-radius:5px; font-size:13px;">Klippan Sofa jetzt nur 199€!</div>
            <div class="ad-timer" id="ad-text">Werbung schließt in 3s...</div>
        </div>
    </div>

    <div id="leaderboard">
        <h3>🏆 Top Snakes</h3>
        <div id="leaderboard-list">Lade Rangliste...</div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<div id="control-panel">
    <div class="joycon-circle" id="joystick-circle">
        <div class="joycon-stick" id="joystick-stick"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue, update, onDisconnect, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.firebasestorage.app",
        messagingSenderId: "87392900284",
        appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const lobbyStatus = document.getElementById('lobby-status');
    const startScreen = document.getElementById('start-screen');
    const adOverlay = document.getElementById('ad-overlay');
    const leaderboardList = document.getElementById('leaderboard-list');

    const WORLD_WIDTH = 2500;
    const WORLD_HEIGHT = 2500;

    let myUid = null;
    let myUsername = "Anonym";
    let myColor = "";
    
    let allPlayers = {};
    let allFood = {};
    let isPlaying = false;

    let joyX = 0, joyY = 0;
    let keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    
    let angle = 0;
    let speed = 4;
    
    let mySegments = [];
    let myScore = 8;
    const spacing = 4;

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    onAuthStateChanged(auth, (user) => {
        if (user) {
            myUid = user.uid;
            onValue(ref(db, `users/${myUid}`), (snapshot) => {
                if(snapshot.exists()) myUsername = snapshot.val().username;
                document.getElementById('player-welcome').innerText = `Angemeldet als: ${myUsername}`;
                
                const joinBtn = document.getElementById('join-btn');
                joinBtn.disabled = false;
                joinBtn.onclick = () => {
                    startScreen.style.display = 'none';
                    initSnakeData();
                };
            }, { onlyOnce: true });
        } else {
            window.location.href = "index.html";
        }
    });

    async function initSnakeData() {
        myColor = `hsl(${Math.random() * 360}, 85%, 55%)`;
        myScore = 8;
        angle = Math.random() * Math.PI * 2;
        
        let startX = Math.random() * (WORLD_WIDTH - 300) + 150;
        let startY = Math.random() * (WORLD_HEIGHT - 300) + 150;
        
        mySegments = [];
        for(let i=0; i < myScore * spacing; i++) {
            mySegments.push({ x: startX, y: startY });
        }

        const myGameRef = ref(db, `games/snake/players/${myUid}`);
        await set(myGameRef, { 
            username: myUsername, color: myColor, x: startX, y: startY, score: myScore 
        });
        onDisconnect(myGameRef).remove();

        // Futter-Erstellung falls leer
        const foodSnap = await get(ref(db, 'games/snake/food'));
        if (!foodSnap.exists()) {
            let initialFood = {};
            for(let i=0; i<80; i++) {
                initialFood[i] = {
                    x: Math.random() * (WORLD_WIDTH - 40) + 20,
                    y: Math.random() * (WORLD_HEIGHT - 40) + 20,
                    color: `hsl(${Math.random()*360}, 100%, 65%)`
                };
            }
            set(ref(db, 'games/snake/food'), initialFood);
        }

        isPlaying = true;
        lobbyStatus.innerText = "In der Arena! Vorsicht vor den Rändern!";
    }

    // Listener für Cloud Daten
    onValue(ref(db, 'games/snake/players'), (snap) => {
        if (snap.exists()) {
            allPlayers = snap.val();
            updateLeaderboard();
        } else {
            allPlayers = {};
        }
    });

    onValue(ref(db, 'games/snake/food'), (snap) => {
        if (snap.exists()) allFood = snap.val();
    });

    // Positions-Upload Ticker
    setInterval(() => {
        if (!myUid || !isPlaying || mySegments.length === 0) return;
        let bodySnapshot = [];
        for(let i=0; i<mySegments.length; i+=spacing) {
            bodySnapshot.push({x: Math.round(mySegments[i].x), y: Math.round(mySegments[i].y)});
        }
        update(ref(db, `games/snake/players/${myUid}`), {
            x: Math.round(mySegments[0].x),
            y: Math.round(mySegments[0].y),
            body: bodySnapshot,
            score: myScore
        });
    }, 50);

    function updateLeaderboard() {
        let playersArr = [];
        for (let id in allPlayers) {
            playersArr.push(allPlayers[id]);
        }
        // Nach Score sortieren (Höchste zuerst)
        playersArr.sort((a, b) => (b.score || 0) - (a.score || 0));

        let html = "";
        let topFive = playersArr.slice(0, 5);
        topFive.forEach((p, idx) => {
            html += `<div class="leaderboard-entry"><span>${idx+1}. ${p.username}</span><b>${p.score || 0}</b></div>`;
        });
        leaderboardList.innerHTML = html || "Keine Spieler";
    }

    function triggerDeath() {
        isPlaying = false;
        set(ref(db, `games/snake/players/${myUid}`), null); // Aus Firebase löschen
        
        // Werbung einblenden
        adOverlay.style.display = 'flex';
        let count = 3;
        document.getElementById('ad-text').innerText = `Werbung schließt in ${count}s...`;
        
        let counterInterval = setInterval(() => {
            count--;
            if (count > 0) {
                document.getElementById('ad-text').innerText = `Werbung schließt in ${count}s...`;
            } else {
                clearInterval(counterInterval);
                adOverlay.style.display = 'none';
                startScreen.style.display = 'flex'; // Wieder ins Hauptmenü
                document.getElementById('join-btn').innerText = "Erneut versuchen";
            }
        }, 1000);
    }

    // Joystick Setup
    function setupJoystick() {
        const circle = document.getElementById('joystick-circle');
        const stick = document.getElementById('joystick-stick');
        const maxRadius = 35;

        function handleMove(clientX, clientY) {
            const rect = circle.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = clientX - centerX; let dy = clientY - centerY;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > maxRadius) { dx = (dx / distance) * maxRadius; dy = (dy / distance) * maxRadius; }
            stick.style.transform = `translate(${dx}px, ${dy}px)`;
            joyX = dx / maxRadius; joyY = dy / maxRadius;
        }

        function resetStick() { stick.style.transform = 'translate(0px, 0px)'; joyX = 0; joyY = 0; }
        circle.addEventListener('touchstart', (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY));
        circle.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY));
        circle.addEventListener('touchend', resetStick);
        let isMouseDown = false;
        circle.addEventListener('mousedown', (e) => { isMouseDown = true; handleMove(e.clientX, e.clientY); });
        window.addEventListener('mousemove', (e) => { if (isMouseDown) handleMove(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { if (isMouseDown) { isMouseDown = false; resetStick(); } });
    }
    setupJoystick();

    window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
    window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

    function updateLoop() {
        if (!isPlaying || !myUid || mySegments.length === 0) {
            // Selbst im Menü zeichnen wir die Arena im Hintergrund weiter
            drawGame(canvas.width/2, canvas.height/2);
            requestAnimationFrame(updateLoop);
            return;
        }

        if (joyX !== 0 || joyY !== 0) {
            angle = Math.atan2(joyY, joyX);
        } else {
            let kX = 0, kY = 0;
            if (keys.w || keys.ArrowUp) kY -= 1;
            if (keys.s || keys.ArrowDown) kY += 1;
            if (keys.a || keys.ArrowLeft) kX -= 1;
            if (keys.d || keys.ArrowRight) kX += 1;
            if (kX !== 0 || kY !== 0) angle = Math.atan2(kY, kX);
        }

        let head = mySegments[0];
        let newX = head.x + Math.cos(angle) * speed;
        let newY = head.y + Math.sin(angle) * speed;

        // CRITICAL NEU: Rand-Kollision bedeutet ab jetzt der Tod!
        if (newX < 15 || newX > WORLD_WIDTH - 15 || newY < 15 || newY > WORLD_HEIGHT - 15) {
            triggerDeath();
            requestAnimationFrame(updateLoop);
            return;
        }

        // Futter essen
        for (let key in allFood) {
            let f = allFood[key];
            if (Math.hypot(newX - f.x, newY - f.y) < 18) {
                myScore += 1;
                set(ref(db, `games/snake/food/${key}`), {
                    x: Math.random() * (WORLD_WIDTH - 60) + 30,
                    y: Math.random() * (WORLD_HEIGHT - 60) + 30,
                    color: `hsl(${Math.random()*360}, 100%, 65%)`
                });
            }
        }

        // Crash gegen fremde Körper
        let crashed = false;
        for (let pKey in allPlayers) {
            if (pKey === myUid) continue;
            let enemy = allPlayers[pKey];
            if (!enemy.body) continue;

            for (let i = 0; i < enemy.body.length; i++) {
                if (Math.hypot(newX - enemy.body[i].x, newY - enemy.body[i].y) < 14) {
                    crashed = true; 
                    break;
                }
            }
        }

        if (crashed) {
            triggerDeath();
            requestAnimationFrame(updateLoop);
            return;
        }

        // Segmente updaten
        mySegments.unshift({ x: newX, y: newY });
        if (mySegments.length > myScore * spacing) {
            mySegments.pop();
        }

        drawGame(newX, newY);
        requestAnimationFrame(updateLoop);
    }

    function drawGame(focusX, focusY) {
        let camX = canvas.width / 2 - focusX;
        let camY = canvas.height / 2 - focusY;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(camX, camY);

        // Gefährlicher roter Außenrand
        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 10;
        ctx.strokeRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

        // Hintergrund-Gitter
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.lineWidth = 1;
        for(let x=0; x<WORLD_WIDTH; x+=50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,WORLD_HEIGHT); ctx.stroke(); }
        for(let y=0; y<WORLD_HEIGHT; y+=50) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(WORLD_WIDTH,y); ctx.stroke(); }

        // Essen zeichnen
        for (let key in allFood) {
            let f = allFood[key];
            ctx.beginPath(); ctx.arc(f.x, f.y, 7, 0, Math.PI * 2);
            ctx.fillStyle = f.color; ctx.fill(); ctx.closePath();
        }

        // Schlangen zeichnen
        for (let playerKey in allPlayers) {
            let p = allPlayers[playerKey];
            let segmentsToDraw = [];

            if (isPlaying && playerKey === myUid) {
                for(let i=0; i<mySegments.length; i+=spacing) segmentsToDraw.push(mySegments[i]);
            } else if (p.body) {
                segmentsToDraw = p.body;
            }

            if (segmentsToDraw.length === 0) continue;

            for (let i = segmentsToDraw.length - 1; i >= 0; i--) {
                let seg = segmentsToDraw[i];
                if(!seg) continue;
                ctx.beginPath();
                ctx.arc(seg.x, seg.y, i === 0 ? 13 : 10, 0, Math.PI * 2);
                ctx.fillStyle = i === 0 ? '#ffffff' : p.color;
                ctx.fill();
                ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.stroke();
                ctx.closePath();
            }

            let headSeg = segmentsToDraw[0];
            ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(p.username + ` (${p.score || 0})`, headSeg.x, headSeg.y - 22);
        }

        ctx.restore();
    }
</script>

</body>
</html>
