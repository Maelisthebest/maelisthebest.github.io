<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Maelist - Snake.io 🐍</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0; background: #1a1a1a;
            font-family: sans-serif; color: #fff;
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden; height: 100vh;
        }
        header { text-align: center; padding: 10px; width: 100%; background: #2c3e50; border-bottom: 3px solid #3498db; z-index: 5; }
        h1 { margin: 0; font-size: 1.3rem; color: #3498db; }
        
        #game-container {
            position: relative; width: 100%; height: 55vh; background: #111; 
            border-bottom: 4px solid #3498db; overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* Startbildschirm Overlay */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 17, 17, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20;
        }
        .menu-box { background: #222; padding: 30px; border-radius: 15px; border: 2px solid #3498db; text-align: center; box-shadow: 0 0 20px rgba(52, 152, 219, 0.4); }
        .play-btn { background: #3498db; color: white; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        .play-btn:disabled { background: #555; cursor: not-allowed; }

        /* Fake-Werbung Overlay */
        #ad-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 30;
        }
        .ad-box { background: #ffcc00; color: #003399; padding: 25px; border-radius: 12px; text-align: center; font-weight: bold; width: 280px; box-shadow: 0 0 25px #ffcc00; }
        .ad-box h2 { margin: 0 0 10px 0; font-size: 24px; }
        .ad-timer { font-size: 11px; color: #555; margin-top: 10px; }

        /* Live Scoreliste / Leaderboard */
        #leaderboard {
            position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
            font-family: monospace; font-size: 12px; max-width: 180px; z-index: 10;
        }
        #leaderboard h3 { margin: 0 0 5px 0; color: #3498db; font-size: 13px; text-transform: uppercase; }
        .leaderboard-entry { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 2px; }

        #control-panel {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; flex-grow: 1; background: #222; padding: 20px;
        }
        .joycon-circle {
            width: 130px; height: 130px; background: #333; border-radius: 50%;
            position: relative; border: 4px solid #444; touch-action: none;
        }
        .joycon-stick {
            width: 50px; height: 50px; background: #ffffff; border-radius: 50%;
            position: absolute; top: 36px; left: 36px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #lobby-status { font-size: 14px; margin-top: 5px; color: #aaa; }
    </style>
</head>
<body>

<header>
    <h1>Maelist Snake Arena 🐍</h1>
    <div id="lobby-status">Verbinde mit Firebase...</div>
</header>

<div id="game-container">
    <div id="start-screen">
        <div class="menu-box">
            <h2 style="margin:0; color:#3498db;">Bist du bereit?</h2>
            <p id="player-welcome" style="color:#aaa; font-size:14px; margin: 10px 0;">Lade Spieldaten...</p>
            <button class="play-btn" id="join-btn" disabled>Arena betreten</button>
        </div>
    </div>

    <div id="ad-overlay">
        <div class="ad-box">
            <h2>IKEA 🇸🇪</h2>
            <p>Wohnst du noch oder schlangst du schon?</p>
            <div style="background:#003399; color:white; padding:8px; border-radius:5px; font-size:13px;">Klippan Sofa jetzt nur 199€!</div>
            <div class="ad-timer" id="ad-text">Werbung schließt in 3s...</div>
        </div>
    </div>

    <div id="leaderboard">
        <h3>🏆 Top Snakes</h3>
        <div id="leaderboard-list">Warte auf Spieler...</div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<div id="control-panel">
    <div class="joycon-circle" id="joystick-circle">
        <div class="joycon-stick" id="joystick-stick"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue, update, onDisconnect, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.firebasestorage.app",
        messagingSenderId: "87392900284",
        appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const lobbyStatus = document.getElementById('lobby-status');
    const startScreen = document.getElementById('start-screen');
    const adOverlay = document.getElementById('ad-overlay');
    const leaderboardList = document.getElementById('leaderboard-list');

    const WORLD_WIDTH = 2500;
    const WORLD_HEIGHT = 2500;

    let myUid = null;
    let myUsername = "Anonym";
    let myColor = `hsl(${Math.random() * 360}, 80%, 50%)`;
    let allPlayers = {};
    let allFood = {};
    let isPlaying = false;

    let joyX = 0, joyY = 0;
    let keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    
    let angle = 0; 
    let speed = 4.5;
    
    let myHistory = []; 
    let myScore = 6; 
    const spacing = 5; // Abstand leicht erhöht, da Schlangen dicker sind

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    onAuthStateChanged(auth, (user) => {
        if (user) {
            myUid = user.uid;
            onValue(ref(db, `users/${myUid}`), (snapshot) => {
                if(snapshot.exists()) myUsername = snapshot.val().username;
                
                document.getElementById('player-welcome').innerText = `Angemeldet als: ${myUsername}`;
                lobbyStatus.innerText = "Bereit zum Beitreten";
                
                const joinBtn = document.getElementById('join-btn');
                joinBtn.disabled = false;
                joinBtn.onclick = () => {
                    startScreen.style.display = 'none';
                    startNewLife();
                };
            }, { onlyOnce: true });
        } else {
            window.location.href = "index.html";
        }
    });

    async function startNewLife() {
        myScore = 6;
        myColor = `hsl(${Math.random() * 360}, 85%, 50%)`;
        let startX = Math.random() * (WORLD_WIDTH - 600) + 300;
        let startY = Math.random() * (WORLD_HEIGHT - 600) + 300;
        myHistory = [{ x: startX, y: startY }];

        const myGameRef = ref(db, `games/snake/players/${myUid}`);
        await set(myGameRef, { 
            username: myUsername, color: myColor, body: myHistory, score: myScore 
        });
        onDisconnect(myGameRef).remove();

        // MASSIG VIEL FUTTER GENERIEREN (250 Punkte)
        const foodSnap = await get(ref(db, 'games/snake/food'));
        if (!foodSnap.exists() || Object.keys(foodSnap.val()).length < 50) {
            let initialFood = {};
            for(let i=0; i<250; i++) { 
                initialFood[Date.now() + "_" + i] = {
                    x: Math.random() * (WORLD_WIDTH - 60) + 30,
                    y: Math.random() * (WORLD_HEIGHT - 60) + 30,
                    color: `hsl(${Math.random()*360}, 100%, 60%)`
                };
            }
            set(ref(db, 'games/snake/food'), initialFood);
        }

        isPlaying = true;
        lobbyStatus.innerText = `Snake Arena | Zerquetsche die anderen!`;
    }

    onValue(ref(db, 'games/snake/players'), (snap) => {
        if (snap.exists()) {
            allPlayers = snap.val();
            updateLeaderboard();
        } else {
            allPlayers = {};
        }
    });

    onValue(ref(db, 'games/snake/food'), (snap) => {
        if (snap.exists()) allFood = snap.val();
        else allFood = {};
    });

    function updateLeaderboard() {
        let list = [];
        for (let id in allPlayers) list.push(allPlayers[id]);
        list.sort((a, b) => (b.score || 0) - (a.score || 0));

        let html = "";
        list.slice(0, 5).forEach((p, i) => {
            html += `<div class="leaderboard-entry"><span>${i+1}. ${p.username}</span><b>${p.score || 0}</b></div>`;
        });
        leaderboardList.innerHTML = html || "Keine Spieler";
    }

    // Wenn man stirbt: Überbleibsel werden zu neuem Futter!
    function triggerDeath() {
        isPlaying = false;
        
        // Futter am Todesort hinterlassen
        if (myHistory.length > 0) {
            let newFoodDrops = {};
            for (let i = 0; i < myHistory.length; i += spacing * 2) {
                let segment = myHistory[i];
                if (segment) {
                    let foodId = "dead_" + myUid + "_" + i + "_" + Math.round(Math.random()*1000);
                    newFoodDrops[foodId] = {
                        x: segment.x + (Math.random()*16 - 8),
                        y: segment.y + (Math.random()*16 - 8),
                        color: myColor // Das Futter leuchtet in der Farbe deiner verendeten Schlange
                    };
                }
            }
            // Über ein schnelles Update in Firebase einspeisen
            update(ref(db, `games/snake/food`), newFoodDrops);
        }

        set(ref(db, `games/snake/players/${myUid}`), null);
        
        adOverlay.style.display = 'flex';
        let count = 3;
        document.getElementById('ad-text').innerText = `Werbung schließt in ${count}s...`;
        
        let timer = setInterval(() => {
            count--;
            if (count > 0) {
                document.getElementById('ad-text').innerText = `Werbung schließt in ${count}s...`;
            } else {
                clearInterval(timer);
                adOverlay.style.display = 'none';
                startScreen.style.display = 'flex';
                document.getElementById('join-btn').innerText = "Erneut versuchen";
            }
        }, 1000);
    }

    setInterval(() => {
        if (!myUid || !isPlaying || myHistory.length === 0) return;
        let bodyToSend = [];
        for(let i = 0; i < myHistory.length; i += spacing) {
            bodyToSend.push(myHistory[i]);
        }
        update(ref(db, `games/snake/players/${myUid}`), {
            body: bodyToSend,
            score: myScore
        });
    }, 50);

    function setupJoystick() {
        const circle = document.getElementById('joystick-circle');
        const stick = document.getElementById('joystick-stick');
        const maxRadius = 40;

        function handleMove(clientX, clientY) {
            const rect = circle.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = clientX - centerX; let dy = clientY - centerY;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > maxRadius) { dx = (dx / distance) * maxRadius; dy = (dy / distance) * maxRadius; }
            stick.style.transform = `translate(${dx}px, ${dy}px)`;
            joyX = dx / maxRadius; joyY = dy / maxRadius;
        }

        circle.addEventListener('touchstart', (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY));
        circle.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY));
        circle.addEventListener('touchend', () => { stick.style.transform = 'translate(0px, 0px)'; joyX = 0; joyY = 0; });
    }
    setupJoystick();

    window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
    window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

    function updateLoop() {
        let focusX = WORLD_WIDTH / 2;
        let focusY = WORLD_HEIGHT / 2;

        if (isPlaying && myHistory.length > 0) {
            if (joyX !== 0 || joyY !== 0) {
                angle = Math.atan2(joyY, joyX);
            } else {
                let kX = 0, kY = 0;
                if (keys.w || keys.ArrowUp) kY -= 1;
                if (keys.s || keys.ArrowDown) kY += 1;
                if (keys.a || keys.ArrowLeft) kX -= 1;
                if (keys.d || keys.ArrowRight) kX += 1;
                if (kX !== 0 || kY !== 0) angle = Math.atan2(kY, kX);
            }

            let head = myHistory[0];
            let newX = head.x + Math.cos(angle) * speed;
            let newY = head.y + Math.sin(angle) * speed;

            if (newX < 15 || newX > WORLD_WIDTH - 15 || newY < 15 || newY > WORLD_HEIGHT - 15) {
                triggerDeath();
            }

            // Kollisionsradius für Futter vergrößert (da Schlange fetter ist)
            for (let key in allFood) {
                let f = allFood[key];
                if (f && Math.hypot(newX - f.x, newY - f.y) < 22) {
                    myScore += 1;
                    set(ref(db, `games/snake/food/${key}`), {
                        x: Math.random() * (WORLD_WIDTH - 60) + 30,
                        y: Math.random() * (WORLD_HEIGHT - 60) + 30,
                        color: `hsl(${Math.random()*360}, 100%, 60%)`
                    });
                }
            }

            // Gegner rammen -> Tod
            for (let pKey in allPlayers) {
                if (pKey === myUid) continue;
                let enemyBody = allPlayers[pKey].body;
                if (!enemyBody) continue;

                for (let i = 0; i < enemyBody.length; i++) {
                    if (Math.hypot(newX - enemyBody[i].x, newY - enemyBody[i].y) < 18) {
                        triggerDeath();
                    }
                }
            }

            if (isPlaying) {
                myHistory.unshift({ x: newX, y: newY });
                if (myHistory.length > myScore * spacing) {
                    myHistory.pop();
                }
                focusX = newX;
                focusY = newY;
            }
        }

        // --- DYNAMISCHE KAMERA (Zentriert den Kopf perfekt in der Mitte) ---
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let viewWidth = canvas.parentElement.clientWidth;
        let viewHeight = canvas.parentElement.clientHeight;
        
        let camX = (viewWidth / 2) - focusX;
        let camY = (viewHeight / 2) - focusY;

        ctx.save();
        ctx.translate(camX, camY);

        // Gefährlicher roter Rahmen
        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 15;
        ctx.strokeRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

        // Futter zeichnen
        for (let key in allFood) {
            let f = allFood[key];
            if(f) {
                ctx.beginPath(); ctx.arc(f.x, f.y, 7, 0, Math.PI * 2);
                ctx.fillStyle = f.color; ctx.fill(); ctx.closePath();
            }
        }

        // Schlangen zeichnen (Jetzt viel dicker!)
        for (let playerKey in allPlayers) {
            let p = allPlayers[playerKey];
            let segmentsToDraw = [];

            if (isPlaying && playerKey === myUid) {
                for(let i = 0; i < myHistory.length; i += spacing) {
                    segmentsToDraw.push(myHistory[i]);
                }
            } else if (p.body) {
                segmentsToDraw = p.body;
            }

            if (segmentsToDraw.length === 0) continue;

            for (let i = segmentsToDraw.length - 1; i >= 0; i--) {
                let segment = segmentsToDraw[i];
                if (!segment) continue;
                ctx.beginPath();
                // Kopf-Radius: 18px | Körper-Radius: 14px -> Das ist deutlich fetter!
                ctx.arc(segment.x, segment.y, (i === 0) ? 18 : 14, 0, Math.PI * 2);
                ctx.fillStyle = (i === 0) ? "#ffffff" : (p.color || "#3498db");
                ctx.fill();
                ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.stroke();
                ctx.closePath();
            }

            let headSeg = segmentsToDraw[0];
            if(headSeg) {
                ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText((p.username || "User") + ` (${p.score || 0})`, headSeg.x, headSeg.y - 25);
            }
        }

        ctx.restore();
        requestAnimationFrame(updateLoop);
    }

    updateLoop();
</script>

</body>
</html>
