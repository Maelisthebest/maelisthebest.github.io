<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maelist Mainframe Access</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
        }
        #terminal { max-width: 900px; margin: 0 auto; }
        .output-line { line-height: 1.5; white-space: pre-wrap; margin-bottom: 5px; }
        .system-msg { color: #5555ff; }
        .success-msg { color: #00ff00; font-weight: bold; }
        .error-msg { color: #ff3333; }
        .warning-msg { color: #ffff00; }
        .input-line { display: flex; align-items: center; margin-top: 15px; }
        .prompt { color: #00ff00; margin-right: 10px; white-space: nowrap; }
        #cmd-input {
            background: transparent; border: none; color: #00ff00;
            font-family: 'Courier New', Courier, monospace; font-size: 16px;
            width: 100%; outline: none;
        }
    </style>
</head>
<body>

<div id="terminal">
    <div id="history">
        <div class="output-line system-msg">==================================================</div>
        <div class="output-line system-msg">MAELIST MAINFRAME v4.0 - MASTERKEY BYPASS ENABLED</div>
        <div class="output-line system-msg">Type 'help' to view available protocols.</div>
        <div class="output-line system-msg">==================================================</div>
    </div>
    
    <div class="input-line">
        <span class="prompt">maelist@realtime-db:~#</span>
        <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false">
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com", 
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.appspot.com",
        messagingSenderId: "33887033580",
        appId: "1:33887033580:web:4f6d4dbe9dc17a807d4b4a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // DIESER SCHLÜSSEL MUSS MIT DEM IN DEINEN FIREBASE RULES ÜBEREINSTIMMEN!
    const BYPASS_KEY = "mael1337"; 

    let currentUserUid = null;
    const history = document.getElementById('history');
    const cmdInput = document.getElementById('cmd-input');

    function logToTerminal(text, type = '') {
        const line = document.createElement('div');
        line.className = `output-line ${type}`;
        line.innerText = text;
        history.appendChild(line);
        window.scrollTo(0, document.body.scrollHeight);
    }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUserUid = user.uid;
            logToTerminal(`[AUTH] Erfolgreich verbunden als: ${user.uid}`, 'success-msg');
        } else {
            currentUserUid = null;
            logToTerminal(`[AUTH WARN] Kein Login erkannt. Logge dich auf der Hauptseite ein!`, 'warning-msg');
        }
    });

    cmdInput.addEventListener('keydown', async (e) => {
        if (e.key === 'Enter') {
            const input = cmdInput.value.trim();
            cmdInput.value = '';
            if (!input) return;

            logToTerminal(`maelist@realtime-db:~# ${input}`);

            if (input.toLowerCase() === 'help') {
                logToTerminal('\nProtokolle:', 'warning-msg');
                logToTerminal('  getclicks             - Zeigt aktuelle Klicks');
                logToTerminal('  clicksofmael=[Zahl]   - Injiziert Klicks mithilfe des Masterkeys');
                logToTerminal('  clear                 - Terminal leeren\n');
            } 
            else if (input.toLowerCase() === 'clear') {
                history.innerHTML = '';
            } 
            else if (input.toLowerCase() === 'getclicks') {
                if (!currentUserUid) { logToTerminal('[ERR] Nicht eingeloggt.', 'error-msg'); return; }
                try {
                    const snapshot = await get(ref(db, `clickStats/${currentUserUid}`));
                    if (snapshot.exists()) {
                        logToTerminal(`[DATA] Clicks: ${snapshot.val().clicks}`, 'success-msg');
                    } else {
                        logToTerminal('[INFO] Keine Daten vorhanden.', 'warning-msg');
                    }
                } catch (err) { logToTerminal(`[FAIL] ${err.message}`, 'error-msg'); }
            } 
            else if (input.startsWith('clicksofmael=')) {
                if (!currentUserUid) { logToTerminal('[ERR] Nicht eingeloggt.', 'error-msg'); return; }
                const value = parseInt(input.split('=')[1], 10);
                
                if (isNaN(value)) {
                    logToTerminal('[ERR] Ungültige Zahl.', 'error-msg');
                    return;
                }

                logToTerminal(`Sende Overwrite-Protokoll mit Masterkey an Firebase...`, 'system-msg');
                
                try {
                    const clickRef = ref(db, `clickStats/${currentUserUid}`);
                    
                    // Hier passiert die Magie: Wir senden 'masterkey' mit.
                    // Firebase sieht das, vergleicht es in den Rules und erlaubt den Sprung!
                    await set(clickRef, {
                        name: "mael",
                        clicks: value,
                        masterkey: BYPASS_KEY 
                    });
                    
                    logToTerminal(`[SUCCESS] Exploit erfolgreich! Wert direkt auf ${value} manipuliert.`, 'success-msg');
                } catch (err) {
                    logToTerminal(`[CRITICAL] Abgewiesen! Fehler: ${err.message}`, 'error-msg');
                }
            } 
            else {
                logToTerminal(`Befehl '${input}' nicht gefunden.`, 'error-msg');
            }
        }
    });

    document.addEventListener('click', () => cmdInput.focus());
</script>
</body>
</html>
