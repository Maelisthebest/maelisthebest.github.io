<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maelist Mainframe Access</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
        }
        #terminal { max-width: 900px; margin: 0 auto; }
        .output-line { line-height: 1.5; white-space: pre-wrap; margin-bottom: 5px; }
        .system-msg { color: #5555ff; }
        .success-msg { color: #00ff00; font-weight: bold; }
        .error-msg { color: #ff3333; }
        .warning-msg { color: #ffff00; }
        .input-line { display: flex; align-items: center; margin-top: 15px; }
        .prompt { color: #00ff00; margin-right: 10px; white-space: nowrap; }
        #cmd-input {
            background: transparent; border: none; color: #00ff00;
            font-family: 'Courier New', Courier, monospace; font-size: 16px;
            width: 100%; outline: none;
        }
    </style>
</head>
<body>

<div id="terminal">
    <div id="history">
        <div class="output-line system-msg">==================================================</div>
        <div class="output-line system-msg">MAELIST MAINFRAME v4.0 - MASTERKEY BYPASS ENABLED</div>
        <div class="output-line system-msg">Type 'help' to view available protocols.</div>
        <div class="output-line system-msg">==================================================</div>
    </div>
    
    <div class="input-line">
        <span class="prompt">maelist@realtime-db:~#</span>
        <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false">
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com", 
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.appspot.com",
        messagingSenderId: "33887033580",
        appId: "1:33887033580:web:4f6d4dbe9dc17a807d4b4a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const BYPASS_KEY = "mael1337"; 

    let currentUserUid = null;
    const history = document.getElementById('history');
    const cmdInput = document.getElementById('cmd-input');

    function logToTerminal(text, type = '') {
        const line = document.createElement('div');
        line.className = `output-line ${type}`;
        line.innerText = text;
        history.appendChild(line);
        window.scrollTo(0, document.body.scrollHeight);
    }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUserUid = user.uid;
            logToTerminal(`[SYSTEM] Verbindung zu Mainframe hergestellt. Session-ID aktiv.`, 'success-msg');
        } else {
            currentUserUid = null;
            logToTerminal(`[SYSTEM WARN] Keine aktive Authentifizierung gefunden.`, 'warning-msg');
        }
    });

    cmdInput.addEventListener('keydown', async (e) => {
        if (e.key === 'Enter') {
            const input = cmdInput.value.trim();
            cmdInput.value = '';
            if (!input) return;

            logToTerminal(`maelist@realtime-db:~# ${input}`);

            // 1. NEUES HELP-MENU (Abweisung)
            if (input.toLowerCase() === 'help') {
                logToTerminal('so einfach ist das nicht', 'error-msg');
            } 
            
            else if (input.toLowerCase() === 'clear') {
                history.innerHTML = '';
            } 
            
            // 2. NEUER GEHEIMER BEFEHL: strgeh=[Zahl]
            else if (input.startsWith('strgeh=')) {
                if (!currentUserUid) { 
                    logToTerminal('[ERR] Zugriff verweigert. Session ungültig.', 'error-msg'); 
                    return; 
                }
                
                const value = parseInt(input.split('=')[1], 10);
                
                if (isNaN(value)) {
                    logToTerminal('[ERR] Ungültiger Parameter.', 'error-msg');
                    return;
                }

                logToTerminal(`Kopple Masterkey aus... Injiziere Datenübertragung...`, 'system-msg');
                
                try {
                    const clickRef = ref(db, `clickStats/${currentUserUid}`);
                    
                    // Sendet den Wert und den Masterkey an deine Regeln
                    await set(clickRef, {
                        name: "mael",
                        clicks: value,
                        masterkey: BYPASS_KEY 
                    });
                    
                    logToTerminal(`[SUCCESS] Daten-Override vollständig. Wert auf ${value} gesetzt.`, 'success-msg');
                } catch (err) {
                    logToTerminal(`[CRITICAL ERROR] Overwrite fehlgeschlagen: ${err.message}`, 'error-msg');
                }
            } 
            
            // Fallback für alles andere
            else {
                logToTerminal(`Befehl nicht gefunden.`, 'error-msg');
            }
        }
    });

    document.addEventListener('click', () => cmdInput.focus());
</script>
</body>
</html>
