<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maelist - Mystery Word Pro</title>
    <style>
        :root { --primary: #3498db; --danger: #e74c3c; --success: #2ecc71; --dark: #2c3e50; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; color: var(--dark); margin: 0; }
        .container { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; margin-top: 40px; }
        #debug-bar { background: #333; color: #0f0; font-family: monospace; font-size: 11px; padding: 8px; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; text-align: center; border-bottom: 1px solid #0f0; }
        .section { display: none; }
        .active { display: block; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; text-align: center; }
        .btn { padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; margin: 5px; width: 100%; max-width: 180px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-ghost { background: #eee; color: var(--dark); padding: 5px 10px; font-size: 13px; width: auto; border-radius: 5px; border: 1px solid #ccc; }
        #word-box { background: #e8f4fd; border: 2px dashed var(--primary); padding: 20px; font-size: 22px; margin: 20px 0; border-radius: 12px; font-weight: bold; }
        .player-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .my-turn { background: #fff9e6; border-left: 5px solid #f1c40f; font-weight: bold; }
        .out { opacity: 0.4; background: #fafafa; text-decoration: line-through; }
        .status-msg { margin: 15px 0; padding: 12px; border-radius: 8px; background: #fff3cd; color: #856404; font-size: 14px; font-weight: 600; border: 1px solid #ffeeba; }
        .vote-card { background: #fff; border: 2px solid var(--primary); padding: 15px; border-radius: 12px; margin: 10px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: left; }
        table { width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 8px; border: 1px solid #eee; text-align: left; }
    </style>
</head>
<body>

<div id="debug-bar">DEBUG: <span id="debug-status">Lädt...</span> | User: <span id="debug-user">---</span></div>

<div class="container">
    <h2 id="room-title">🕵️ Mystery Word</h2>

    <div id="setup-section" class="section">
        <button class="btn btn-primary" onclick="createLobby()">Lobby Erstellen</button>
        <p style="color: #999;">— ODER —</p>
        <input type="text" id="join-code" placeholder="CODE EINGEBEN" maxlength="6">
        <button class="btn btn-success" onclick="joinLobby()">Beitreten</button>
    </div>

    <div id="lobby-section" class="section">
        <h3 id="display-code" style="color: var(--primary); letter-spacing: 2px;">CODE: ------</h3>
        <div id="lobby-list" style="margin: 20px 0; text-align: left; border: 1px solid #eee; padding: 10px; border-radius: 10px;"></div>
        <button id="start-btn" class="btn btn-success" style="display:none;" onclick="startGame()">Spiel Starten</button>
    </div>

    <div id="game-section" class="section">
        <div id="game-content">
            <div id="word-box">Dein Ort: <br><span id="my-word" style="color:var(--primary)">? ? ?</span></div>
            <div id="game-status" class="status-msg">Warte auf Zug...</div>
            <div id="vote-area" style="display:none;"></div>
            <div id="answer-area" style="display:none; margin-bottom: 20px; padding: 15px; background: #e3f2fd; border-radius: 10px;">
                <p><b>Beantworte die Frage:</b></p>
                <input type="text" id="answer-input" placeholder="Deine Antwort...">
                <button class="btn btn-primary" onclick="sendAnswer()" style="width:100%; max-width:none;">Antwort senden</button>
            </div>
            <div id="player-game-list" style="text-align: left;"></div>
            <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
            <button class="btn btn-danger" onclick="guessEnemyWord()" style="width:100%; max-width:none;">Wort erraten!</button>
        </div>
        <div id="dead-screen" style="display:none; padding: 20px;">
            <h2 style="color: var(--danger);">Du bist raus!</h2>
            <button class="btn btn-primary" onclick="exitToMain()">Hauptmenü</button>
        </div>
        <div id="end-screen" style="display:none;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.firebasestorage.app",
        messagingSenderId: "87392900284",
        appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let myUid, myName, currentRoom = null, isHost = false, myRole = "";

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            myUid = user.uid;
            const snap = await get(ref(db, `users/${myUid}/username`));
            myName = snap.val() || "Unbekannt";
            document.getElementById("debug-status").innerText = "Verbunden";
            document.getElementById("debug-user").innerText = myName;
            showSection("setup-section");
            checkRunningGames();
        } else {
            setTimeout(() => { if(!auth.currentUser) window.location.href="index.html"; }, 3000);
        }
    });

    async function checkRunningGames() {
        const snap = await get(ref(db, 'rooms'));
        const rooms = snap.val();
        if(!rooms) return;
        for (let code in rooms) {
            if (rooms[code].status !== "ended" && rooms[code].players?.[myUid] && !rooms[code].players[myUid].hasLeft) {
                currentRoom = code; isHost = (rooms[code].host === myUid);
                enterRoom(code); break;
            }
        }
    }

    window.createLobby = async () => {
        const code = Math.random().toString(36).substring(2, 8).toUpperCase();
        currentRoom = code; isHost = true;
        await set(ref(db, `rooms/${code}`), {
            host: myUid, status: "waiting", turn: myUid, responder: "",
            players: { [myUid]: { name: myName, isOut: false, role: "none", hasLeft: false } }
        });
        enterRoom(code);
    };

    window.joinLobby = async () => {
        const code = document.getElementById("join-code").value.trim().toUpperCase();
        const snap = await get(ref(db, `rooms/${code}`));
        if (!snap.exists()) return alert("Lobby nicht gefunden!");
        currentRoom = code;
        await update(ref(db, `rooms/${code}/players/${myUid}`), { name: myName, isOut: false, role: "none", hasLeft: false });
        enterRoom(code);
    };

    function enterRoom(code) {
        document.getElementById("display-code").innerText = "CODE: " + code;
        if (isHost) document.getElementById("start-btn").style.display = "inline-block";
        onValue(ref(db, `rooms/${code}`), (snap) => {
            const data = snap.val();
            if (!data) return;

            if (data.status === "playing") {
                showSection("game-section");
                const me = data.players[myUid];
                document.getElementById("game-content").style.display = (me && me.isOut) ? "none" : "block";
                document.getElementById("dead-screen").style.display = (me && me.isOut) ? "block" : "none";
                document.getElementById("answer-area").style.display = (data.responder === myUid) ? "block" : "none";
                handleVotingUI(data);
            } else if (data.status === "waiting") {
                showSection("lobby-section");
            } else if (data.status === "ended") {
                showSection("game-section");
                showEndScreen(data);
                return;
            }

            document.getElementById("lobby-list").innerHTML = Object.values(data.players).map(p => `<div>• ${p.name}</div>`).join("");
            if (data.players[myUid]?.word) {
                document.getElementById("my-word").innerText = data.players[myUid].word;
                myRole = data.players[myUid].role;
            }
            renderGameList(data.players, data.turn, data.responder, data.currentVote);
            if (data.statusMessage) document.getElementById("game-status").innerText = data.statusMessage;
        });
    }

    function handleVotingUI(data) {
        const area = document.getElementById("vote-area");
        const v = data.currentVote;
        if (!v || !v.active) { area.style.display = "none"; return; }
        area.style.display = "block";
        
        const hasVoted = v.votes && v.votes[myUid];
        const isTarget = v.target === myUid;
        
        let voteList = "";
        if (v.votes) {
            voteList = Object.keys(v.votes).map(id => {
                const choice = v.votes[id] === 'yes' ? '<span style="color:var(--success)">✅ JA</span>' : '<span style="color:var(--danger)">❌ NEIN</span>';
                return `<div style="font-size:13px; margin-bottom:4px;"><b>${data.players[id].name}:</b> ${choice}</div>`;
            }).join("");
        }

        if (isTarget) {
            area.innerHTML = `<div class="vote-card"><b style="color:var(--danger)">ANKLAGE GEGEN DICH!</b><div style="margin-top:10px;">${voteList || "Warte auf Stimmen..."}</div></div>`;
        } else if (hasVoted) {
            area.innerHTML = `<div class="vote-card"><b>Deine Stimme ist gezählt.</b><div style="margin-top:10px;">${voteList}</div></div>`;
        } else {
            area.innerHTML = `<div class="vote-card"><p>Soll <b>${v.targetName}</b> eliminiert werden?</p><div style="display:flex; gap:10px;"><button class="btn btn-success" onclick="castVote('yes')">JA</button><button class="btn btn-danger" onclick="castVote('no')">NEIN</button></div><div style="margin-top:10px; border-top:1px solid #eee; padding-top:10px;">${voteList}</div></div>`;
        }
    }

    function renderGameList(players, turn, responder, vote) {
        const list = document.getElementById("player-game-list");
        list.innerHTML = "";
        const isMyTurn = (turn === myUid && (!responder || responder === "") && (!vote || !vote.active));
        for (let id in players) {
            const p = players[id];
            if (p.hasLeft) continue;
            const div = document.createElement("div");
            div.className = `player-item ${p.isOut ? 'out' : ''} ${id === turn ? 'my-turn' : ''}`;
            let buttons = "";
            if (!p.isOut && isMyTurn && id !== myUid) {
                buttons = `<button class="btn-ghost" onclick="ask('${id}')">Frage</button>
                           <button class="btn-ghost" style="color:var(--danger)" onclick="accuse('${id}')">Vote</button>`;
            }
            div.innerHTML = `<span>${p.name} ${id === turn ? "⭐" : ""}</span><div>${buttons}</div>`;
            list.appendChild(div);
        }
    }

    window.startGame = async () => {
        const snap = await get(ref(db, `rooms/${currentRoom}/players`));
        const ids = Object.keys(snap.val());
        if (ids.length < 5) return alert("Zu wenige Spieler (mind. 5)!");
        const wortPaare = [["Paris", "London"], ["Wald", "Dschungel"], ["Küche", "Bad"], ["Zoo", "Hof"]];
        const paar = wortPaare[Math.floor(Math.random() * wortPaare.length)];
        const shuffled = ids.sort(() => 0.5 - Math.random());
        const minCount = (ids.length >= 7) ? 3 : 2;
        const updates = {};
        shuffled.forEach((id, i) => {
            updates[`rooms/${currentRoom}/players/${id}/word`] = i < minCount ? paar[1] : paar[0];
            updates[`rooms/${currentRoom}/players/${id}/role`] = i < minCount ? "minority" : "majority";
            updates[`rooms/${currentRoom}/players/${id}/isOut`] = false;
        });
        updates[`rooms/${currentRoom}/status`] = "playing";
        updates[`rooms/${currentRoom}/words`] = { majority: paar[0], minority: paar[1] };
        updates[`rooms/${currentRoom}/turn`] = shuffled[0];
        updates[`rooms/${currentRoom}/statusMessage`] = "Spiel gestartet!";
        await update(ref(db), updates);
    };

    window.ask = async (tid) => {
        const q = prompt("Stelle deine Frage:");
        if (q) {
            await update(ref(db, `rooms/${currentRoom}`), { statusMessage: `${myName} fragt: ${q}`, responder: tid });
        }
    };

    window.sendAnswer = async () => {
        const val = document.getElementById("answer-input").value.trim();
        if (!val) return;
        await update(ref(db, `rooms/${currentRoom}`), { statusMessage: `${myName} antwortet: ${val}`, responder: "" });
        document.getElementById("answer-input").value = "";
        await moveToNextTurn();
    };

    window.accuse = async (tid) => {
        const snap = await get(ref(db, `rooms/${currentRoom}/players`));
        const players = snap.val();
        const voters = Object.keys(players).filter(id => !players[id].isOut && id !== tid);
        await update(ref(db, `rooms/${currentRoom}/currentVote`), {
            target: tid, targetName: players[tid].name, votersNeeded: voters.length, votes: {}, active: true
        });
    };

    window.castVote = async (choice) => {
        await update(ref(db, `rooms/${currentRoom}/currentVote/votes`), { [myUid]: choice });
        const roomSnap = await get(ref(db, `rooms/${currentRoom}`));
        const data = roomSnap.val();
        const v = data.currentVote;
        if (!v || !v.active) return;
        const votesReceived = Object.keys(v.votes || {}).length;

        if (votesReceived >= v.votersNeeded) {
            const yesCount = Object.values(v.votes).filter(val => val === 'yes').length;
            const success = yesCount > (v.votersNeeded / 2);
            const finalUpdates = {};
            if (success) {
                finalUpdates[`rooms/${currentRoom}/players/${v.target}/isOut`] = true;
                finalUpdates[`rooms/${currentRoom}/statusMessage`] = `${v.targetName} eliminiert (${yesCount} JA-Stimmen)!`;
            } else {
                finalUpdates[`rooms/${currentRoom}/statusMessage`] = `Anklage gegen ${v.targetName} abgelehnt.`;
            }
            finalUpdates[`rooms/${currentRoom}/currentVote/active`] = false;
            await update(ref(db), finalUpdates);
            
            // Warte 3 Sekunden, damit man das Wahlergebnis sieht
            setTimeout(async () => {
                const finalSnap = await get(ref(db, `rooms/${currentRoom}`));
                if (!checkGameOver(finalSnap.val().players)) {
                    await moveToNextTurn();
                }
            }, 3000);
        }
    };

    async function moveToNextTurn() {
        const snap = await get(ref(db, `rooms/${currentRoom}`));
        const data = snap.val();
        if (!data || data.status === "ended") return;
        const activeIds = Object.keys(data.players).filter(id => !data.players[id].isOut && !data.players[id].hasLeft).sort();
        const currentIdx = activeIds.indexOf(data.turn);
        const nextId = activeIds[(currentIdx + 1) % activeIds.length];
        await update(ref(db, `rooms/${currentRoom}`), { turn: nextId, responder: "" });
    }
    
    window.guessEnemyWord = async () => {
        const snap = await get(ref(db, `rooms/${currentRoom}`));
        const data = snap.val();
        
        // Falls das Spiel schon vorbei ist oder man schon raus ist
        if (!data || data.status === "ended") return;
    
        const wordMaj = data.words.majority.toLowerCase();
        const wordMin = data.words.minority.toLowerCase();
    
        let correct = false;
        let attempts = 0;
    
        // Wir machen 3 Durchläufe
        for (attempts = 1; attempts <= 3; attempts++) {
            let g = prompt(`VERSUCH ${attempts} von 3:\nWie lautet das Wort? (Abbrechen = Ausscheiden)`);
    
            // FALL A: User klickt "Abbrechen"
            if (g === null) break; 
    
            let guess = g.trim().toLowerCase();
            if (guess === "") {
                attempts--; // Leere Eingabe zählt nicht als Versuch
                continue;
            }
    
            // FALL B: Wort ist richtig (Egal ob Mehrheit oder Minderheit -> Minderheit gewinnt)
            if (guess === wordMaj || guess === wordMin) {
                correct = true;
                await update(ref(db, `rooms/${currentRoom}`), { 
                    status: "ended", 
                    statusMessage: `SIEG DER MINDERHEIT! ${myName} hat das Wort "${g}" erraten!` 
                });
                return; // Beendet die Funktion sofort
            } 
    
            // FALL C: Wort ist falsch
            // Wir schicken das Update an alle, damit sie sehen, was geraten wurde
            await update(ref(db, `rooms/${currentRoom}`), { 
                statusMessage: `❌ ${myName} rät falsch: "${g}" (${attempts}/3)` 
            });
    
            if (attempts < 3) {
                alert(`"${g}" war leider falsch. Nächster Versuch!`);
            }
        }
    
        // Wenn wir hier ankommen, war entweder alles falsch oder es wurde abgebrochen
        if (!correct) {
            alert("Du hast es nicht erraten oder abgebrochen. Du bist nun eliminiert.");
            
            // Spieler rauswerfen
            const updates = {};
            updates[`rooms/${currentRoom}/players/${myUid}/isOut`] = true;
            updates[`rooms/${currentRoom}/statusMessage`] = `💀 ${myName} ist beim Raten gescheitert und raus!`;
            
            await update(ref(db), updates);
    
            // Prüfen ob Spiel vorbei, sonst Zug weitergeben
            const finalSnap = await get(ref(db, `rooms/${currentRoom}`));
            if (!checkGameOver(finalSnap.val().players)) {
                await moveToNextTurn();
            }
        }
    };
        
    function checkGameOver(players) {
        if (!players) return false;
        const active = Object.values(players).filter(p => !p.isOut && !p.hasLeft);
        const maj = active.filter(p => p.role === "majority").length;
        const min = active.filter(p => p.role === "minority").length;
        
        let ended = false;
        let msg = "";
        
        if (min === 0) {
            ended = true; msg = "Sieg der Mehrheit! Alle Spione wurden enttarnt.";
        } else if (maj === 0) {
            ended = true; msg = "Sieg der Minderheit! Die Bürger wurden komplett eliminiert.";
        }

        if (ended) {
            update(ref(db, `rooms/${currentRoom}`), { status: "ended", statusMessage: msg });
            return true;
        }
        return false;
    }

    window.exitToMain = async () => {
        await update(ref(db, `rooms/${currentRoom}/players/${myUid}`), { hasLeft: true });
        location.reload();
    };

    window.closeRoom = async () => {
        await remove(ref(db, `rooms/${currentRoom}`));
        location.reload();
    };

    function showEndScreen(data) {
        document.getElementById("game-content").style.display = "none";
        const end = document.getElementById("end-screen");
        end.style.display = "block";
        let html = `<h3>Ergebnis</h3><p>${data.statusMessage}</p><table><tr><th>Name</th><th>Rolle</th><th>Wort</th></tr>`;
        for(let id in data.players) {
            const p = data.players[id];
            html += `<tr style="background:${p.role==='minority'?'#fee':'#efe'}"><td>${p.name}</td><td>${p.role}</td><td>${p.word}</td></tr>`;
        }
        html += `</table><button class="btn btn-danger" onclick="closeRoom()" style="margin-top:20px">Raum löschen</button>`;
        end.innerHTML = html;
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
