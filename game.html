<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Maelist - Mystery Word</title>
    <style>
        :root { --primary: #3498db; --danger: #e74c3c; --success: #2ecc71; --bg: #f4f7f6; }
        body { font-family: sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; margin-top: 50px; }
        #debug-bar { background: #222; color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; text-align: center; }
        .section { display: none; }
        .active { display: block; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 10px; width: 100%; max-width: 200px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        input { width: 80%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; text-align: center; font-size: 18px; }
        .player-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .my-turn { background: #fff9e6; border-left: 4px solid #f1c40f; }
        #word-box { background: #eef7ff; padding: 15px; border-radius: 10px; font-weight: bold; margin: 15px 0; border: 2px dashed var(--primary); }
    </style>
</head>
<body>

<div id="debug-bar">STATUS: <span id="debug-status">Lädt...</span> | USER: <span id="debug-user">---</span></div>

<div class="container">
    <h2>🕵️ Mystery Word</h2>

    <div id="setup-section" class="section">
        <button class="btn btn-primary" onclick="createLobby()">Lobby Erstellen</button>
        <p>— ODER —</p>
        <input type="text" id="join-code" placeholder="CODE">
        <button class="btn btn-success" onclick="joinLobby()">Beitreten</button>
    </div>

    <div id="lobby-section" class="section">
        <h3 id="display-code">CODE: ---</h3>
        <div id="lobby-list" style="text-align:left; margin:15px 0;"></div>
        <button id="start-btn" class="btn btn-success" style="display:none" onclick="startGame()">Spiel Starten</button>
    </div>

    <div id="game-section" class="section">
        <div id="word-box">Ort: <span id="my-word">?</span></div>
        <div id="game-status" style="margin-bottom:10px; font-style:italic;">Warte...</div>
        <div id="player-game-list"></div>
        <button class="btn btn-danger" onclick="guessEnemyWord()" style="background:var(--danger); color:white">Wort erraten!</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.firebasestorage.app",
        messagingSenderId: "87392900284",
        appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let myUid, myName, currentRoom = null, isHost = false;

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            myUid = user.uid;
            document.getElementById("debug-status").innerText = "Eingeloggt";
            const nameSnap = await get(ref(db, `users/${myUid}/username`));
            myName = nameSnap.val() || "Unbekannt";
            document.getElementById("debug-user").innerText = myName;

            // SOFORT Setup zeigen, falls kein Spiel läuft
            showSection("setup-section");
            checkRunningGames();
        } else {
            document.getElementById("debug-status").innerText = "Prüfe Login...";
            setTimeout(() => { if(!auth.currentUser) window.location.href="index.html"; }, 3000);
        }
    });

    async function checkRunningGames() {
        const snap = await get(ref(db, 'rooms'));
        const rooms = snap.val();
        for (let code in rooms) {
            if (rooms[code].status !== "ended" && rooms[code].players?.[myUid]) {
                currentRoom = code;
                isHost = (rooms[code].host === myUid);
                enterRoom(code);
                break;
            }
        }
    }

    window.createLobby = async () => {
        const code = Math.random().toString(36).substring(2, 8).toUpperCase();
        currentRoom = code; isHost = true;
        await set(ref(db, `rooms/${code}`), {
            host: myUid, status: "waiting",
            players: { [myUid]: { name: myName, isOut: false } }
        });
        enterRoom(code);
    };

    window.joinLobby = async () => {
        const code = document.getElementById("join-code").value.trim().toUpperCase();
        const snap = await get(ref(db, `rooms/${code}`));
        if (!snap.exists()) return alert("Code falsch");
        currentRoom = code;
        await update(ref(db, `rooms/${code}/players/${myUid}`), { name: myName, isOut: false });
        enterRoom(code);
    };

    function enterRoom(code) {
        document.getElementById("display-code").innerText = "CODE: " + code;
        if (isHost) document.getElementById("start-btn").style.display = "block";
        onValue(ref(db, `rooms/${code}`), (snap) => {
            const data = snap.val();
            if (!data) return;
            if (data.status === "playing") showSection("game-section");
            else if (data.status === "waiting") showSection("lobby-section");
            
            document.getElementById("lobby-list").innerHTML = Object.values(data.players).map(p => `<div>👤 ${p.name}</div>`).join("");
            if (data.players[myUid]?.word) document.getElementById("my-word").innerText = data.players[myUid].word;
            
            renderGameList(data.players, data.turn);
        });
    }

    function renderGameList(players, turn) {
        const list = document.getElementById("player-game-list");
        list.innerHTML = "";
        for (let id in players) {
            const p = players[id];
            const div = document.createElement("div");
            div.className = `player-item ${id === turn ? 'my-turn' : ''}`;
            div.innerHTML = `<span>${p.name} ${id===turn?'⭐':''}</span>`;
            if (turn === myUid && id !== myUid && !p.isOut) {
                div.innerHTML += `<button onclick="ask('${id}')">Frage</button>`;
            }
            list.appendChild(div);
        }
    }

    window.ask = (tid) => {
        const q = prompt("Deine Frage:");
        if (q) update(ref(db, `rooms/${currentRoom}`), { turn: tid });
    };

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
