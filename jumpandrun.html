<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Maelist - v0.3 Cyber Platformer Arena 🎮</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0; background: #0f0f13;
            font-family: 'Segoe UI', Roboto, sans-serif; color: #fff;
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden; height: 100vh;
        }
        header { 
            text-align: center; padding: 12px; width: 100%; 
            background: linear-gradient(135deg, #1e1e24, #2a2b36); 
            border-bottom: 3px solid #ff4757; z-index: 5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { margin: 0; font-size: 1.4rem; color: #ff4757; text-shadow: 0 0 10px rgba(255, 71, 87, 0.5); letter-spacing: 1px; }
        
        #game-container {
            position: relative; width: 100%; height: 60vh; background: #0b0b0e; 
            border-bottom: 4px solid #ff4757; overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Startbildschirm & Shop Overlay */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 11, 14, 0.95); display: flex;
            align-items: center; justify-content: center; gap: 20px; z-index: 20;
            backdrop-filter: blur(5px); overflow-y: auto; padding: 20px;
        }
        .menu-box { 
            background: #181820; padding: 25px; border-radius: 16px; 
            border: 2px solid #ff4757; text-align: center; 
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.25); width: 340px;
        }
        .shop-box {
            background: #1c1c24; padding: 25px; border-radius: 16px;
            border: 2px solid #00d2d3; width: 360px;
            box-shadow: 0 0 30px rgba(0, 210, 211, 0.25);
        }
        .shop-title { color: #00d2d3; margin: 0 0 15px 0; font-size: 20px; text-transform: uppercase; }
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #252530; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .shop-btn {
            background: #00d2d3; color: #000; border: none; padding: 6px 12px;
            font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .shop-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
        .shop-btn.equipped { background: #2ed573; color: white; }

        .play-btn { 
            background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; border: none; 
            padding: 16px 40px; font-size: 18px; font-weight: bold; border-radius: 30px; 
            cursor: pointer; margin-top: 15px; width: 100%;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }
        .play-btn:disabled { background: #444; box-shadow: none; cursor: not-allowed; }

        /* Live Scoreliste */
        #leaderboard {
            position: absolute; top: 12px; right: 12px; background: rgba(20, 20, 27, 0.85);
            padding: 12px 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            font-family: monospace; font-size: 13px; min-width: 180px; z-index: 10;
        }
        #leaderboard h3 { margin: 0 0 8px 0; color: #ff4757; font-size: 14px; text-transform: uppercase; }
        .leaderboard-entry { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 4px; }

        /* Control Panel */
        #control-panel {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; flex-grow: 1; background: #141419; padding: 20px 30px; z-index: 5;
        }
        .dpad { display: flex; gap: 20px; }
        .ctrl-btn {
            width: 80px; height: 80px; background: linear-gradient(135deg, #2f3542, #1e222b); 
            border: 2px solid #57606f; border-radius: 16px; color: #f1f2f6; 
            font-weight: bold; font-size: 26px; display: flex; align-items: center; justify-content: center;
            touch-action: none; cursor: pointer;
        }
        .jump-btn { 
            background: linear-gradient(135deg, #2ed573, #26af5a); border-color: #26af5a; 
            border-radius: 50%; width: 100px; height: 100px; font-size: 18px;
        }
        
        #lobby-status { font-size: 13px; margin-top: 5px; color: #888; text-align: center; width: 100%; padding: 6px; background: #141419; }
        #economy-bar { font-weight: bold; color: #eccc68; margin-bottom: 10px; font-size: 16px; }
    </style>
</head>
<body>

<header>
    <h1>Maelist Platformer Arena 🎮</h1>
</header>
<div id="lobby-status">Verbinde mit Firebase...</div>

<div id="game-container">
    <div id="start-screen">
        <!-- Hauptmenü -->
        <div class="menu-box">
            <h2 style="margin:0; color:#ff4757; font-size: 22px;">Cyber Arena</h2>
            <p id="player-welcome" style="color:#a4b0be; font-size:13px; margin: 8px 0 15px 0;">Lade Profil...</p>
            <div id="economy-bar">💰 Gold: <span id="gold-display">0</span></div>
            <button class="play-btn" id="join-btn" disabled>Arena betreten</button>
            <div style="font-size: 11px; color:#57606f; margin-top:12px;">Steuerung: A/D oder Buttons<br><b style="color:#00d2d3;">[LEERTASTE] zum Springen / Schwimmen!</b></div>
        </div>

        <!-- Waffen Shop -->
        <div class="shop-box">
            <h3 class="shop-title">⚔️ Waffen-Arsenal</h3>
            <div id="shop-items-list">
                <!-- Wird dynamisch generiert -->
            </div>
        </div>
    </div>

    <div id="leaderboard">
        <h3>🏆 Top Leader</h3>
        <div id="leaderboard-list">Warte auf Spieler...</div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<div id="control-panel">
    <div class="dpad">
        <div class="ctrl-btn" id="btn-left">◀</div>
        <div class="ctrl-btn" id="btn-right">▶</div>
    </div>
    <div class="ctrl-btn jump-btn" id="btn-jump">JUMP</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
        authDomain: "maelist-chat.firebaseapp.com",
        databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
        projectId: "maelist-chat",
        storageBucket: "maelist-chat.firebasestorage.app",
        messagingSenderId: "87392900284",
        appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameContainer = document.getElementById('game-container');
    const lobbyStatus = document.getElementById('lobby-status');
    const startScreen = document.getElementById('start-screen');
    const leaderboardList = document.getElementById('leaderboard-list');

    // GIGANTISCHE WELT (Über 20x größer als Standardauflösung)
    const WORLD_WIDTH = 20000;
    const WORLD_HEIGHT = 6000;
    const GRAVITY = 0.55;
    const MAX_MONSTERS = 45; // Mehr Monster für die riesige Welt

    // Erreichbare Plattformen generieren (Maximal 170px Höhenunterschied)
    const PLATFORMS = [{ x: 0, y: 5900, w: 20000, h: 100 }]; 
    for (let y = 5720; y > 300; y -= 170) {
        for (let x = 100; x < 19500; x += 350 + Math.random() * 300) {
            PLATFORMS.push({ x: x, y: y, w: 160 + Math.random() * 200, h: 25 });
        }
    }

    // Zusätzliche Biome / Riesen-Teiche platziert über die Map verteilt
    const PONDS = [
        { x: 1200, y: 5400, w: 1000, h: 510, name: "Neon-Teich A" },
        { x: 4500, y: 4200, w: 1500, h: 600, name: "Tiefsee-Graben" },
        { x: 9000, y: 3500, w: 1200, h: 700, name: "Säure-Becken" },
        { x: 14000, y: 4800, w: 1800, h: 1100, name: "Großer Ozean" }
    ];

    // Shop-Definitionen
    const WEAPONS_SHOP = {
        "starter": { name: "Rostiger Dolch", cost: 0, color: "#a4b0be" },
        "plasma": { name: "Glow-Säbel", cost: 50, color: "#00d2d3" },
        "cyber": { name: "Cyber-Blaster", cost: 150, color: "#ff4757" },
        "void": { name: "Void-Zerstörer", cost: 400, color: "#purple" }
    };

    let myUid = null;
    let myUsername = "Anonym";
    let myColor = `hsl(${Math.random() * 360}, 85%, 55%)`;
    
    // Spieler-Werte aus der DB geladen
    let myGold = 0;
    let myUnlockedWeapons = ["starter"];
    let myActiveWeapon = "starter";

    let playerX = 300, playerY = 5500;
    let playerVx = 0, playerVy = 0;
    let playerWidth = 32, playerHeight = 46;
    let isGrounded = false;
    let myScore = 0;

    let allPlayers = {};
    let allMonsters = {};
    let isPlaying = false;
    let isHost = false;

    let keys = { a: false, d: false, Space: false };
    let lastFrameTime = 0;

    function resizeCanvas() {
        canvas.width = gameContainer.clientWidth;
        canvas.height = gameContainer.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // SERVER / HOST LOGIC
    function setupHostElection() {
        onValue(ref(db, 'games/platformer/players'), (snap) => {
            if (snap.exists()) {
                allPlayers = snap.val();
                updateLeaderboard();
                const playerIds = Object.keys(allPlayers).sort();
                if (playerIds[0] === myUid) {
                    if (!isHost) { isHost = true; lobbyStatus.innerText = "Du bist Arena-Host 👑"; lobbyStatus.style.color = "#2ecc71"; startHostLogic(); }
                } else {
                    if (isHost) { isHost = false; lobbyStatus.innerText = "Verbunden | Client-Modus"; lobbyStatus.style.color = "#a4b0be"; }
                }
            } else { allPlayers = {}; isHost = false; }
        });
    }

    function startHostLogic() {
        const hostInterval = setInterval(() => {
            if (!isHost) { clearInterval(hostInterval); return; }
            let currentMonsterCount = Object.keys(allMonsters).length;

            if (currentMonsterCount < MAX_MONSTERS) {
                let amountToSpawn = MAX_MONSTERS - currentMonsterCount;
                let newMonsters = {};
                for(let i=0; i < amountToSpawn; i++) { 
                    let mId = "monster_" + Date.now() + "_" + Math.round(Math.random()*1000);
                    let plat = PLATFORMS[Math.floor(Math.random() * (PLATFORMS.length - 5)) + 3];
                    newMonsters[mId] = {
                        x: plat.x + Math.random() * (plat.w - 32), y: plat.y - 28,
                        platX1: plat.x, platX2: plat.x + plat.w,
                        dir: Math.random() > 0.5 ? 1 : -1, speed: 1.2 + Math.random() * 2
                    };
                }
                update(ref(db, 'games/platformer/monsters'), newMonsters);
            }

            let monsterUpdates = {};
            for (let id in allMonsters) {
                let m = allMonsters[id];
                m.x += m.dir * m.speed;
                if (m.x <= m.platX1 || m.x >= m.platX2 - 32) m.dir *= -1;
                monsterUpdates[id] = m;
            }
            if (Object.keys(monsterUpdates).length > 0) set(ref(db, 'games/platformer/monsters'), monsterUpdates);
        }, 40);
    }

    onValue(ref(db, 'games/platformer/monsters'), (snap) => {
        if (snap.exists()) allMonsters = snap.val(); else allMonsters = {};
    });

    // USER-PROFIL LADEN & PERSISTENZ
    onAuthStateChanged(auth, (user) => {
        if (user) {
            myUid = user.uid;
            onValue(ref(db, `users/${myUid}`), (snapshot) => {
                if(snapshot.exists()) {
                    const data = snapshot.val();
                    myUsername = data.username || "Anonym";
                    myGold = data.gold || 0;
                    myUnlockedWeapons = data.unlockedWeapons || ["starter"];
                    myActiveWeapon = data.activeWeapon || "starter";
                }
                renderShop();
                document.getElementById('gold-display').innerText = myGold;
                document.getElementById('player-welcome').innerText = `Eingeloggt als: ${myUsername}`;
                
                setupHostElection();
                document.getElementById('join-btn').disabled = false;
            });
        } else {
            window.location.href = "überleitung.html";
        }
    });

    function renderShop() {
        const listContainer = document.getElementById('shop-items-list');
        listContainer.innerHTML = "";
        for (let id in WEAPONS_SHOP) {
            const item = WEAPONS_SHOP[id];
            const isUnlocked = myUnlockedWeapons.includes(id);
            const isActive = myActiveWeapon === id;

            let btnHtml = "";
            if (isActive) {
                btnHtml = `<button class="shop-btn equipped" disabled>Aktiv</button>`;
            } else if (isUnlocked) {
                btnHtml = `<button class="shop-btn" onclick="window.equipWeapon('${id}')">Ausrüsten</button>`;
            } else {
                const canAfford = myGold >= item.cost;
                btnHtml = `<button class="shop-btn" ${canAfford ? '' : 'disabled'} onclick="window.buyWeapon('${id}', ${item.cost})">🛒 ${item.cost} G</button>`;
            }

            listContainer.innerHTML += `
                <div class="shop-item">
                    <div>
                        <b style="color:${item.color}">${item.name}</b>
                        <div style="font-size:10px; color:#aaa;">Style-Upgrade für Arena</div>
                    </div>
                    ${btnHtml}
                </div>
            `;
        }
    }

    // Globale Funktionen für Klicks im Shop
    window.buyWeapon = function(id, cost) {
        if (myGold >= cost && !myUnlockedWeapons.includes(id)) {
            myGold -= cost;
            myUnlockedWeapons.push(id);
            update(ref(db, `users/${myUid}`), { gold: myGold, unlockedWeapons: myUnlockedWeapons, activeWeapon: id });
        }
    };
    window.equipWeapon = function(id) {
        if (myUnlockedWeapons.includes(id)) {
            update(ref(db, `users/${myUid}`), { activeWeapon: id });
        }
    };

    async function startNewLife() {
        myScore = 0;
        playerX = 200 + Math.random() * 800;
        playerY = 5500;
        playerVx = 0; playerVy = 0;

        const myGameRef = ref(db, `games/platformer/players/${myUid}`);
        await set(myGameRef, { 
            username: myUsername, 
            color: myColor, 
            x: playerX, y: playerY, 
            score: myScore,
            weapon: WEAPONS_SHOP[myActiveWeapon].name 
        });
        onDisconnect(myGameRef).remove();
        isPlaying = true;
    }

    function updateLeaderboard() {
        let list = [];
        for (let id in allPlayers) list.push(allPlayers[id]);
        list.sort((a, b) => (b.score || 0) - (a.score || 0));
        let html = "";
        list.slice(0, 5).forEach((p, i) => {
            html += `<div class="leaderboard-entry"><span>${i+1}. ${p.username}</span><b>${p.score || 0}</b></div>`;
        });
        leaderboardList.innerHTML = html || "Keine Spieler";
    }

    function triggerDeath() {
        isPlaying = false;
        keys.Space = false;
        set(ref(db, `games/platformer/players/${myUid}`), null);
        
        // Sofortiger Neustart-Screen ohne lästige Werbung
        startScreen.style.display = 'flex'; 
        document.getElementById('join-btn').innerText = "Erneut versuchen"; 
    }

    setInterval(() => {
        if (!myUid || !isPlaying) return;
        update(ref(db, `games/platformer/players/${myUid}`), { x: playerX, y: playerY, score: myScore });
    }, 30);

    // TASTATUR INPUTS (Pfeil-Hoch komplett blockiert)
    window.addEventListener('keydown', (e) => { 
        if (e.code === 'Space') { e.preventDefault(); keys.Space = true; }
        if (e.key === 'a' || e.key === 'A') keys.a = true;
        if (e.key === 'd' || e.key === 'D') keys.d = true;
    });
    window.addEventListener('keyup', (e) => { 
        if (e.code === 'Space') keys.Space = false;
        if (e.key === 'a' || e.key === 'A') keys.a = false;
        if (e.key === 'd' || e.key === 'D') keys.d = false;
    });

    const setupMobileBtn = (id, keyName) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; }, { passive: false });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
    };
    setupMobileBtn('btn-left', 'a');
    setupMobileBtn('btn-right', 'd');
    setupMobileBtn('btn-jump', 'Space');

    function checkCollision(rect1, rect2) {
        return rect1.x < rect2.x + rect2.w && rect1.x + rect1.w > rect2.x &&
               rect1.y < rect2.y + rect2.h && rect1.y + rect1.h > rect2.y;
    }

    // GAME LOOP
    function updateLoop(timestamp) {
        requestAnimationFrame(updateLoop);
        let elapsed = timestamp - lastFrameTime;
        if (elapsed < 1000 / 60) return; 
        lastFrameTime = timestamp - (elapsed % (1000 / 60));

        let camX = WORLD_WIDTH / 2; let camY = WORLD_HEIGHT / 2;

        if (isPlaying) {
            if (keys.a) playerVx = -6;
            else if (keys.d) playerVx = 6;
            else playerVx = 0;

            // Prüfen ob im Teich/Wasser
            let inWater = false;
            for (let pond of PONDS) {
                if (playerX < pond.x + pond.w && playerX + playerWidth > pond.x &&
                    playerY < pond.y + pond.h && playerY + playerHeight > pond.y) {
                    inWater = true; break;
                }
            }

            // Physik anpassen basierend auf Umgebung (Wasser vs Land)
            if (inWater) {
                playerVy += 0.15; // Geringe Gravitation im Wasser
                if (playerVy > 2.5) playerVy = 2.5; // Bremswirkung im Wasser
                if (keys.Space) playerVy = -3.5; // Gedrückt halten zum Schwimmen
            } else {
                if (keys.Space && isGrounded) {
                    playerVy = -14.5; // Mächtiger Sprung um Plattformen spielend zu erreichen
                    isGrounded = false;
                }
                playerVy += GRAVITY;
            }

            playerX += playerVx;
            if (playerX < 0) playerX = 0;
            if (playerX > WORLD_WIDTH - playerWidth) playerX = WORLD_WIDTH - playerWidth;

            playerY += playerVy;
            isGrounded = false;

            let myBox = { x: playerX, y: playerY, w: playerWidth, h: playerHeight };

            // Plattformen kollidieren
            for (let plat of PLATFORMS) {
                if (checkCollision(myBox, plat)) {
                    if (playerVy > 0 && playerY + playerHeight - playerVy <= plat.y + 12) {
                        playerY = plat.y - playerHeight; playerVy = 0; isGrounded = true;
                    } else if (playerVy < 0 && playerY - playerVy >= plat.y + plat.h - 10) {
                        playerY = plat.y + plat.h; playerVy = 0;
                    }
                }
            }

            if (playerY > WORLD_HEIGHT) triggerDeath();

            // Monster Kills -> Bringt Gold!
            for (let mId in allMonsters) {
                let m = allMonsters[mId];
                let mBox = { x: m.x, y: m.y, w: 32, h: 28 };
                if (checkCollision(myBox, mBox)) {
                    if (playerVy > 0 && playerY + playerHeight - playerVy <= m.y + 12) {
                        playerVy = -9.5; 
                        myScore += 10;
                        myGold += 5; // Gold gutgeschrieben!
                        update(ref(db, `users/${myUid}`), { gold: myGold });
                        set(ref(db, `games/platformer/monsters/${mId}`), null); 
                    } else {
                        triggerDeath();
                    }
                }
            }

            camX = playerX; camY = playerY;
        }

        // --- ZEICHNEN ---
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        let zoom = Math.max(canvas.width / 1100, canvas.height / 650);
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(zoom, zoom); ctx.translate(-camX, -camY);

        // Raster-Hintergrund
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)'; ctx.lineWidth = 1;
        for (let x = 0; x < WORLD_WIDTH; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_HEIGHT); ctx.stroke(); }

        // Teiche/Wasserflächen zeichnen
        for (let pond of PONDS) {
            ctx.fillStyle = 'rgba(0, 210, 211, 0.25)';
            ctx.fillRect(pond.x, pond.y, pond.w, pond.h);
            ctx.strokeStyle = '#00d2d3'; ctx.lineWidth = 2;
            ctx.strokeRect(pond.x, pond.y, pond.w, pond.h);
        }

        // Plattformen
        ctx.fillStyle = '#1e1e24';
        for (let plat of PLATFORMS) {
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.fillStyle = '#ff4757'; ctx.fillRect(plat.x, plat.y, plat.w, 3); ctx.fillStyle = '#1e1e24';
        }

        // Monster
        ctx.fillStyle = '#ff9f43';
        for (let mId in allMonsters) {
            let m = allMonsters[mId];
            ctx.fillRect(m.x, m.y, 32, 28);
        }

        // Mitspieler & Waffen-Tags rendern
        for (let pId in allPlayers) {
            let p = allPlayers[pId];
            let isMe = (pId === myUid);
            let drawX = isMe ? playerX : p.x; let drawY = isMe ? playerY : p.y;

            ctx.fillStyle = isMe ? myColor : '#3498db';
            ctx.fillRect(drawX, drawY, playerWidth, playerHeight);

            // Waffe optisch unter dem Namen anzeigen
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(p.username || "User", drawX + playerWidth/2, drawY - 24);
            
            ctx.fillStyle = '#eccc68'; ctx.font = '9px monospace';
            ctx.fillText(`⚔️ ${p.weapon || "Dolch"}`, drawX + playerWidth/2, drawY - 12);
        }

        ctx.restore();
    }

    document.getElementById('join-btn').onclick = () => {
        startScreen.style.display = 'none';
        startNewLife();
    };

    requestAnimationFrame((timestamp) => { lastFrameTime = timestamp; updateLoop(timestamp); });
</script>

</body>
</html>
