<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Maelist - Secure Entry</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #121212; color: white; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #333; background: #2c2c2c; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #075e54; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Maelist Vault</h2>
        <input type="email" id="email" placeholder="E-Mail">
        <input type="password" id="pass" placeholder="Passwort">
        <input type="text" id="username" placeholder="Nutzername">
        <button onclick="handleAuth('login')">Einloggen</button>
        <button onclick="handleAuth('reg')" style="background: #25d366; margin-top: 8px;">Konto erstellen</button>
        <p id="status"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
            authDomain: "maelist-chat.firebaseapp.com",
            databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
            projectId: "maelist-chat",
            storageBucket: "maelist-chat.firebasestorage.app",
            messagingSenderId: "87392900284",
            appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.handleAuth = async (type) => {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("pass").value;
            const user = document.getElementById("username").value;

            try {
                if (type === 'reg') {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    const salt = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));
                    
                    // Wir generieren einen Public Key für andere Nutzer
                    // (Echte deterministische EC-Keys benötigen oft Libs, hier vereinfachtes Prinzip)
                    const keyPair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
                    const pubExport = await crypto.subtle.exportKey("spki", keyPair.publicKey);

                    await set(ref(db, `users/${res.user.uid}`), { username: user });
                    await set(ref(db, `security/salts/${res.user.uid}`), salt);
                    await set(ref(db, `security/publicKeys/${res.user.uid}`), btoa(String.fromCharCode(...new Uint8Array(pubExport))));
                    alert("Account erstellt!");
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                    sessionStorage.setItem("vault_pass", pass);
                    window.location.href = "chat.html";
                }
            } catch (e) { document.getElementById("status").innerText = e.message; }
        };
    </script>
</body>
</html>
