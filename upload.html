<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Studio Dashboard</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #09090b;
      --bg-panel: #18181b;
      --bg-sidebar: #121215;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Inter, sans-serif; }
    body { background: var(--bg-dark); color: var(--text); height: 100vh; overflow: hidden; display: flex; }

    /* Lade-Bildschirm während Auth-Prüfung */
    #authLoader {
      position: fixed; inset: 0; background: var(--bg-dark);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; font-size: 16px; color: var(--text-muted);
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* App Container */
    .app-container { display: flex; width: 100vw; height: 100vh; }

    /* Sidebar File Explorer */
    .sidebar { width: 300px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    
    .user-profile { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .user-info { font-size: 14px; font-weight: 600; color: #fff; }
    .site-link { font-size: 12px; color: var(--accent); text-decoration: none; display: inline-block; margin-top: 4px; }
    .site-link:hover { text-decoration: underline; }

    .explorer-toolbar { padding: 12px 16px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); }
    
    .file-tree { flex: 1; overflow-y: auto; padding: 12px; }
    .tree-item {
      padding: 8px 10px; border-radius: 6px; font-size: 13px; color: var(--text-muted);
      cursor: pointer; display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;
      transition: background 0.15s ease;
    }
    .tree-item:hover, .tree-item.active { background: var(--border); color: #fff; }
    .tree-item .actions { display: none; gap: 6px; }
    .tree-item:hover .actions { display: flex; }
    .tree-item .del-btn { color: var(--danger); cursor: pointer; font-size: 14px; }

    /* Buttons */
    .btn {
      flex: 1; background: var(--accent); color: #fff; border: none; padding: 8px;
      border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
    .btn-secondary:hover { background: var(--border); color: #fff; }

    /* Editor Window */
    .editor-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); }
    .editor-header {
      height: 48px; background: var(--bg-panel); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
    }
    .active-filename { font-size: 14px; font-weight: 600; color: var(--text-muted); }

    textarea#codeEditor {
      flex: 1; background: var(--bg-dark); color: #f4f4f5; border: none; padding: 20px;
      font-family: 'Fira Code', Monaco, 'Courier New', monospace; font-size: 14px; line-height: 1.6;
      resize: none; outline: none; tab-size: 2;
    }
    textarea#codeEditor:disabled { opacity: 0.4; cursor: not-allowed; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Lade-Screen während Statusprüfung -->
  <div id="authLoader">
    <div class="spinner"></div>
    <div>Login-Status wird überprüft...</div>
  </div>

  <div class="app-container">
    <!-- Sidebar / Dateisystem -->
    <div class="sidebar">
      <div class="user-profile">
        <div>
          <div class="user-info" id="displayUsername">Lade Profil...</div>
          <a href="#" id="liveLink" target="_blank" class="site-link">Website öffnen ↗</a>
        </div>
        <button class="btn btn-secondary" onclick="logout()" style="flex:none; padding:6px 10px;">Logout</button>
      </div>

      <div class="explorer-toolbar">
        <button class="btn" onclick="promptCreateFile()">+ Datei / Ordner</button>
        <button class="btn btn-secondary" onclick="triggerFileUpload()">Bild Upload</button>
        <input type="file" id="assetUpload" class="hidden" onchange="handleFileUpload(event)">
      </div>

      <div class="file-tree" id="fileTree"></div>
    </div>

    <!-- Editor-Bereich -->
    <div class="editor-area">
      <div class="editor-header">
        <span class="active-filename" id="currentFileLabel">Keine Datei ausgewählt</span>
        <button class="btn" onclick="saveCurrentFile()" style="flex:none; padding:6px 20px;">Speichern</button>
      </div>
      <textarea id="codeEditor" placeholder="Wähle oder erstelle eine Datei im linken Explorer..." disabled></textarea>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "DEIN_API_KEY",
      authDomain: "DEIN_PROJEKT.firebaseapp.com",
      databaseURL: "https://DEIN_PROJEKT.firebaseio.com",
      projectId: "DEIN_PROJEKT"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let currentUsername = null;
    let activeFilePath = null;
    let filesCache = {};

    // Prüfe den Auth-Status sauber über den Event-Listener
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        
        try {
          const snap = await db.ref(`users/${user.uid}/username`).once('value');
          currentUsername = snap.val();

          if (!currentUsername) {
            alert("Fehler: Kein Username für diesen Account gefunden.");
            window.location.href = 'index.html';
            return;
          }

          document.getElementById('displayUsername').innerText = "@" + currentUsername;
          document.getElementById('liveLink').href = `https://maelisthebest.github.io/${currentUsername}`;

          loadUserFiles();

          // Lade-Screen ausblenden, sobald alles bereit ist
          document.getElementById('authLoader').classList.add('hidden');
        } catch (e) {
          console.error("Fehler beim Laden der Nutzerdaten:", e);
          window.location.href = 'index.html';
        }
      } else {
        // Nicht eingeloggt -> sofort zur Login-Seite weiterleiten
        window.location.href = 'index.html';
      }
    });

    function logout() {
      auth.signOut().then(() => {
        window.location.href = 'index.html';
      });
    }

    function loadUserFiles() {
      db.ref(`usersites/${currentUsername}/files`).on('value', (snapshot) => {
        filesCache = snapshot.val() || {};
        renderFileTree();
      });
    }

    function renderFileTree() {
      const treeContainer = document.getElementById('fileTree');
      treeContainer.innerHTML = '';

      const keys = Object.keys(filesCache);
      if (keys.length === 0) {
        treeContainer.innerHTML = '<div style="color:var(--text-muted); font-size:12px; padding:8px;">Keine Dateien vorhanden. Erstelle eine neue Datei!</div>';
        return;
      }

      keys.forEach(key => {
        const file = filesCache[key];
        const item = document.createElement('div');
        item.className = `tree-item ${activeFilePath === file.path ? 'active' : ''}`;
        
        item.innerHTML = `
          <span>${file.isText ? '📄' : '🖼️'} ${file.path}</span>
          <div class="actions">
            <span class="del-btn" onclick="deleteFile('${key}', event)" title="Löschen">🗑️</span>
          </div>
        `;

        item.onclick = () => openFile(file);
        treeContainer.appendChild(item);
      });
    }

    function openFile(file) {
      activeFilePath = file.path;
      document.getElementById('currentFileLabel').innerText = file.path;
      const editor = document.getElementById('codeEditor');

      if (file.isText) {
        editor.disabled = false;
        editor.value = file.content || '';
      } else {
        editor.disabled = true;
        editor.value = "[Bild/Asset Datei - Vorschau im Code-Editor nicht möglich]";
      }
      renderFileTree();
    }

    async function saveCurrentFile() {
      if (!activeFilePath) return;
      
      const safeKey = activeFilePath.replace(/[\.\#\$\[\]\/]/g, '_');
      const content = document.getElementById('codeEditor').value;

      await db.ref(`usersites/${currentUsername}/files/${safeKey}`).update({
        content: content
      });

      alert("Änderungen gespeichert!");
    }

    function promptCreateFile() {
      const path = prompt("Gib den Pfad ein (z. B. 'index.html' oder 'css/style.css'):");
      if (!path) return;

      const safeKey = path.replace(/[\.\#\$\[\]\/]/g, '_');
      
      db.ref(`usersites/${currentUsername}/files/${safeKey}`).set({
        path: path,
        isText: true,
        content: "<!-- Neue Datei -->\n"
      });
    }

    function triggerFileUpload() { 
      document.getElementById('assetUpload').click(); 
    }

    async function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const defaultPath = `images/${file.name}`;
      const path = prompt("Zielpfad für die Datei:", defaultPath);
      if (!path) return;

      const reader = new FileReader();
      reader.onload = async () => {
        const safeKey = path.replace(/[\.\#\$\[\]\/]/g, '_');
        await db.ref(`usersites/${currentUsername}/files/${safeKey}`).set({
          path: path,
          isText: false,
          dataUrl: reader.result
        });
      };
      reader.readAsDataURL(file);
    }

    async function deleteFile(key, event) {
      event.stopPropagation();
      if (confirm("Möchtest du diese Datei wirklich löschen?")) {
        await db.ref(`usersites/${currentUsername}/files/${key}`).remove();
        if (filesCache[key] && filesCache[key].path === activeFilePath) {
          activeFilePath = null;
          document.getElementById('codeEditor').value = '';
          document.getElementById('codeEditor').disabled = true;
          document.getElementById('currentFileLabel').innerText = "Keine Datei ausgewählt";
        }
      }
    }
  </script>
</body>
</html>
