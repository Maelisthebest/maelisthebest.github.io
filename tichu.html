<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maelist - Tichu Game</title>
    <style>
        :root {
            --card-w: 80px;
            --card-h: 120px;
            --bg-color: #0d3b2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            background: var(--bg-color);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        /* Top Navigation / Header */
        header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .btn-action {
            background: #25d366;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-action:hover { background: #1ebd56; }

        /* Spielfeld Grid Layout */
        #table-container {
            width: 100%;
            max-width: 1000px;
            height: 620px;
            background: #145240;
            border: 4px solid #075e54;
            border-radius: 12px;
            display: grid;
            grid-template-rows: 1fr 2fr 1.2fr;
            grid-template-columns: 1fr 2.5fr 1fr;
            gap: 10px;
            padding: 10px;
        }

        .player-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }

        .player-top    { grid-area: 1 / 2 / 2 / 3; }
        .player-left   { grid-area: 2 / 1 / 3 / 2; }
        .player-right  { grid-area: 2 / 3 / 3 / 4; }
        .player-bottom { grid-area: 3 / 2 / 4 / 3; background: rgba(0,0,0,0.2); border-style: solid; }

        .table-center {
            grid-area: 2 / 2 / 3 / 3;
            border: 2px solid #25d366;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Karten Design */
        .card {
            width: var(--card-w);
            height: var(--card-h);
            border-radius: 6px;
            background-size: cover;
            background-position: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.2s, border 0.2s;
            user-select: none;
            display: inline-block;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card.selected {
            transform: translateY(-16px);
            border: 3px solid #ffcc00;
        }

        /* Handkarten Fächer */
        .hand {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            max-width: 100%;
            max-height: 140px;
            overflow-y: auto;
            padding: 5px;
        }

        #played-cards {
            display: flex;
            gap: 8px;
            min-height: var(--card-h);
            align-items: center;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn-pass { background: #d32f2f; }
        .btn-pass:hover { background: #b71c1c; }
    </style>
</head>
<body>

    <header>
        <div>
            <h2>Maelist Tichu</h2>
            <small id="user-display">Eingeloggt als: ...</small>
        </div>
        <div>
            <label for="room-select">Raum: </label>
            <input type="text" id="room-id" value="raum1" style="width: 80px; padding: 4px;">
            <select id="seat-select" style="padding: 4px;">
                <option value="0">Sitz 1 (Unten)</option>
                <option value="1">Sitz 2 (Rechts)</option>
                <option value="2">Sitz 3 (Oben)</option>
                <option value="3">Sitz 4 (Links)</option>
            </select>
            <button class="btn-action" id="btn-join">Beitreten</button>
            <button class="btn-action" id="btn-deal">Mischen & Verteilen</button>
        </div>
    </header>

    <div id="table-container">
        <!-- Partner Oben -->
        <div class="player-box player-top">
            <h3>Spieler 3 (Partner)</h3>
            <span id="count-2">Karten: 0</span>
        </div>

        <!-- Gegner Links -->
        <div class="player-box player-left">
            <h3>Spieler 4</h3>
            <span id="count-3">Karten: 0</span>
        </div>

        <!-- Mitte / Strich -->
        <div class="table-center">
            <span style="font-size: 12px; color: #888;">TISCHMITTE</span>
            <div id="played-cards"></div>
            <div class="controls">
                <button class="btn-action" id="btn-play">Legen</button>
                <button class="btn-action btn-pass" id="btn-pass">Passen</button>
            </div>
        </div>

        <!-- Gegner Rechts -->
        <div class="player-box player-right">
            <h3>Spieler 2</h3>
            <span id="count-1">Karten: 0</span>
        </div>

        <!-- Eigene Hand Unten -->
        <div class="player-box player-bottom">
            <h4 style="margin-bottom: 5px;">Deine Handkarten</h4>
            <div class="hand" id="my-hand"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // Deine exakt identische Firebase Config aus der index.html
        const firebaseConfig = {
            apiKey: "AIzaSyCp6Aon4b-sLmUdRaf3sdyKN0y4QK2Zil4",
            authDomain: "maelist-chat.firebaseapp.com",
            databaseURL: "https://maelist-chat-default-rtdb.firebaseio.com/",
            projectId: "maelist-chat",
            storageBucket: "maelist-chat.firebasestorage.app",
            messagingSenderId: "87392900284",
            appId: "1:87392900284:web:fd39fe7161bfa828976cb9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // 1. Zuordnung aller 56 Karten im Ordner 'tichukarten/'
        const DECK = [];
        let cardId = 0;

        for (let r = 1; r <= 4; r++) {
            for (let c = 1; c <= 14; c++) {
                DECK.push({
                    id: cardId++,
                    // Greift exakt auf das Format deiner WebP-Dateien im Ordner 'tichukarten/' zu
                    file: `tichukarten/row-${r}-column-${c}`
                });
            }
        }

        let currentRoom = "raum1";
        let mySeat = 0;
        let selectedCards = [];

        // Auth-Prüfung
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById("user-display").innerText = `Eingeloggt mit ID: ${user.uid.substring(0, 6)}...`;
            } else {
                window.location.href = "index.html"; // Zurück zum Login
            }
        });

        // Raum Beitreten
        document.getElementById("btn-join").onclick = () => {
            currentRoom = document.getElementById("room-id").value;
            mySeat = parseInt(document.getElementById("seat-select").value);
            listenToRoom();
        };

        // Mischen & Verteilen (Realtime DB)
        document.getElementById("btn-deal").onclick = () => {
            const shuffled = [...DECK].sort(() => Math.random() - 0.5);
            const hands = {
                0: shuffled.slice(0, 14).map(c => c.id),
                1: shuffled.slice(14, 28).map(c => c.id),
                2: shuffled.slice(28, 42).map(c => c.id),
                3: shuffled.slice(42, 56).map(c => c.id)
            };

            set(ref(db, `tichu_rooms/${currentRoom}`), {
                hands: hands,
                table: [],
                currentTurn: 0
            });
        };

        // Karte Auswählen
        window.toggleCard = function(id, el) {
            const idx = selectedCards.indexOf(id);
            if (idx > -1) {
                selectedCards.splice(idx, 1);
                el.classList.remove("selected");
            } else {
                selectedCards.push(id);
                el.classList.add("selected");
            }
        };

        // Ausspielen
        document.getElementById("btn-play").onclick = () => {
            if (selectedCards.length === 0) return;

            update(ref(db, `tichu_rooms/${currentRoom}`), {
                table: selectedCards
            });

            selectedCards = [];
        };

        // Raum auslesen
        function listenToRoom() {
            const roomRef = ref(db, `tichu_rooms/${currentRoom}`);
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // Eigene Karten rendern
                if (data.hands && data.hands[mySeat]) {
                    renderHand(data.hands[mySeat]);
                }

                // Kartenanzahl der anderen aktualisieren
                for (let i = 0; i < 4; i++) {
                    if (i !== mySeat && data.hands && data.hands[i]) {
                        const cnt = document.getElementById(`count-${i}`);
                        if (cnt) cnt.innerText = `Karten: ${data.hands[i].length}`;
                    }
                }

                // Tischmitte rendern
                if (data.table) {
                    renderTable(data.table);
                }
            });
        }

        function renderHand(cardIds) {
            const handEl = document.getElementById("my-hand");
            handEl.innerHTML = "";
            cardIds.forEach(id => {
                const card = DECK[id];
                const div = document.createElement("div");
                div.className = "card";
                div.style.backgroundImage = `url('${card.file}')`;
                div.onclick = () => toggleCard(id, div);
                handEl.appendChild(div);
            });
        }

        function renderTable(cardIds) {
            const tableEl = document.getElementById("played-cards");
            tableEl.innerHTML = "";
            cardIds.forEach(id => {
                const card = DECK[id];
                const div = document.createElement("div");
                div.className = "card";
                div.style.backgroundImage = `url('${card.file}')`;
                tableEl.appendChild(div);
            });
        }
    </script>
</body>
</html>
